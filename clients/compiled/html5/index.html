<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daily GK</title>
  <style>
    :root {
      --bg: #0f131a;
      --card: #181f2b;
      --card-hover: #222b3b;
      --hl: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --text: #f8fafc;
      --muted: #94a3b8;
      --orange: #d97706;
      --bar-bg: #0b0e14;
      --border: #263142;
      --hdr-h: 30px;
      --sft-h: 32px;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #05070a;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Container Shell */
    #app {
      width: 100%;
      height: 100%;
      max-width: 440px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top Navigation Header */
    .header {
      height: var(--hdr-h);
      background: var(--hl);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      z-index: 20;
    }
    .header.red { background: var(--red); }
    .header-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }
    .header-badge {
      font-size: 10px;
      background: rgba(0, 0, 0, 0.28);
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }

    /* Content Viewport */
    .viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 6px;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    /* Bottom Softkey Bar */
    .softbar {
      height: var(--sft-h);
      background: var(--bar-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      flex-shrink: 0;
      z-index: 30;
    }
    .soft-btn {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 4px;
    }
    #softLeft { justify-content: flex-start; color: var(--hl); }
    #softCenter { justify-content: center; color: var(--green); }
    #softRight { justify-content: flex-end; color: var(--muted); }

    /* Interactive Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .card.focused {
      background: var(--card-hover);
      border-color: var(--hl);
    }
    .card.selected {
      background: var(--hl) !important;
      border-color: var(--hl) !important;
      color: #fff;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.35;
    }

    /* Action Buttons */
    .action-btn {
      display: block;
      width: 100%;
      background: var(--hl);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      text-align: center;
      padding: 8px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin: 6px 0;
    }
    .action-btn:active { opacity: 0.85; }

    /* Question & Option Cards */
    .q-box {
      background: var(--card);
      border-radius: var(--radius);
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .opt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 11.5px;
      gap: 6px;
    }
    .opt-card.focused { border-color: var(--hl); background: var(--card-hover); }
    .opt-card.correct { background: var(--green) !important; border-color: var(--green) !important; }
    .opt-card.wrong { background: var(--red) !important; border-color: var(--red) !important; }
    
    .opt-badge {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .opt-content {
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* Key shortcut indicators on Desktop (placed neatly on the far right) */
    .key-hint {
      display: none;
      font-size: 9px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--muted);
      padding: 2px 5px;
      border-radius: 3px;
      margin-left: auto;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Modal Layer */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: var(--sft-h);
      background: rgba(8, 11, 16, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      z-index: 50;
    }
    .modal-card {
      width: 100%;
      max-width: 250px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .modal-header {
      background: var(--hl);
      padding: 6px 8px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .modal-header.red { background: var(--red); }
    .modal-body {
      padding: 8px;
      font-size: 11px;
    }
    .modal-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--green);
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      border-radius: 4px;
      margin: 6px 0;
    }

    .pak-canvas {
      image-rendering: pixelated;
      max-width: 100%;
      display: block;
    }

    /* ============================================================== */
    /* Device Layout Profile: Compact Feature Phones (128x160 / KaiOS) */
    /* ============================================================== */
    body[data-device="feature-phone"] #app {
      max-width: 100%;
      height: 100%;
      border-radius: 0;
    }
    body[data-device="feature-phone"] {
      --hdr-h: 22px;
      --sft-h: 22px;
      font-size: 10px;
    }
    body[data-device="feature-phone"] .header {
      font-size: 10.5px;
      padding: 0 4px;
    }
    body[data-device="feature-phone"] .soft-btn {
      font-size: 9.5px;
    }
    body[data-device="feature-phone"] .card {
      padding: 4px 6px;
      margin-bottom: 4px;
    }
    body[data-device="feature-phone"] .card-title {
      font-size: 10.5px;
    }
    body[data-device="feature-phone"] .card-sub {
      font-size: 9px;
    }
    body[data-device="feature-phone"] .opt-card {
      padding: 3px 4px;
      margin-bottom: 3px;
      font-size: 10px;
    }
    body[data-device="feature-phone"] .opt-badge {
      width: 14px;
      height: 14px;
      min-width: 14px;
      font-size: 8px;
    }
    body[data-device="feature-phone"] .action-btn {
      padding: 5px;
      font-size: 10px;
    }

    /* ============================================================== */
    /* Device Layout Profile: Touch Mobile (Smartphones / Tablets)     */
    /* ============================================================== */
    body[data-device="touch-mobile"] #app {
      max-width: 480px;
      height: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    body[data-device="touch-mobile"] {
      --hdr-h: 40px;
      --sft-h: 46px;
      --radius: 8px;
      font-size: 13px;
    }
    body[data-device="touch-mobile"] .header {
      font-size: 14px;
      padding: 0 12px;
    }
    body[data-device="touch-mobile"] .softbar {
      padding: 0 12px;
    }
    body[data-device="touch-mobile"] .soft-btn {
      font-size: 13px;
      padding: 0 10px;
    }
    body[data-device="touch-mobile"] .card {
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    body[data-device="touch-mobile"] .card-title {
      font-size: 13.5px;
    }
    body[data-device="touch-mobile"] .card-sub {
      font-size: 11.5px;
    }
    body[data-device="touch-mobile"] .opt-card {
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 13px;
      min-height: 44px;
    }
    body[data-device="touch-mobile"] .opt-badge {
      width: 22px;
      height: 22px;
      min-width: 22px;
      font-size: 11px;
    }
    body[data-device="touch-mobile"] .action-btn {
      padding: 12px;
      font-size: 13.5px;
      margin: 10px 0;
    }

    /* ============================================================== */
    /* Device Layout Profile: Desktop                                  */
    /* ============================================================== */
    body[data-device="desktop"] #app {
      height: 90vh;
      max-height: 640px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }
    body[data-device="desktop"] .key-hint {
      display: inline-block;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Top Header -->
    <div class="header" id="headerBar">
      <div class="header-title" id="headerTitle">Daily GK</div>
      <div class="header-badge" id="headerBadge">Tutorial</div>
    </div>

    <!-- Active Viewport -->
    <div class="viewport" id="viewport"></div>

    <!-- Modal Layer -->
    <div class="modal-overlay" id="modalLayer" style="display: none;"></div>

    <!-- Bottom Controls -->
    <div class="softbar" id="softbar">
      <div class="soft-btn" id="softLeft">Tutorial</div>
      <div class="soft-btn" id="softCenter">Open .PAK</div>
      <div class="soft-btn" id="softRight">Exit</div>
    </div>

    <!-- Hidden Native File Picker -->
    <input type="file" id="pakFileInput" accept=".pak" style="display: none;">
  </div>

  <script>
    const QUESTION_W = 224;
    const QUESTION_BYTES_ROW = 28;
    const OPTION_W = 208;
    const OPTION_BYTES_ROW = 26;
    const TOTAL_TUTORIAL_SLIDES = 4;

    const STATE = {
      TUTORIAL: 0,
      FILE_LIST: 1,
      QUESTION: 2,
      FEEDBACK: 3,
      MENU: 4,
      QUESTION_MENU: 5,
      ABOUT: 6,
      CONFIRM_EXIT: 7,
      INPUT_DIALOG: 8,
      SCORECARD: 9
    };

    const INPUT_TARGET = {
      FILE_SEARCH: 0,
      Q_SEARCH: 1,
      JUMP_Q: 2
    };

    const app = {
      state: STATE.TUTORIAL,
      prevState: STATE.TUTORIAL,
      readMode: "quiz",
      pakList: [],
      filteredIndices: [],
      selectedFileIdx: 0,
      searchFilter: "",

      tutorialIdx: 0,
      menuSelectedIdx: 0,
      qmenuSelectedIdx: 0,

      currentPak: null,
      totalQuestions: 0,
      indexOffset: 0,
      searchOffset: 0,
      payloadBase: 0,

      currentQId: 0,
      curEntry: null,
      selectedOpt: 0,
      userChoice: -1,
      score: 0,

      inputTarget: INPUT_TARGET.FILE_SEARCH,
      inputBuffer: ""
    };

    const elViewport = document.getElementById("viewport");
    const elModal = document.getElementById("modalLayer");
    const elHeaderBar = document.getElementById("headerBar");
    const elHeaderTitle = document.getElementById("headerTitle");
    const elHeaderBadge = document.getElementById("headerBadge");
    const elSoftLeft = document.getElementById("softLeft");
    const elSoftCenter = document.getElementById("softCenter");
    const elSoftRight = document.getElementById("softRight");
    const elFileInput = document.getElementById("pakFileInput");

    function updateDeviceProfile() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

      let profile = "desktop";
      if (w <= 240 || h <= 320) {
        profile = "feature-phone";
      } else if (isTouch && w <= 768) {
        profile = "touch-mobile";
      }
      document.body.dataset.device = profile;
    }
    window.addEventListener("resize", updateDeviceProfile);
    updateDeviceProfile();

    function setSoftkeys(left, center, right) {
      elSoftLeft.textContent = left || "";
      elSoftCenter.textContent = center || "";
      elSoftRight.textContent = right || "";
    }

    function setHeader(title, badge = "", isRed = false) {
      elHeaderTitle.textContent = title;
      elHeaderBadge.textContent = badge;
      elHeaderBadge.style.display = badge ? "inline-block" : "none";
      elHeaderBar.className = isRed ? "header red" : "header";
    }

    /* DGK1 Package Parser */
    function openPakBuffer(buffer, filename) {
      const dv = new DataView(buffer);
      if (buffer.byteLength < 16) return false;

      const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
      if (magic !== "DGK1") {
        alert("Invalid file: Header magic 'DGK1' missing.");
        return false;
      }

      app.currentPak = buffer;
      app.totalQuestions = dv.getUint32(4, true);
      app.indexOffset = dv.getUint32(8, true);
      app.searchOffset = dv.getUint32(12, true);
      app.payloadBase = dv.getUint32(16, true);

      if (app.totalQuestions === 0) return false;

      app.score = 0;
      app.selectedOpt = 0;
      app.userChoice = -1;
      app.state = STATE.QUESTION;
      loadQuestion(0);
      render();
      return true;
    }

    function loadQuestion(qId) {
      if (!app.currentPak || qId >= app.totalQuestions) return false;
      const dv = new DataView(app.currentPak);
      const entryPos = app.indexOffset + (qId * 20);

      app.curEntry = {
        payload_offset: dv.getUint32(entryPos, true),
        q_h: dv.getUint16(entryPos + 4, true),
        opt_h: [
          dv.getUint16(entryPos + 6, true),
          dv.getUint16(entryPos + 8, true),
          dv.getUint16(entryPos + 10, true),
          dv.getUint16(entryPos + 12, true)
        ],
        correct_answer: dv.getUint8(entryPos + 14)
      };

      let offset = app.payloadBase + app.curEntry.payload_offset;
      const qBytes = app.curEntry.q_h * QUESTION_BYTES_ROW;
      app.curEntry.qMask = new Uint8Array(app.currentPak, offset, qBytes);
      offset += qBytes;

      app.curEntry.optMasks = [];
      for (let i = 0; i < 4; i++) {
        const oBytes = app.curEntry.opt_h[i] * OPTION_BYTES_ROW;
        app.curEntry.optMasks.push(new Uint8Array(app.currentPak, offset, oBytes));
        offset += oBytes;
      }

      app.currentQId = qId;
      return true;
    }

    function renderMaskToCanvas(mask, width, height, bytesPerRow, color = "#FFFFFF") {
      const c = document.createElement("canvas");
      c.width = width;
      c.height = height;
      c.className = "pak-canvas";
      const cx = c.getContext("2d");
      const imgData = cx.createImageData(width, height);
      const d = imgData.data;

      const rC = parseInt(color.slice(1, 3), 16) || 255;
      const gC = parseInt(color.slice(3, 5), 16) || 255;
      const bC = parseInt(color.slice(5, 7), 16) || 255;

      for (let r = 0; r < height; r++) {
        for (let b = 0; b < bytesPerRow; b++) {
          const val = mask[r * bytesPerRow + b];
          if (!val) continue;
          for (let bit = 0; bit < 8; bit++) {
            if (val & (0x80 >> bit)) {
              const sx = (b * 8) + bit;
              if (sx < width) {
                const idx = (r * width + sx) * 4;
                d[idx] = rC;
                d[idx + 1] = gC;
                d[idx + 2] = bC;
                d[idx + 3] = 255;
              }
            }
          }
        }
      }
      cx.putImageData(imgData, 0, 0);
      return c;
    }

    function applyFilter() {
      app.filteredIndices = [];
      for (let i = 0; i < app.pakList.length; i++) {
        if (!app.searchFilter || app.pakList[i].filename.toLowerCase().includes(app.searchFilter.toLowerCase())) {
          app.filteredIndices.push(i);
        }
      }
      if (app.selectedFileIdx >= app.filteredIndices.length) {
        app.selectedFileIdx = 0;
      }
    }

    function render() {
      elModal.style.display = "none";
      elModal.innerHTML = "";
      elViewport.innerHTML = "";

      switch (app.state) {
        case STATE.TUTORIAL: renderTutorial(); break;
        case STATE.FILE_LIST: renderFileList(); break;
        case STATE.QUESTION:
        case STATE.FEEDBACK: renderQuestion(); break;
        case STATE.MENU: renderMenu(); break;
        case STATE.QUESTION_MENU: renderQuestionMenu(); break;
        case STATE.ABOUT: renderAbout(); break;
        case STATE.CONFIRM_EXIT: renderConfirmExit(); break;
        case STATE.INPUT_DIALOG: renderInputDialog(); break;
        case STATE.SCORECARD: renderScorecard(); break;
      }
    }

    function renderTutorial() {
      setHeader("Tutorial", `${app.tutorialIdx + 1}/${TOTAL_TUTORIAL_SLIDES}`);
      setSoftkeys(app.tutorialIdx > 0 ? "< Prev" : "Exit", "Next >", "Open PAK");

      const dev = document.body.dataset.device;
      let controlGuide = "Keys 1-4: Select Option. Arrows: Highlight. Enter: Confirm.";
      if (dev === "touch-mobile") {
        controlGuide = "Direct Touch: Tap cards, options, or bottom buttons directly.";
      } else if (dev === "desktop") {
        controlGuide = "Keyboard shortcuts (1-4, Arrows, Enter, Esc) or click cards.";
      }

      const slides = [
        {
          title: "1. Select .PAK Package",
          desc: "Daily GK runs lightweight pre-rendered offline quiz packages (.PAK). Select your file to begin.",
          btn: "Select .PAK File"
        },
        {
          title: "2. Adaptive Controls",
          desc: controlGuide,
          btn: null
        },
        {
          title: "3. Quiz & Study Modes",
          desc: "Quiz mode tracks answers and scores. Study mode immediately displays the correct choice.",
          btn: null
        },
        {
          title: "4. Fast & Offline",
          desc: "Zero internet load after opening. Packages render crisply without requiring external fonts.",
          btn: "Open File Now"
        }
      ];

      const s = slides[app.tutorialIdx];
      const card = document.createElement("div");
      card.className = "card";
      card.style.cursor = "default";
      card.innerHTML = `
        <div class="card-title" style="color:var(--hl)">${s.title}</div>
        <div class="card-sub">${s.desc}</div>
      `;

      if (s.btn) {
        const btn = document.createElement("button");
        btn.className = "action-btn";
        btn.textContent = s.btn;
        btn.onclick = () => elFileInput.click();
        card.appendChild(btn);
      }

      elViewport.appendChild(card);
    }

    function renderFileList() {
      setHeader("Daily GK", `${app.filteredIndices.length} PAK`);
      setSoftkeys("Menu", "Play", "Exit");

      if (app.filteredIndices.length === 0) {
        app.state = STATE.TUTORIAL;
        renderTutorial();
        return;
      }

      app.filteredIndices.forEach((fIdx, i) => {
        const file = app.pakList[fIdx];
        const card = document.createElement("div");
        card.className = `card ${i === app.selectedFileIdx ? "selected" : ""}`;
        card.innerHTML = `
          <div class="card-title">
            <span>[${i < 9 ? i + 1 : 0}] ${file.filename}</span>
            <span class="key-hint">Press ${i < 9 ? i + 1 : 0}</span>
          </div>
          <div class="card-sub">Size: ${(file.filesize / 1024).toFixed(1)} KB</div>
        `;
        card.onclick = () => {
          app.selectedFileIdx = i;
          openPakBuffer(file.data, file.filename);
        };
        elViewport.appendChild(card);
      });
    }

    /* Fixed Question & Options View */
    function renderQuestion() {
      const mode = app.readMode === "study" ? "Study" : "Quiz";
      setHeader(`Q ${app.currentQId + 1}/${app.totalQuestions}`, mode);

      if (app.readMode === "study") {
        setSoftkeys("Menu", "Next >", "Packs");
      } else {
        setSoftkeys("Menu", app.state === STATE.FEEDBACK ? "Next Q" : "Ans", "Packs");
      }

      // Question Canvas Box
      const qBox = document.createElement("div");
      qBox.className = "q-box";
      if (app.curEntry.qMask) {
        const qCanvas = renderMaskToCanvas(app.curEntry.qMask, QUESTION_W, app.curEntry.q_h, QUESTION_BYTES_ROW, "#FFFFFF");
        qBox.appendChild(qCanvas);
      }
      elViewport.appendChild(qBox);

      // Options List
      const letters = ["A", "B", "C", "D"];
      for (let i = 0; i < 4; i++) {
        const opt = document.createElement("div");
        let cls = "opt-card";

        if (app.readMode === "study") {
          if (i === app.curEntry.correct_answer) cls += " correct";
          else if (i === app.selectedOpt) cls += " focused";
        } else {
          if (app.state === STATE.QUESTION) {
            if (i === app.selectedOpt) cls += " focused";
          } else if (app.state === STATE.FEEDBACK) {
            if (i === app.curEntry.correct_answer) cls += " correct";
            else if (i === app.userChoice) cls += " wrong";
          }
        }
        opt.className = cls;

        // 1. Badge on left
        const badge = document.createElement("div");
        badge.className = "opt-badge";
        badge.textContent = letters[i];
        opt.appendChild(badge);

        // 2. Canvas in the center
        const content = document.createElement("div");
        content.className = "opt-content";
        if (app.curEntry.optMasks[i]) {
          const optCanvas = renderMaskToCanvas(app.curEntry.optMasks[i], OPTION_W, app.curEntry.opt_h[i], OPTION_BYTES_ROW, "#FFFFFF");
          content.appendChild(optCanvas);
        }
        opt.appendChild(content);

        // 3. Key Hint on the far right
        const keyHint = document.createElement("span");
        keyHint.className = "key-hint";
        keyHint.textContent = `Key ${i + 1}`;
        opt.appendChild(keyHint);

        opt.onclick = () => {
          app.selectedOpt = i;
          app.userChoice = i;
          if (app.readMode !== "study") {
            if (app.userChoice === app.curEntry.correct_answer) app.score++;
            app.state = STATE.FEEDBACK;
          }
          render();
        };

        elViewport.appendChild(opt);
      }
    }

    function renderMenu() {
      setHeader("Options Menu");
      setSoftkeys("Select", "", "Back");

      const items = [
        "1. Open .PAK File",
        "2. Help & Tutorial",
        "3. Search Files",
        "4. About Daily GK",
        "5. Exit App"
      ];

      items.forEach((title, idx) => {
        const card = document.createElement("div");
        card.className = `card ${idx === app.menuSelectedIdx ? "selected" : ""}`;
        card.innerHTML = `<div class="card-title">${title}</div>`;
        card.onclick = () => {
          app.menuSelectedIdx = idx;
          execMenuItem(idx);
        };
        elViewport.appendChild(card);
      });
    }

    function execMenuItem(idx) {
      switch (idx) {
        case 0: elFileInput.click(); break;
        case 1: app.tutorialIdx = 0; app.state = STATE.TUTORIAL; render(); break;
        case 2: openInput(INPUT_TARGET.FILE_SEARCH); break;
        case 3: app.state = STATE.ABOUT; render(); break;
        case 4: app.prevState = STATE.MENU; app.state = STATE.CONFIRM_EXIT; render(); break;
      }
    }

    function renderQuestionMenu() {
      setHeader("Reading Menu");
      setSoftkeys("Select", "", "Back");

      const items = [
        "1. Search Question",
        "2. Jump To Question",
        `3. Mode: [${app.readMode === "study" ? "Study -> Quiz" : "Quiz -> Study"}]`,
        "4. Return to File List"
      ];

      items.forEach((title, idx) => {
        const card = document.createElement("div");
        card.className = `card ${idx === app.qmenuSelectedIdx ? "selected" : ""}`;
        card.innerHTML = `<div class="card-title">${title}</div>`;
        card.onclick = () => {
          app.qmenuSelectedIdx = idx;
          execQMenuItem(idx);
        };
        elViewport.appendChild(card);
      });
    }

    function execQMenuItem(idx) {
      switch (idx) {
        case 0: openInput(INPUT_TARGET.Q_SEARCH); break;
        case 1: openInput(INPUT_TARGET.JUMP_Q); break;
        case 2:
          app.readMode = app.readMode === "quiz" ? "study" : "quiz";
          app.state = STATE.QUESTION;
          render();
          break;
        case 3:
          app.state = app.pakList.length ? STATE.FILE_LIST : STATE.TUTORIAL;
          render();
          break;
      }
    }

    function renderAbout() {
      setHeader("About");
      setSoftkeys("", "", "Back");

      const card = document.createElement("div");
      card.className = "card";
      card.style.cursor = "default";
      card.innerHTML = `
        <div class="card-title" style="color:var(--hl)">Daily GK Engine</div>
        <div class="card-sub" style="margin-top:6px; line-height:1.45;">
          Version 4.1 Universal<br>
          Supports touchscreens, KaiOS, and compact feature phones.
        </div>
      `;
      elViewport.appendChild(card);
    }

    function renderConfirmExit() {
      elModal.style.display = "flex";
      setSoftkeys("Exit", "", "Cancel");

      elModal.innerHTML = `
        <div class="modal-card">
          <div class="modal-header red">Exit Application?</div>
          <div class="modal-body">
            Are you sure you want to close Daily GK?
            <div style="display:flex; gap:6px; margin-top:10px;">
              <button id="mExit" class="card" style="flex:1; background:var(--red); text-align:center;">Exit</button>
              <button id="mCancel" class="card" style="flex:1; background:var(--hl); text-align:center;">Cancel</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById("mExit").onclick = () => window.close();
      document.getElementById("mCancel").onclick = () => {
        app.state = app.prevState;
        render();
      };
    }

    function openInput(target) {
      app.inputTarget = target;
      app.inputBuffer = "";
      app.prevState = app.state;
      app.state = STATE.INPUT_DIALOG;
      render();
    }

    function renderInputDialog() {
      elModal.style.display = "flex";
      setSoftkeys("Done", "Clear", "Cancel");

      let prompt = "Enter search keyword:";
      if (app.inputTarget === INPUT_TARGET.JUMP_Q) prompt = `Enter Question (1 - ${app.totalQuestions}):`;

      elModal.innerHTML = `
        <div class="modal-card">
          <div class="modal-header">Input Dialog</div>
          <div class="modal-body">
            <div style="font-size:11px; color:var(--muted);">${prompt}</div>
            <input type="text" id="dlgInput" class="modal-input" autofocus value="${app.inputBuffer}">
          </div>
        </div>
      `;

      const input = document.getElementById("dlgInput");
      input.focus();
      input.oninput = (e) => app.inputBuffer = e.target.value;
      input.onkeydown = (e) => {
        if (e.key === "Enter") submitInput();
        if (e.key === "Escape") { app.state = app.prevState; render(); }
      };
    }

    function submitInput() {
      if (app.inputTarget === INPUT_TARGET.FILE_SEARCH) {
        app.searchFilter = app.inputBuffer;
        applyFilter();
        app.state = STATE.FILE_LIST;
      } else if (app.inputTarget === INPUT_TARGET.JUMP_Q) {
        const target = parseInt(app.inputBuffer, 10);
        if (target >= 1 && target <= app.totalQuestions) {
          app.selectedOpt = 0;
          app.userChoice = -1;
          loadQuestion(target - 1);
        }
        app.state = STATE.QUESTION;
      } else if (app.inputTarget === INPUT_TARGET.Q_SEARCH) {
        if (app.currentPak && app.searchOffset > 0) {
          const dv = new DataView(app.currentPak);
          let sPos = app.searchOffset;
          for (let i = 0; i < app.totalQuestions; i++) {
            const qId = dv.getUint16(sPos, true);
            const tLen = dv.getUint16(sPos + 2, true);
            sPos += 4;
            let sText = "";
            for (let c = 0; c < tLen; c++) sText += String.fromCharCode(dv.getUint8(sPos + c));
            sPos += tLen;

            if (sText.toLowerCase().includes(app.inputBuffer.toLowerCase())) {
              loadQuestion(qId);
              break;
            }
          }
        }
        app.state = STATE.QUESTION;
      }
      render();
    }

    function renderScorecard() {
      setHeader("Completed");
      setSoftkeys("Again", "", "Packs");

      const card = document.createElement("div");
      card.className = "card";
      card.style.textAlign = "center";
      card.style.padding = "16px 8px";
      card.innerHTML = `
        <div style="font-size:14px; font-weight:700; color:var(--green); margin-bottom:8px;">Quiz Completed!</div>
        <div style="font-size:12px; margin-bottom:12px;">Final Score: <b>${app.score}</b> / ${app.totalQuestions}</div>
      `;
      elViewport.appendChild(card);
    }

    function handleAction(action) {
      if (app.state === STATE.CONFIRM_EXIT) {
        if (action === "OK" || action === "SOFT_LEFT") window.close();
        if (action === "BACK" || action === "SOFT_RIGHT") {
          app.state = app.prevState;
          render();
        }
        return;
      }

      if (app.state === STATE.INPUT_DIALOG) {
        if (action === "OK" || action === "SOFT_LEFT") submitInput();
        if (action === "SOFT_CENTER") { app.inputBuffer = ""; render(); }
        if (action === "BACK" || action === "SOFT_RIGHT") { app.state = app.prevState; render(); }
        return;
      }

      if (action === "BACK" || action === "SOFT_RIGHT") {
        if (app.state === STATE.TUTORIAL) {
          elFileInput.click();
        } else if (app.state === STATE.FILE_LIST) {
          app.prevState = app.state;
          app.state = STATE.CONFIRM_EXIT;
        } else if (app.state === STATE.MENU || app.state === STATE.ABOUT) {
          app.state = app.pakList.length ? STATE.FILE_LIST : STATE.TUTORIAL;
        } else if (app.state === STATE.QUESTION_MENU) {
          app.state = STATE.QUESTION;
        } else if (app.state === STATE.QUESTION || app.state === STATE.FEEDBACK || app.state === STATE.SCORECARD) {
          app.state = app.pakList.length ? STATE.FILE_LIST : STATE.TUTORIAL;
        }
        render();
        return;
      }

      if (action === "SOFT_LEFT") {
        if (app.state === STATE.TUTORIAL) {
          if (app.tutorialIdx > 0) {
            app.tutorialIdx--;
            render();
          } else {
            app.prevState = STATE.TUTORIAL;
            app.state = STATE.CONFIRM_EXIT;
            render();
          }
        } else if (app.state === STATE.FILE_LIST) {
          app.menuSelectedIdx = 0;
          app.state = STATE.MENU;
          render();
        } else if (app.state === STATE.QUESTION || app.state === STATE.FEEDBACK) {
          app.qmenuSelectedIdx = 0;
          app.state = STATE.QUESTION_MENU;
          render();
        } else if (app.state === STATE.SCORECARD) {
          app.score = 0;
          app.selectedOpt = 0;
          app.userChoice = -1;
          app.state = STATE.QUESTION;
          loadQuestion(0);
          render();
        }
        return;
      }

      if (action === "OK" || action === "SOFT_CENTER") {
        if (app.state === STATE.TUTORIAL) {
          if (app.tutorialIdx < TOTAL_TUTORIAL_SLIDES - 1) {
            app.tutorialIdx++;
            render();
          } else {
            elFileInput.click();
          }
        } else if (app.state === STATE.FILE_LIST) {
          if (app.filteredIndices.length) {
            const actual = app.filteredIndices[app.selectedFileIdx];
            openPakBuffer(app.pakList[actual].data, app.pakList[actual].filename);
          }
        } else if (app.state === STATE.MENU) {
          execMenuItem(app.menuSelectedIdx);
        } else if (app.state === STATE.QUESTION_MENU) {
          execQMenuItem(app.qmenuSelectedIdx);
        } else if (app.state === STATE.QUESTION) {
          if (app.readMode === "study") {
            if (app.currentQId + 1 < app.totalQuestions) loadQuestion(app.currentQId + 1);
            else app.state = STATE.SCORECARD;
          } else {
            app.userChoice = app.selectedOpt;
            if (app.userChoice === app.curEntry.correct_answer) app.score++;
            app.state = STATE.FEEDBACK;
          }
          render();
        } else if (app.state === STATE.FEEDBACK) {
          if (app.currentQId + 1 < app.totalQuestions) {
            app.selectedOpt = 0;
            app.userChoice = -1;
            app.state = STATE.QUESTION;
            loadQuestion(app.currentQId + 1);
          } else {
            app.state = STATE.SCORECARD;
          }
          render();
        }
        return;
      }

      if (action === "UP") {
        if (app.state === STATE.FILE_LIST && app.selectedFileIdx > 0) app.selectedFileIdx--;
        else if (app.state === STATE.MENU && app.menuSelectedIdx > 0) app.menuSelectedIdx--;
        else if (app.state === STATE.QUESTION_MENU && app.qmenuSelectedIdx > 0) app.qmenuSelectedIdx--;
        else if (app.state === STATE.QUESTION && app.selectedOpt > 0) app.selectedOpt--;
        render();
      } else if (action === "DOWN") {
        if (app.state === STATE.FILE_LIST && app.selectedFileIdx < app.filteredIndices.length - 1) app.selectedFileIdx++;
        else if (app.state === STATE.MENU && app.menuSelectedIdx < 4) app.menuSelectedIdx++;
        else if (app.state === STATE.QUESTION_MENU && app.qmenuSelectedIdx < 3) app.qmenuSelectedIdx++;
        else if (app.state === STATE.QUESTION && app.selectedOpt < 3) app.selectedOpt++;
        render();
      } else if (action === "LEFT") {
        if (app.state === STATE.QUESTION && app.readMode === "study" && app.currentQId > 0) {
          loadQuestion(app.currentQId - 1);
          render();
        }
      } else if (action === "RIGHT") {
        if (app.state === STATE.QUESTION && app.readMode === "study" && app.currentQId + 1 < app.totalQuestions) {
          loadQuestion(app.currentQId + 1);
          render();
        }
      }

      if (/^[1-4]$/.test(action)) {
        if (app.state === STATE.QUESTION) {
          app.selectedOpt = parseInt(action, 10) - 1;
          handleAction("OK");
        }
      }
    }

    elSoftLeft.onclick = () => handleAction("SOFT_LEFT");
    elSoftCenter.onclick = () => handleAction("SOFT_CENTER");
    elSoftRight.onclick = () => handleAction("SOFT_RIGHT");

    window.addEventListener("keydown", (e) => {
      if (app.state === STATE.INPUT_DIALOG) return;

      switch (e.key) {
        case "ArrowUp": handleAction("UP"); e.preventDefault(); break;
        case "ArrowDown": handleAction("DOWN"); e.preventDefault(); break;
        case "ArrowLeft": handleAction("LEFT"); e.preventDefault(); break;
        case "ArrowRight": handleAction("RIGHT"); e.preventDefault(); break;
        case "Enter":
        case "5":
          handleAction("OK");
          e.preventDefault();
          break;
        case "F1":
        case "[":
        case "SoftLeft":
          handleAction("SOFT_LEFT");
          e.preventDefault();
          break;
        case "F2":
        case "]":
        case "Escape":
        case "Backspace":
        case "SoftRight":
          handleAction("SOFT_RIGHT");
          e.preventDefault();
          break;
        default:
          if (/^[1-4]$/.test(e.key)) handleAction(e.key);
          break;
      }
    });

    function loadFileBuffer(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        app.pakList.push({ filename: file.name, filesize: file.size, data: e.target.result });
        applyFilter();
        app.state = STATE.FILE_LIST;
        render();
      };
      reader.readAsArrayBuffer(file);
    }

    elFileInput.onchange = (e) => {
      if (e.target.files.length) loadFileBuffer(e.target.files[0]);
    };

    window.ondragover = (e) => e.preventDefault();
    window.ondrop = (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) loadFileBuffer(e.dataTransfer.files[0]);
    };

    render();
  </script>
</body>
</html>
