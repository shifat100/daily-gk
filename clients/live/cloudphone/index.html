px;"><polyline points="15 18 9 12 15 6"></polyline></svg>';var REPO_CONFIG={base_url:"https://raw.githubusercontent.com/shifat100/daily-gk/main/"};var app={rawData:[],treeData:{},filteredData:[],currCat:null,currTopic:null,searchQuery:"",mode:"quiz",shuffle:!1,currentPage:1,itemsPerPage:10,menuOpen:!1,menuLevel:"root",selectedCatInMenu:null};var isMenuLocked=!1;function lockMenuBriefly(){isMenuLocked=!0;setTimeout(function(){isMenuLocked=!1},180)}

function parseAndStore(rawContent,catName,topicName){var lines=rawContent.replace(/\r\n/g,"\n").split("\n");var count=0;for(var o=0;o<lines.length&&!(o+1>=lines.length);o+=2){var question=lines[o].trim();var optionsLine=lines[o+1].trim();if(question&&optionsLine){var ansIdx,descText,optsArr;var parts=optionsLine.split("|");if(parts.length>0&&""===parts[parts.length-1]){parts.pop()}
