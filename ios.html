<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Daily GK MCQ | iOS Cupertino Edition</title>
    
    <!-- Legacy Opera Mini & J2ME Auto-Router -->
    <script type="text/javascript">
    (function() {
        var ua = navigator.userAgent || navigator.vendor || window.opera || '';
        var isLegacy = /Opera Mini|Opera Mobi|J2ME|MIDP|NetFront|UCWEB|Series60|SymbianOS|NokiaBrowser|MAUI/i.test(ua);
        var search = window.location.search || '';
        if (isLegacy && search.indexOf('force_full=1') === -1) {
            window.location.replace('lite.html' + search);
        }
    })();
    </script>

    <style>
        /* ============================================================
           APPLE iOS / iPadOS HUMAN INTERFACE GUIDELINES (HIG) SYSTEM
           ============================================================ */
        :root {
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --ios-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;

            /* iOS Light Mode System Colors */
            --ios-blue: #007aff;
            --ios-blue-rgb: 0, 122, 255;
            --ios-green: #34c759;
            --ios-green-bg: #eafaf1;
            --ios-red: #ff3b30;
            --ios-red-bg: #fdeeed;
            --ios-gray: #8e8e93;

            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-card-secondary: #f9f9fb;
            --ios-separator: #c6c6c8;
            --ios-separator-subtle: #e5e5ea;
            
            --ios-text-primary: #000000;
            --ios-text-secondary: #6c6c70;
            --ios-text-tertiary: #aeaeb2;

            --ios-nav-bg: rgba(249, 249, 249, 0.78);
            --ios-tab-bg: rgba(249, 249, 249, 0.85);
            --ios-segment-bg: rgba(118, 118, 128, 0.12);
            --ios-segment-active: #ffffff;

            --ios-radius-sm: 8px;
            --ios-radius-md: 12px;
            --ios-radius-lg: 16px;
            --ios-radius-pill: 9999px;

            --ios-nav-height: 54px;
            --ios-tab-height: 60px;
            --ios-safe-bottom: env(safe-area-inset-bottom, 0px);
            --ios-safe-top: env(safe-area-inset-top, 0px);
        }

        [data-theme="dark"] {
            /* iOS Dark Mode System Colors */
            --ios-blue: #0a84ff;
            --ios-blue-rgb: 10, 132, 255;
            --ios-green: #30d158;
            --ios-green-bg: #0d2b17;
            --ios-red: #ff453a;
            --ios-red-bg: #32100e;
            --ios-gray: #8e8e93;

            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-card-secondary: #2c2c2e;
            --ios-separator: #38383a;
            --ios-separator-subtle: #2c2c2e;

            --ios-text-primary: #ffffff;
            --ios-text-secondary: #8e8e93;
            --ios-text-tertiary: #636366;

            --ios-nav-bg: rgba(28, 28, 30, 0.78);
            --ios-tab-bg: rgba(28, 28, 30, 0.85);
            --ios-segment-bg: rgba(118, 118, 128, 0.24);
            --ios-segment-active: #636366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: var(--ios-font);
            background-color: var(--ios-bg);
            color: var(--ios-text-primary);
            user-select: none;
            -webkit-user-select: none;
        }

        /* SF Symbol Style SVG Icons */
        .sf-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .sf-icon-sm { width: 16px; height: 16px; }

        /* Master App Shell */
        .ios-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            width: 100%;
            position: relative;
            background: var(--ios-bg);
        }

        /* 1. iOS Top Navigation Bar (Frosted Vibrancy) */
        .ios-nav-bar {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            height: calc(var(--ios-nav-height) + var(--ios-safe-top));
            padding-top: var(--ios-safe-top);
            background: var(--ios-nav-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 0.5px solid var(--ios-separator);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 16px;
            padding-right: 16px;
            z-index: 100;
            flex-shrink: 0;
        }

        .ios-nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ios-nav-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.4px;
        }
        .ios-nav-subtitle {
            font-size: 0.72rem;
            color: var(--ios-text-secondary);
            font-weight: 500;
        }

        .ios-nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ios-icon-btn {
            background: none;
            border: none;
            color: var(--ios-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: var(--ios-radius-pill);
            transition: opacity 0.15s;
        }
        .ios-icon-btn:active { opacity: 0.5; }

        /* 2. Scrollable View Area */
        .ios-content-view {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 16px calc(var(--ios-tab-height) + var(--ios-safe-bottom) + 20px) 16px;
        }
        .ios-container {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* iOS Segmented Control */
        .ios-segmented-control {
            background: var(--ios-segment-bg);
            border-radius: 9px;
            padding: 2px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .ios-segment-tab {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--ios-text-primary);
            border: none;
            background: transparent;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }
        .ios-segment-tab.active {
            background: var(--ios-segment-active);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12), 0 0.5px 1px rgba(0, 0, 0, 0.04);
            color: var(--ios-text-primary);
        }

        /* Search Bar */
        .ios-search-deck {
            position: relative;
            display: flex;
            align-items: center;
        }
        .ios-search-icon {
            position: absolute;
            left: 10px;
            color: var(--ios-text-tertiary);
        }
        .ios-search-input {
            width: 100%;
            background: var(--ios-segment-bg);
            border: none;
            border-radius: 10px;
            padding: 8px 12px 8px 34px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--ios-text-primary);
            outline: none;
        }
        .ios-search-input::placeholder { color: var(--ios-text-tertiary); }

        /* Chips Carousel Bar */
        .ios-chips-carousel {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .ios-chips-carousel::-webkit-scrollbar { display: none; }
        .ios-filter-pill {
            background: var(--ios-card);
            border: 0.5px solid var(--ios-separator-subtle);
            color: var(--ios-text-secondary);
            padding: 4px 12px;
            border-radius: var(--ios-radius-pill);
            font-size: 0.76rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .ios-filter-pill.active {
            background: var(--ios-blue);
            color: #ffffff;
            border-color: var(--ios-blue);
        }

        /* Inset Grouped Question Card */
        .ios-card {
            background: var(--ios-card);
            border-radius: var(--ios-radius-lg);
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            border: 0.5px solid var(--ios-separator-subtle);
        }
        .ios-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--ios-text-secondary);
        }
        .ios-badge-cat {
            background: rgba(var(--ios-blue-rgb), 0.1);
            color: var(--ios-blue);
            padding: 2px 8px;
            border-radius: var(--ios-radius-sm);
        }
        .ios-question-title {
            font-size: 0.98rem;
            font-weight: 600;
            line-height: 1.45;
            color: var(--ios-text-primary);
            margin-bottom: 14px;
        }

        /* iOS Option Rows */
        .ios-options-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ios-option-row {
            background: var(--ios-card-secondary);
            border: 0.5px solid var(--ios-separator-subtle);
            border-radius: var(--ios-radius-md);
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--ios-text-primary);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s, transform 0.08s;
        }
        .ios-option-row:active:not(:disabled) {
            transform: scale(0.985);
            background: var(--ios-separator-subtle);
        }
        .ios-opt-circle {
            width: 24px;
            height: 24px;
            border-radius: var(--ios-radius-pill);
            border: 1.5px solid var(--ios-separator);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--ios-text-secondary);
            flex-shrink: 0;
        }

        /* Option Verification Colors */
        .ios-option-row.correct {
            background: var(--ios-green-bg) !important;
            border-color: var(--ios-green) !important;
            color: var(--ios-green) !important;
            font-weight: 600;
        }
        .ios-option-row.correct .ios-opt-circle {
            background: var(--ios-green);
            border-color: var(--ios-green);
            color: #ffffff;
        }
        .ios-option-row.wrong {
            background: var(--ios-red-bg) !important;
            border-color: var(--ios-red) !important;
            color: var(--ios-red) !important;
        }
        .ios-option-row.wrong .ios-opt-circle {
            background: var(--ios-red);
            border-color: var(--ios-red);
            color: #ffffff;
        }
        .ios-option-row.exam-selected {
            background: rgba(var(--ios-blue-rgb), 0.12) !important;
            border-color: var(--ios-blue) !important;
            color: var(--ios-blue) !important;
            font-weight: 600;
        }
        .ios-option-row.exam-selected .ios-opt-circle {
            background: var(--ios-blue);
            border-color: var(--ios-blue);
            color: #ffffff;
        }

        .ios-explanation-box {
            margin-top: 10px;
            padding: 10px 12px;
            background: var(--ios-card-secondary);
            border-left: 3px solid var(--ios-blue);
            border-radius: 0 var(--ios-radius-sm) var(--ios-radius-sm) 0;
            font-size: 0.84rem;
            line-height: 1.4;
            color: var(--ios-text-secondary);
        }

        /* 3. Bottom Navigation Tab Bar (Apple Style) */
        .ios-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(var(--ios-tab-height) + var(--ios-safe-bottom));
            padding-bottom: var(--ios-safe-bottom);
            background: var(--ios-tab-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 0.5px solid var(--ios-separator);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
        }
        .ios-tab-item {
            background: none;
            border: none;
            color: var(--ios-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-family: inherit;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 12px;
            transition: color 0.15s;
        }
        .ios-tab-item.active { color: var(--ios-blue); }

        /* 4. iOS Cupertino Bottom Sheet Modal */
        .ios-sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .ios-sheet-overlay.show { opacity: 1; visibility: visible; }

        .ios-bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--ios-card);
            border-radius: 20px 20px 0 0;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            z-index: 210;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            padding-bottom: var(--ios-safe-bottom);
        }
        .ios-bottom-sheet.show { transform: translateY(0); }

        .ios-sheet-handle {
            width: 36px;
            height: 5px;
            background: var(--ios-separator);
            border-radius: 3px;
            margin: 8px auto 6px auto;
        }
        .ios-sheet-header {
            padding: 10px 16px;
            border-bottom: 0.5px solid var(--ios-separator-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ios-sheet-title { font-size: 1.05rem; font-weight: 700; }
        .ios-sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        /* List Items inside Sheet */
        .ios-sheet-list { list-style: none; }
        .ios-sheet-item {
            padding: 12px 6px;
            border-bottom: 0.5px solid var(--ios-separator-subtle);
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--ios-text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ios-sheet-item:active { background: var(--ios-segment-bg); }

        /* Pagination Bar */
        .ios-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }
        .ios-btn-pill {
            background: var(--ios-card);
            border: 0.5px solid var(--ios-separator-subtle);
            color: var(--ios-blue);
            font-weight: 600;
            font-size: 0.82rem;
            padding: 6px 16px;
            border-radius: var(--ios-radius-pill);
            cursor: pointer;
        }
        .ios-btn-pill:active:not(:disabled) { background: var(--ios-segment-bg); }
        .ios-btn-pill:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Toast Alert */
        .ios-toast {
            position: fixed;
            top: calc(var(--ios-nav-height) + var(--ios-safe-top) + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: var(--ios-radius-pill);
            font-size: 0.82rem;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 300;
        }
        .ios-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="ios-shell">
        
        <!-- 1. TOP NAVIGATION BAR -->
        <header class="ios-nav-bar">
            <div class="ios-nav-left">
                <div>
                    <h1 class="ios-nav-title">Daily GK</h1>
                    <div class="ios-nav-subtitle" id="currentTopicSubtitle">All Topics</div>
                </div>
            </div>

            <div class="ios-nav-actions">
                <!-- Theme Toggle -->
                <button id="themeToggle" class="ios-icon-btn" title="Toggle Dark/Light Mode">
                    <svg class="sf-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
                <!-- Category Sheet Modal Trigger -->
                <button onclick="openCategorySheet()" class="ios-icon-btn" title="Filter Topics">
                    <svg class="sf-icon" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/></svg>
                </button>
            </div>
        </header>

        <!-- 2. SCROLLABLE MAIN VIEW -->
        <main class="ios-content-view" id="mainScroll">
            <div class="ios-container">

                <!-- Segmented Control Bar (Quiz / Study / Exam) -->
                <div class="ios-segmented-control">
                    <button class="ios-segment-tab active" onclick="switchMode('quiz')" id="tabQuiz">Quiz</button>
                    <button class="ios-segment-tab" onclick="switchMode('study')" id="tabStudy">Study</button>
                    <button class="ios-segment-tab" onclick="switchMode('exam')" id="tabExam">Exam</button>
                </div>

                <!-- Search Input Deck -->
                <div class="ios-search-deck">
                    <svg class="sf-icon sf-icon-sm ios-search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" class="ios-search-input" placeholder="Search questions...">
                </div>

                <!-- Quick Category Carousel -->
                <div class="ios-chips-carousel" id="chipsCarousel"></div>

                <!-- Exam Timer Active Bar -->
                <div id="examTimerCard" class="ios-card" style="display:none; text-align:center; border-color:var(--ios-blue);">
                    <div style="font-size:0.75rem; color:var(--ios-text-secondary); text-transform:uppercase; font-weight:700;">Time Remaining</div>
                    <div id="examTimerDisplay" style="font-size:1.6rem; font-weight:800; font-family:var(--ios-mono); color:var(--ios-blue); margin:4px 0;">30:00</div>
                    <button onclick="submitExam()" class="ios-btn-pill" style="background:var(--ios-blue); color:#fff; border:none; margin-top:4px;">Submit Exam</button>
                </div>

                <!-- Question Stream -->
                <div id="questionList"></div>

                <!-- Pagination -->
                <div class="ios-pagination" id="paginationBox"></div>

            </div>
        </main>

        <!-- 3. APPLE iOS TAB BAR (BOTTOM) -->
        <nav class="ios-tab-bar">
            <button class="ios-tab-item active" onclick="switchBottomTab('practice')" id="bTabPractice">
                <svg class="sf-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <span>Practice</span>
            </button>
            <button class="ios-tab-item" onclick="openCategorySheet()" id="bTabTopics">
                <svg class="sf-icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                <span>Topics</span>
            </button>
            <button class="ios-tab-item" onclick="switchBottomTab('bookmarks')" id="bTabBookmarks">
                <svg class="sf-icon" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                <span>Saved</span>
            </button>
        </nav>

        <!-- 4. iOS CUPERTINO BOTTOM SHEET MODAL -->
        <div class="ios-sheet-overlay" id="sheetOverlay" onclick="closeCategorySheet()"></div>
        <div class="ios-bottom-sheet" id="categorySheet">
            <div class="ios-sheet-handle"></div>
            <div class="ios-sheet-header">
                <span class="ios-sheet-title">Topics &amp; Syllabus</span>
                <button onclick="closeCategorySheet()" class="ios-icon-btn" style="font-weight:600; font-size:0.9rem;">Done</button>
            </div>
            <div class="ios-sheet-content">
                <ul class="ios-sheet-list" id="categorySheetList"></ul>
            </div>
        </div>

        <!-- iOS Toast -->
        <div id="iosToast" class="ios-toast"></div>
    </div>

    <!-- MAIN JAVASCRIPT ENGINE -->
    <script>
        "use strict";

        const app = {
            data: [],
            filtered: [],
            tree: {},
            bookmarks: JSON.parse(localStorage.getItem('gk_ios_bookmarks')) || [],
            isBookmarkView: false,
            
            selectedCat: null,
            selectedTopic: null,
            searchQuery: '',
            mode: 'quiz',
            page: 1,
            perPage: 10,
            
            // Exam Mode
            examTimer: null,
            examSeconds: 30 * 60,
            userAnswers: {}
        };

        // Fallback Data
        const fallbackData = [
            {
                id: 1,
                cat: "General Science",
                topic: "Space",
                q: "Which planet in our solar system is known as the 'Red Planet'?",
                opts: ["Venus", "Mars", "Jupiter", "Saturn"],
                ans: 1,
                desc: "Mars is called the Red Planet because iron minerals in the Martian soil oxidize (rust)."
            },
            {
                id: 2,
                cat: "World Geography",
                topic: "Rivers",
                q: "What is considered the longest river in the world?",
                opts: ["Amazon River", "Nile River", "Yangtze River", "Mississippi River"],
                ans: 1,
                desc: "The Nile River in Africa spans approximately 6,650 km."
            }
        ];

        window.onload = function() {
            initIOSEngine();
        };

        function initIOSEngine() {
            initTheme();
            setupSearch();
            loadServerData();
        }

        function showToast(msg) {
            const toast = document.getElementById('iosToast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Web Audio iOS Haptic Click Sound
        function playHapticTick() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch(e) {}
        }

        // Theme Switcher
        function initTheme() {
            let dark = localStorage.getItem('gk_ios_dark') === 'true';
            applyTheme(dark);
            document.getElementById('themeToggle').onclick = () => {
                dark = !dark;
                localStorage.setItem('gk_ios_dark', dark);
                applyTheme(dark);
                playHapticTick();
            };
        }
        function applyTheme(dark) {
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        }

        // Load Server Data
        function loadServerData() {
            fetch('data/main.json?t=' + Date.now())
                .then(r => r.json())
                .then(categories => {
                    let fetchPromises = [];
                    categories.forEach(cat => {
                        app.tree[cat.title] = {};
                        fetchPromises.push(
                            fetch(cat.path + '?t=' + Date.now())
                                .then(r => r.json())
                                .then(topics => {
                                    return Promise.all(topics.map(t => {
                                        return fetch(t.path + '?t=' + Date.now())
                                            .then(r => r.text())
                                            .then(txt => parseAndStore(txt, cat.title, t.title));
                                    }));
                                })
                        );
                    });
                    return Promise.all(fetchPromises);
                })
                .then(() => finishInit())
                .catch(() => {
                    fallbackData.forEach(d => {
                        app.data.push(d);
                        if (!app.tree[d.cat]) app.tree[d.cat] = {};
                        app.tree[d.cat][d.topic] = (app.tree[d.cat][d.topic] || 0) + 1;
                    });
                    finishInit();
                });
        }

        function parseAndStore(text, cat, topic) {
            const lines = text.replace(/\r\n/g, '\n').split('\n');
            for (let i = 0; i < lines.length; i += 2) {
                const line1 = (lines[i] || '').trim();
                const line2 = (lines[i+1] || '').trim();
                if (!line1 || !line2) continue;

                const parts = line2.split('|');
                if (parts[parts.length - 1] === '') parts.pop();

                let ans, desc = null, opts;
                const last = parts[parts.length - 1];
                if (!isNaN(last) && last !== '') {
                    ans = parseInt(last, 10);
                    opts = parts.slice(0, -1);
                } else {
                    ans = parseInt(parts[parts.length - 2], 10);
                    desc = last;
                    opts = parts.slice(0, -2);
                }

                app.data.push({
                    id: app.data.length + 1,
                    cat: cat,
                    topic: topic,
                    q: line1.replace(/\*\*/g, ''),
                    opts: opts,
                    ans: ans,
                    desc: desc
                });

                if (!app.tree[cat]) app.tree[cat] = {};
                app.tree[cat][topic] = (app.tree[cat][topic] || 0) + 1;
            }
        }

        function finishInit() {
            buildChipsCarousel();
            buildCategorySheetList();
            applyFilter();
        }

        // Quick Filter Carousel
        function buildChipsCarousel() {
            const container = document.getElementById('chipsCarousel');
            container.innerHTML = `<button class="ios-filter-pill ${!app.selectedCat ? 'active' : ''}" onclick="selectCategory(null)">All</button>`;
            
            for (let cat in app.tree) {
                const pill = document.createElement('button');
                pill.className = `ios-filter-pill ${app.selectedCat === cat ? 'active' : ''}`;
                pill.textContent = cat;
                pill.onclick = () => selectCategory(cat);
                container.appendChild(pill);
            }
        }

        function selectCategory(cat) {
            playHapticTick();
            app.selectedCat = cat;
            app.selectedTopic = null;
            app.isBookmarkView = false;
            app.page = 1;
            document.getElementById('currentTopicSubtitle').textContent = cat || "All Topics";
            buildChipsCarousel();
            applyFilter();
        }

        // Bottom Sheet Category Picker
        window.openCategorySheet = function() {
            playHapticTick();
            document.getElementById('sheetOverlay').classList.add('show');
            document.getElementById('categorySheet').classList.add('show');
        };

        window.closeCategorySheet = function() {
            document.getElementById('sheetOverlay').classList.remove('show');
            document.getElementById('categorySheet').classList.remove('show');
        };

        function buildCategorySheetList() {
            const list = document.getElementById('categorySheetList');
            list.innerHTML = `
                <li class="ios-sheet-item" onclick="selectCategory(null); closeCategorySheet();">
                    <strong>All Questions</strong>
                    <span>&rsaquo;</span>
                </li>`;

            for (let cat in app.tree) {
                const li = document.createElement('li');
                li.className = 'ios-sheet-item';
                li.innerHTML = `
                    <span>${cat}</span>
                    <span style="color:var(--ios-text-secondary); font-size:0.8rem;">&rsaquo;</span>
                `;
                li.onclick = () => {
                    selectCategory(cat);
                    closeCategorySheet();
                };
                list.appendChild(li);
            }
        }

        // Mode Switcher
        window.switchMode = function(mode) {
            playHapticTick();
            app.mode = mode;
            document.querySelectorAll('.ios-segment-tab').forEach(t => t.classList.remove('active'));
            if (mode === 'quiz') document.getElementById('tabQuiz').classList.add('active');
            if (mode === 'study') document.getElementById('tabStudy').classList.add('active');
            if (mode === 'exam') document.getElementById('tabExam').classList.add('active');

            if (mode === 'exam') startExam();
            else stopExam();

            render();
        };

        function startExam() {
            document.getElementById('examTimerCard').style.display = 'block';
            app.userAnswers = {};
            app.examSeconds = 30 * 60;
            clearInterval(app.examTimer);
            app.examTimer = setInterval(() => {
                app.examSeconds--;
                const m = Math.floor(app.examSeconds / 60).toString().padStart(2, '0');
                const s = (app.examSeconds % 60).toString().padStart(2, '0');
                document.getElementById('examTimerDisplay').textContent = `${m}:${s}`;
                if (app.examSeconds <= 0) submitExam();
            }, 1000);
        }

        function stopExam() {
            document.getElementById('examTimerCard').style.display = 'none';
            clearInterval(app.examTimer);
        }

        window.submitExam = function() {
            stopExam();
            let score = 0;
            const items = app.filtered;
            items.forEach(q => {
                if (app.userAnswers[q.id] === q.ans) score++;
            });
            showToast(`Exam Finished! Score: ${score} / ${items.length}`);
            switchMode('study');
        };

        // Bottom Tab Switcher
        window.switchBottomTab = function(tab) {
            playHapticTick();
            document.querySelectorAll('.ios-tab-item').forEach(b => b.classList.remove('active'));
            if (tab === 'practice') {
                document.getElementById('bTabPractice').classList.add('active');
                app.isBookmarkView = false;
                applyFilter();
            } else if (tab === 'bookmarks') {
                document.getElementById('bTabBookmarks').classList.add('active');
                app.isBookmarkView = true;
                applyFilter();
            }
        };

        // Filter and Render
        function applyFilter() {
            if (app.isBookmarkView) {
                app.filtered = app.data.filter(q => app.bookmarks.includes(q.id));
                document.getElementById('currentTopicSubtitle').textContent = "Saved Bookmarks";
            } else {
                app.filtered = app.data.filter(q => {
                    if (app.selectedCat && q.cat !== app.selectedCat) return false;
                    if (app.searchQuery && q.q.toLowerCase().indexOf(app.searchQuery) === -1) return false;
                    return true;
                });
            }
            render();
        }

        function render() {
            const container = document.getElementById('questionList');
            container.innerHTML = '';

            const totalPages = Math.ceil(app.filtered.length / app.perPage) || 1;
            if (app.page > totalPages) app.page = totalPages;

            const start = (app.page - 1) * app.perPage;
            const currentItems = app.filtered.slice(start, start + app.perPage);

            if (currentItems.length === 0) {
                container.innerHTML = `
                    <div class="ios-card" style="text-align:center; padding:35px; color:var(--ios-text-secondary);">
                        No questions found.
                    </div>`;
                renderPagination(0);
                return;
            }

            currentItems.forEach((q, idx) => {
                const card = createIOSCard(q, start + idx + 1);
                container.appendChild(card);
            });

            renderPagination(totalPages);
        }

        function createIOSCard(q, index) {
            const card = document.createElement('div');
            card.className = 'ios-card';

            const isSaved = app.bookmarks.includes(q.id);
            const letters = ['A', 'B', 'C', 'D', 'E'];

            let optionsHtml = '';
            q.opts.forEach((opt, idx) => {
                optionsHtml += `
                    <button class="ios-option-row" data-optidx="${idx}">
                        <span class="ios-opt-circle">${letters[idx]}</span>
                        <span>${opt}</span>
                    </button>
                `;
            });

            card.innerHTML = `
                <div class="ios-card-header">
                    <span class="ios-badge-cat">${q.cat}</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="ios-icon-btn" onclick="speakText('${q.q.replace(/'/g, "\\'")}')" title="Listen">
                            <svg class="sf-icon sf-icon-sm" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                        </button>
                        <button class="ios-icon-btn" onclick="toggleBookmark(${q.id})" style="color:${isSaved ? 'var(--ios-blue)' : 'var(--ios-text-tertiary)'}">
                            <svg class="sf-icon sf-icon-sm" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="ios-question-title">${index}. ${q.q}</div>
                <div class="ios-options-stack">${optionsHtml}</div>
                <div class="ios-explanation-box" style="${app.mode === 'study' ? 'display:block;' : 'display:none;'}">
                    <strong>Correct:</strong> [${letters[q.ans]}] ${q.opts[q.ans]}
                    ${q.desc ? `<div style="margin-top:3px;">${q.desc}</div>` : ''}
                </div>
            `;

            const rows = card.querySelectorAll('.ios-option-row');
            rows.forEach((row, optIdx) => {
                row.onclick = () => {
                    playHapticTick();
                    app.userAnswers[q.id] = optIdx;

                    if (app.mode === 'quiz') {
                        rows.forEach(r => r.disabled = true);
                        rows[q.ans].classList.add('correct');
                        if (optIdx !== q.ans) row.classList.add('wrong');
                        card.querySelector('.ios-explanation-box').style.display = 'block';
                    } else if (app.mode === 'exam') {
                        rows.forEach(r => r.classList.remove('exam-selected'));
                        row.classList.add('exam-selected');
                    }
                };
            });

            return card;
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(u);
        }

        window.toggleBookmark = function(qid) {
            playHapticTick();
            const idx = app.bookmarks.indexOf(qid);
            if (idx === -1) {
                app.bookmarks.push(qid);
                showToast("Saved to Bookmarks");
            } else {
                app.bookmarks.splice(idx, 1);
                showToast("Bookmark Removed");
            }
            localStorage.setItem('gk_ios_bookmarks', JSON.stringify(app.bookmarks));
            applyFilter();
        };

        function renderPagination(total) {
            const box = document.getElementById('paginationBox');
            box.innerHTML = '';
            if (total <= 1) return;

            const prev = document.createElement('button');
            prev.className = 'ios-btn-pill';
            prev.textContent = 'Previous';
            prev.disabled = app.page === 1;
            prev.onclick = () => { playHapticTick(); app.page--; render(); document.getElementById('mainScroll').scrollTo(0,0); };

            const info = document.createElement('span');
            info.style.cssText = 'font-size:0.8rem; font-weight:600; color:var(--ios-text-secondary);';
            info.textContent = `${app.page} / ${total}`;

            const next = document.createElement('button');
            next.className = 'ios-btn-pill';
            next.textContent = 'Next';
            next.disabled = app.page === total;
            next.onclick = () => { playHapticTick(); app.page++; render(); document.getElementById('mainScroll').scrollTo(0,0); };

            box.appendChild(prev);
            box.appendChild(info);
            box.appendChild(next);
        }

        function setupSearch() {
            let timeout;
            document.getElementById('searchInput').onkeyup = (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    app.searchQuery = e.target.value.toLowerCase().trim();
                    app.page = 1;
                    applyFilter();
                }, 200);
            };
        }
    </script>
</body>
  </html>
