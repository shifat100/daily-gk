<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Daily GK MCQ - Lite Edition</title>
    <style type="text/css">
        /* =========================================================
           Opera Mini 4.x / 2G Pure ASCII CSS2 Layout (Zero Emoji)
           ========================================================= */
        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
            -webkit-box-sizing: border-box;
        }
        body {
            font-family: Tahoma, Arial, Helvetica, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            background-color: #f2f5f8;
            color: #222222;
            margin: 0;
            padding: 0;
        }

        /* Top Header */
        .header-bar {
            background-color: #005a9c;
            color: #ffffff;
            padding: 8px;
            text-align: center;
            border-bottom: 2px solid #00365d;
        }
        .header-bar h1 {
            font-size: 16px;
            margin: 0;
            padding: 0;
            text-transform: uppercase;
        }
        .header-bar .tagline {
            font-size: 10px;
            color: #cce0ff;
            margin-top: 2px;
            display: block;
        }

        /* Container */
        .wrapper {
            padding: 6px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Navigation Mode Tabs */
        .nav-tabs {
            background-color: #ffffff;
            border: 1px solid #b0c4de;
            margin-bottom: 6px;
            text-align: center;
            padding: 4px;
        }
        .tab-link {
            display: inline-block;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            color: #005a9c;
        }
        .tab-link.active {
            background-color: #005a9c;
            color: #ffffff;
        }

        /* Filter Panel */
        .filter-box {
            background-color: #ffffff;
            border: 1px solid #b0c4de;
            padding: 6px;
            margin-bottom: 6px;
        }
        .filter-table {
            width: 100%;
            border-collapse: collapse;
        }
        .filter-table td {
            padding: 2px;
        }
        .select-input {
            width: 100%;
            padding: 3px;
            font-size: 11px;
            border: 1px solid #8099b3;
            background-color: #fafbfc;
        }
        .submit-btn {
            background-color: #005a9c;
            color: #ffffff;
            border: 1px solid #00365d;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Question Cards */
        .card {
            background-color: #ffffff;
            border: 1px solid #c2d1e0;
            border-top: 3px solid #005a9c;
            padding: 8px;
            margin-bottom: 6px;
        }
        .card-meta {
            width: 100%;
            margin-bottom: 6px;
            border-bottom: 1px dashed #d1dbe6;
            padding-bottom: 3px;
            font-size: 11px;
        }
        .badge-cat {
            background-color: #e3edf7;
            color: #00365d;
            padding: 1px 5px;
            font-weight: bold;
        }
        .badge-id {
            color: #667788;
            font-weight: bold;
            text-align: right;
        }
        .q-text {
            font-size: 13px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 6px;
        }

        /* Options Table */
        .opt-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 6px;
        }
        .opt-table td {
            padding: 3px 2px;
            vertical-align: top;
            font-size: 12px;
        }
        .opt-prefix {
            width: 25px;
            font-weight: bold;
            color: #005a9c;
        }
        .opt-val {
            color: #333333;
        }

        /* Answer & Explanation Box */
        .ans-btn {
            display: inline-block;
            background-color: #eef3f8;
            border: 1px solid #8099b3;
            color: #00365d;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
        }
        .ans-panel {
            display: none;
            background-color: #edf7ed;
            border: 1px solid #a3d4a6;
            border-left: 3px solid #2e7d32;
            padding: 6px;
            margin-top: 6px;
            font-size: 11px;
            color: #1e4620;
        }
        .ans-panel.open {
            display: block;
        }
        .ans-correct {
            font-weight: bold;
            color: #1b5e20;
            margin-bottom: 3px;
        }
        .ans-desc {
            color: #334433;
            border-top: 1px dotted #a3d4a6;
            padding-top: 3px;
            margin-top: 3px;
        }

        /* Pagination Panel */
        .pag-panel {
            background-color: #ffffff;
            border: 1px solid #b0c4de;
            padding: 6px;
            text-align: center;
            margin-top: 8px;
            font-size: 11px;
        }
        .pag-btn {
            display: inline-block;
            background-color: #005a9c;
            color: #ffffff;
            padding: 3px 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 1px;
            border: 1px solid #00365d;
        }

        /* Footer */
        .footer-panel {
            text-align: center;
            font-size: 11px;
            color: #667788;
            margin-top: 12px;
            padding: 8px 4px;
            border-top: 1px solid #c2d1e0;
        }
        .footer-panel a {
            color: #005a9c;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- 1. Top Header -->
    <div class="header-bar">
        <h1>Daily GK MCQ</h1>
        <span class="tagline">Lite Edition - Fast &amp; 2G Compatible</span>
    </div>

    <div class="wrapper">
        <!-- 2. Mode Switcher -->
        <div class="nav-tabs">
            <a href="lite.html?mode=quiz" class="tab-link" id="linkQuiz">[ Quiz Mode ]</a>
            <a href="lite.html?mode=study" class="tab-link" id="linkStudy">[ Study Mode ]</a>
        </div>

        <!-- 3. Category Filter -->
        <div class="filter-box">
            <form method="get" action="lite.html">
                <input type="hidden" name="mode" id="formModeField" value="quiz" />
                <table class="filter-table">
                    <tr>
                        <td style="width:75%;">
                            <select name="cat" id="catSelector" class="select-input">
                                <option value="">-- All Categories --</option>
                                <option value="General Science">General Science</option>
                                <option value="World Geography">World Geography</option>
                                <option value="History & Civilization">History &amp; Civilization</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="International Affairs">International Affairs</option>
                            </select>
                        </td>
                        <td style="width:25%;">
                            <input type="submit" value="Filter" class="submit-btn" />
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <!-- 4. Questions Stream -->
        <div id="qOutput">
            <!-- Questions rendered via pure ES3 script -->
        </div>

        <!-- 5. Pagination Bar -->
        <div class="pag-panel" id="paginationBar"></div>

        <!-- 6. Bottom Links -->
        <div class="footer-panel">
            <div>(c) 2026 Daily GK MCQ - Lite Edition</div>
            <div style="margin-top: 5px;">
                <a href="index.html?force_full=1">&gt;&gt; Switch to Full App (Android/PC)</a>
            </div>
        </div>
    </div>

    <!-- Pure ES3 JavaScript (Zero Emojis, Bulletproof on Opera Mini 4.x) -->
    <script type="text/javascript">
        // Standard ASCII English Dataset
        var gkDataset = [
            {
                id: 1,
                cat: "General Science",
                topic: "Physics & Space",
                q: "Which planet in our solar system is famously known as the 'Red Planet'?",
                opts: ["Venus", "Mars", "Jupiter", "Saturn"],
                ans: 1,
                desc: "Mars appears red due to large amounts of iron oxide (rust) on its surface."
            },
            {
                id: 2,
                cat: "World Geography",
                topic: "Rivers & Lakes",
                q: "What is considered the longest river in the world?",
                opts: ["Amazon River", "Nile River", "Yangtze River", "Mississippi River"],
                ans: 1,
                desc: "The Nile River in Africa spans approximately 6,650 kilometers (4,132 miles)."
            },
            {
                id: 3,
                cat: "Information Technology",
                topic: "Internet Protocols",
                q: "What does 'HTTP' stand for in web browsing protocols?",
                opts: [
                    "HyperText Transfer Protocol",
                    "High Transfer Tech Protocol",
                    "Hyperlink Text Terminal Process",
                    "Hyper Transfer Tool Protocol"
                ],
                ans: 0,
                desc: "HTTP is the foundation protocol used for data communication on the World Wide Web."
            },
            {
                id: 4,
                cat: "History & Civilization",
                topic: "World History",
                q: "In which year did the Second World War officially end?",
                opts: ["1942", "1945", "1948", "1950"],
                ans: 1,
                desc: "World War II ended in September 1945 following the surrender of Axis forces."
            },
            {
                id: 5,
                cat: "International Affairs",
                topic: "Organizations",
                q: "Where is the official headquarters of the United Nations (UN) located?",
                opts: ["Geneva, Switzerland", "London, UK", "New York City, USA", "Paris, France"],
                ans: 2,
                desc: "The headquarters of the United Nations is situated in New York City, USA."
            },
            {
                id: 6,
                cat: "General Science",
                topic: "Chemistry",
                q: "What is the chemical symbol for Gold?",
                opts: ["Ag", "Au", "Fe", "Pb"],
                ans: 1,
                desc: "Au is derived from the Latin word 'Aurum', meaning shining dawn or gold."
            }
        ];

        // Safe Query Parser
        function getParam(key) {
            var query = window.location.search.substring(1);
            var pairs = query.split("&");
            for (var i = 0; i < pairs.length; i++) {
                var p = pairs[i].split("=");
                if (decodeURIComponent(p[0]) === key) {
                    return decodeURIComponent(p[1] || "");
                }
            }
            return null;
        }

        var activeMode = getParam("mode") || "quiz";
        var activeCat = getParam("cat") || "";
        var activePage = parseInt(getParam("page") || "1", 10);
        if (isNaN(activePage) || activePage < 1) activePage = 1;
        var itemsPerPage = 3;

        // Tab state updates
        document.getElementById("formModeField").value = activeMode;
        if (activeMode === "study") {
            document.getElementById("linkStudy").className = "tab-link active";
        } else {
            document.getElementById("linkQuiz").className = "tab-link active";
        }

        // Category dropdown sync
        var sel = document.getElementById("catSelector");
        for (var i = 0; i < sel.options.length; i++) {
            if (sel.options[i].value === activeCat) {
                sel.selectedIndex = i;
                break;
            }
        }

        // Show/Hide Answer Toggle
        function toggleAnswer(targetId) {
            var el = document.getElementById(targetId);
            if (el) {
                if (el.className.indexOf("open") === -1) {
                    el.className = "ans-panel open";
                } else {
                    el.className = "ans-panel";
                }
            }
        }

        // Data Filtering
        var filteredList = [];
        for (var i = 0; i < gkDataset.length; i++) {
            var item = gkDataset[i];
            if (!activeCat || item.cat === activeCat) {
                filteredList.push(item);
            }
        }

        // Pagination Calculations
        var totalPages = Math.ceil(filteredList.length / itemsPerPage) || 1;
        if (activePage > totalPages) activePage = totalPages;

        var startIdx = (activePage - 1) * itemsPerPage;
        var currentItems = filteredList.slice(startIdx, startIdx + itemsPerPage);

        // Render Questions
        var container = document.getElementById("qOutput");
        var letters = ["A", "B", "C", "D", "E"];
        var out = "";

        if (currentItems.length === 0) {
            out = '<div class="card" style="text-align:center; padding:12px;">No questions found in this category.</div>';
        } else {
            for (var i = 0; i < currentItems.length; i++) {
                var q = currentItems[i];
                var qNo = startIdx + i + 1;
                var ansId = "ans_box_" + q.id;

                out += '<div class="card">';
                
                // Meta info
                out += '<table class="card-meta"><tr>';
                out += '<td><span class="badge-cat">' + q.cat + '</span></td>';
                out += '<td class="badge-id">Question #' + qNo + '</td>';
                out += '</tr></table>';

                // Question Title
                out += '<div class="q-text">' + qNo + '. ' + q.q + '</div>';

                // Options
                out += '<table class="opt-table">';
                for (var j = 0; j < q.opts.length; j++) {
                    out += '<tr>';
                    out += '<td class="opt-prefix">(' + letters[j] + ')</td>';
                    out += '<td class="opt-val">' + q.opts[j] + '</td>';
                    out += '</tr>';
                }
                out += '</table>';

                // Answer Area
                if (activeMode === "study") {
                    out += '<div class="ans-panel open">';
                    out += '<div class="ans-correct">[OK] Correct Answer: (' + letters[q.ans] + ') ' + q.opts[q.ans] + '</div>';
                    if (q.desc) out += '<div class="ans-desc">Note: ' + q.desc + '</div>';
                    out += '</div>';
                } else {
                    out += '<a href="javascript:void(0);" onclick="toggleAnswer(\'' + ansId + '\');" class="ans-btn">[+] View Answer</a>';
                    out += '<div id="' + ansId + '" class="ans-panel">';
                    out += '<div class="ans-correct">[OK] Correct Answer: (' + letters[q.ans] + ') ' + q.opts[q.ans] + '</div>';
                    if (q.desc) out += '<div class="ans-desc">Note: ' + q.desc + '</div>';
                    out += '</div>';
                }

                out += '</div>';
            }
        }
        container.innerHTML = out;

        // Render Pagination
        var pagBox = document.getElementById("paginationBar");
        var baseLink = "lite.html?mode=" + encodeURIComponent(activeMode) + "&cat=" + encodeURIComponent(activeCat);
        var pagHtml = '<div style="margin-bottom:4px; font-weight:bold;">Page ' + activePage + ' of ' + totalPages + '</div>';

        if (activePage > 1) {
            pagHtml += '<a href="' + baseLink + '&page=' + (activePage - 1) + '" class="pag-btn">&lt;&lt; Prev</a> ';
        }
        if (activePage < totalPages) {
            pagHtml += '<a href="' + baseLink + '&page=' + (activePage + 1) + '" class="pag-btn">Next &gt;&gt;</a>';
        }
        pagBox.innerHTML = pagHtml;
    </script>
</body>
</html>
