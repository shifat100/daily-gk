        /* Top Header */

        /* Navigation Mode Tabs */

        /* Options */

        /* Answers and Explanations */

        /* Exam Scorecard Box */

        /* Footer */

<body class="f-md" id="appBody">

    <!-- Pure ES3 JavaScript Multi-Layout Engine -->
    <script type="text/javascript">
        var appState = {
            data: [],
            mode: "quiz",
            cat: "",
            search: "",
            page: 1,
            perPage: 10,
            shuffle: false,
            renderedItems: []
        };

        // Fallback Backup Data
        var fallbackBackup = [
            {
                id: 1,
                cat: "General Science",
                topic: "Physics",
                q: "Which planet is known as the 'Red Planet'?",
                opts: ["Venus", "Mars", "Jupiter", "Saturn"],
                ans: 1,
                desc: "Mars appears red due to iron oxide minerals on its surface."
            },
            {
                id: 2,
                cat: "World Geography",
                topic: "Rivers",
                q: "What is the longest river in the world?",
                opts: ["Amazon River", "Nile River", "Yangtze River", "Mississippi River"],
                ans: 1,
                desc: "The Nile River is traditionally considered the longest river."
            }
        ];

        // Safe Query Parser
        function getParam(key) {
            var query = window.location.search.substring(1);
            if (!query) return "";
            var pairs = query.split("&");
            for (var i = 0; i < pairs.length; i++) {
                var p = pairs[i].split("=");
                var decodedKey = decodeURIComponent(p[0].replace(/\+/g, " "));
                if (decodedKey === key) {
                    return decodeURIComponent((p[1] || "").replace(/\+/g, " "));
                }
            }
            return "";
        }

        // Font Size & Theme Switcher
        function setFont(size) {
            document.getElementById("appBody").className = "f-" + size;
        }
        var isDark = false;
        function toggleTheme() {
            isDark = !isDark;
            document.getElementById("appBody").className = isDark ? "theme-dark" : "";
            document.getElementById("themeBtn").innerHTML = isDark ? "Light Mode" : "Dark Mode";
        }

        // ES3 AJAX Handler
        function ajaxGet(url, onSuccess, onError, isText) {
            var xhr = null;
            if (window.XMLHttpRequest) {
                xhr = new XMLHttpRequest();
            } else if (window.ActiveXObject) {
                try { xhr = new ActiveXObject("Msxml2.XMLHTTP"); } catch(e) {
                    try { xhr = new ActiveXObject("Microsoft.XMLHTTP"); } catch(e2) {}
                }
            }
            if (!xhr) {
                if (onError) onError();
                return;
            }

            var timestamp = new Date().getTime();
            var fullUrl = url + (url.indexOf("?") === -1 ? "?t=" : "&t=") + timestamp;

            xhr.open("GET", fullUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 0) {
                        try {
                            var res = isText ? xhr.responseText : (window.JSON && JSON.parse ? JSON.parse(xhr.responseText) : eval("(" + xhr.responseText + ")"));
                            onSuccess(res);
                        } catch (e) {
                            if (onError) onError(e);
                        }
                    } else {
                        if (onError) onError();
                    }
                }
            };
            try {
                xhr.send(null);
            } catch (err) {
                if (onError) onError(err);
            }
        }

        function toggleAnswer(targetId) {
            var el = document.getElementById(targetId);
            if (el) {
                if (el.className.indexOf("open") === -1) {
                    el.className = "ans-panel open";
                } else {
                    el.className = "ans-panel";
                }
            }
        }

        function setAllAnswers(show) {
            var panels = document.getElementsByTagName("div");
            for (var i = 0; i < panels.length; i++) {
                if (panels[i].className.indexOf("ans-panel") !== -1) {
                    panels[i].className = show ? "ans-panel open" : "ans-panel";
                }
            }
        }

        // 1. Initialize State
        appState.mode = getParam("mode") || "quiz";
        appState.cat = getParam("cat") || "";
        appState.search = getParam("q") || "";
        appState.page = parseInt(getParam("page") || "1", 10);
        appState.perPage = parseInt(getParam("per_page") || "10", 10);
        appState.shuffle = getParam("shuffle") === "1";

        if (appState.mode === "card") appState.perPage = 1;
        if (isNaN(appState.page) || appState.page < 1) appState.page = 1;
        if (isNaN(appState.perPage) || appState.perPage < 1) appState.perPage = 10;

        document.getElementById("formModeField").value = appState.mode;
        document.getElementById("searchField").value = appState.search;
        document.getElementById("pageJumpInput").value = appState.page;
        document.getElementById("shuffleCheck").checked = appState.shuffle;

        var perPageSel = document.getElementById("perPageSelector");
        for (var i = 0; i < perPageSel.options.length; i++) {
            if (parseInt(perPageSel.options[i].value, 10) === appState.perPage) {
                perPageSel.selectedIndex = i;
                break;
            }
        }

        // Highlight Active Tab
        var extraQueries = (appState.cat ? "&cat=" + encodeURIComponent(appState.cat) : "") +
                           (appState.search ? "&q=" + encodeURIComponent(appState.search) : "");

        document.getElementById("linkQuiz").href = "lite.html?mode=quiz" + extraQueries;
        document.getElementById("linkStudy").href = "lite.html?mode=study" + extraQueries;
        document.getElementById("linkExam").href = "lite.html?mode=exam" + extraQueries;
        document.getElementById("linkCard").href = "lite.html?mode=card&per_page=1" + extraQueries;

        if (appState.mode === "study") document.getElementById("linkStudy").className = "tab-link active";
        else if (appState.mode === "exam") document.getElementById("linkExam").className = "tab-link active";
        else if (appState.mode === "card") document.getElementById("linkCard").className = "tab-link active";
        else document.getElementById("linkQuiz").className = "tab-link active";

        // 2. Load Data from Server
        loadDataFromServer();

        function loadDataFromServer() {
            ajaxGet("data/main.json", function(categories) {
                populateCategoryDropdown(categories);

                var activeCats = [];
                for (var k = 0; k < categories.length; k++) {
                    if (!appState.cat || categories[k].title.toLowerCase() === appState.cat.toLowerCase()) {
                        activeCats.push(categories[k]);
                    }
                }
                if (activeCats.length === 0) activeCats = categories;

                var topicTasks = [];
                var pendingCats = activeCats.length;

                for (var i = 0; i < activeCats.length; i++) {
                    (function(cat) {
                        ajaxGet(cat.path, function(topics) {
                            for (var j = 0; j < topics.length; j++) {
                                topicTasks.push({
                                    url: topics[j].path,
                                    cat: cat.title,
                                    topic: topics[j].title
                                });
                            }
                            pendingCats--;
                            if (pendingCats === 0) processTopicFiles(topicTasks, 0);
                        }, function() {
                            pendingCats--;
                            if (pendingCats === 0) processTopicFiles(topicTasks, 0);
                        });
                    })(activeCats[i]);
                }
            }, function() {
                appState.data = fallbackBackup;
                renderQuestions();
            });
        }

        function populateCategoryDropdown(cats) {
            var sel = document.getElementById("catSelector");
            for (var i = 0; i < cats.length; i++) {
                var opt = document.createElement("option");
                opt.value = cats[i].title;
                opt.text = cats[i].title;
                if (appState.cat && cats[i].title.toLowerCase() === appState.cat.toLowerCase()) {
                    opt.selected = true;
                }
                sel.appendChild(opt);
            }
        }

        function processTopicFiles(tasks, index) {
            if (index >= tasks.length) {
                if (appState.data.length === 0) appState.data = fallbackBackup;
                renderQuestions();
                return;
            }

            var task = tasks[index];
            ajaxGet(task.url, function(text) {
                parseTextQuestions(text, task.cat, task.topic);
                processTopicFiles(tasks, index + 1);
            }, function() {
                processTopicFiles(tasks, index + 1);
            }, true);
        }

        function parseTextQuestions(text, cat, topic) {
            var lines = text.replace(/\r\n/g, "\n").split("\n");
            for (var i = 0; i < lines.length; i += 2) {
                var line1 = (lines[i] || "").replace(/^\s+|\s+$/g, "");
                var line2 = (lines[i + 1] || "").replace(/^\s+|\s+$/g, "");
                if (!line1 || !line2) continue;

                var parts = line2.split("|");
                if (parts[parts.length - 1] === "") parts.pop();

                var ans = 0, desc = null, opts = [];
                var last = parts[parts.length - 1];

                if (!isNaN(last) && last !== "") {
                    ans = parseInt(last, 10);
                    opts = parts.slice(0, -1);
                } else {
                    ans = parseInt(parts[parts.length - 2], 10);
                    desc = last;
                    opts = parts.slice(0, -2);
                }

                appState.data.push({
                    id: appState.data.length + 1,
                    cat: cat,
                    topic: topic,
                    q: line1.replace(/\*\*/g, ""),
                    opts: opts,
                    ans: ans,
                    desc: desc
                });
            }
        }

        // 3. Render
        function renderQuestions() {
            var filtered = [];
            var searchLower = appState.search.toLowerCase();

            for (var i = 0; i < appState.data.length; i++) {
                var item = appState.data[i];
                var catMatch = !appState.cat || (item.cat.toLowerCase() === appState.cat.toLowerCase());
                var searchMatch = !appState.search || (item.q.toLowerCase().indexOf(searchLower) !== -1);

                if (catMatch && searchMatch) filtered.push(item);
            }

            if (appState.shuffle) {
                for (var j = filtered.length - 1; j > 0; j--) {
                    var rand = Math.floor(Math.random() * (j + 1));
                    var temp = filtered[j];
                    filtered[j] = filtered[rand];
                    filtered[rand] = temp;
                }
            }

            var totalPages = Math.ceil(filtered.length / appState.perPage) || 1;
            if (appState.page > totalPages) appState.page = totalPages;

            var startIdx = (appState.page - 1) * appState.perPage;
            var currentItems = filtered.slice(startIdx, startIdx + appState.perPage);
            appState.renderedItems = currentItems;

            var container = document.getElementById("qOutput");
            var letters = ["A", "B", "C", "D", "E"];
            var out = "";

            if (currentItems.length === 0) {
                out = '<div class="status-card">No questions found matching your criteria.</div>';
                document.getElementById("paginationBar").style.display = "none";
                document.getElementById("actionBar").style.display = "none";
                document.getElementById("examSubmitContainer").style.display = "none";
            } else {
                document.getElementById("actionBar").style.display = (appState.mode === "quiz") ? "block" : "none";
                document.getElementById("examSubmitContainer").style.display = (appState.mode === "exam") ? "block" : "none";

                for (var i = 0; i < currentItems.length; i++) {
                    var q = currentItems[i];
                    var qNo = startIdx + i + 1;
                    var ansId = "ans_box_" + q.id;

                    out += '<div class="card">';
                    
                    // Meta
                    out += '<table class="card-meta"><tr>';
                    out += '<td><span class="badge-cat">' + q.cat + '</span></td>';
                    out += '<td class="badge-id">Question #' + qNo + '</td>';
                    out += '</tr></table>';

                    // Title
                    out += '<div class="q-text">' + qNo + '. ' + q.q + '</div>';

                    // Options Table (Different for Exam Mode)
                    out += '<table class="opt-table">';
                    for (var j = 0; j < q.opts.length; j++) {
                        out += '<tr>';
                        if (appState.mode === "exam") {
                            out += '<td style="width:25px;"><input type="radio" name="exam_ans_' + q.id + '" value="' + j + '" /></td>';
                            out += '<td class="opt-prefix">[' + letters[j] + ']</td>';
                            out += '<td class="opt-val">' + q.opts[j] + '</td>';
                        } else {
                            out += '<td class="opt-prefix">(' + letters[j] + ')</td>';
                            out += '<td class="opt-val">' + q.opts[j] + '</td>';
                        }
                        out += '</tr>';
                    }
                    out += '</table>';

                    // Mode Behavior
                    if (appState.mode === "study") {
                        out += '<div class="ans-panel open">';
                        out += '<div class="ans-correct">[OK] Correct: (' + letters[q.ans] + ') ' + q.opts[q.ans] + '</div>';
                        if (q.desc) out += '<div class="ans-desc">Note: ' + q.desc + '</div>';
                        out += '</div>';
                    } else if (appState.mode === "exam") {
                        out += '<div id="' + ansId + '" class="ans-panel">';
                        out += '<div class="ans-correct">[OK] Correct: (' + letters[q.ans] + ') ' + q.opts[q.ans] + '</div>';
                        if (q.desc) out += '<div class="ans-desc">Note: ' + q.desc + '</div>';
                        out += '</div>';
                    } else {
                        out += '<a href="javascript:void(0);" onclick="toggleAnswer(\'' + ansId + '\');" class="ans-btn">[+] View Answer</a>';
                        out += '<div id="' + ansId + '" class="ans-panel">';
                        out += '<div class="ans-correct">[OK] Correct: (' + letters[q.ans] + ') ' + q.opts[q.ans] + '</div>';
                        if (q.desc) out += '<div class="ans-desc">Note: ' + q.desc + '</div>';
                        out += '</div>';
                    }

                    out += '</div>';
                }

                // Render Pagination
                var pagContainer = document.getElementById("paginationBar");
                var baseLink = "lite.html?mode=" + encodeURIComponent(appState.mode) +
                               (appState.cat ? "&cat=" + encodeURIComponent(appState.cat) : "") +
                               (appState.search ? "&q=" + encodeURIComponent(appState.search) : "") +
                               (appState.perPage !== 10 ? "&per_page=" + appState.perPage : "") +
                               (appState.shuffle ? "&shuffle=1" : "");

                var pagHtml = '<div style="margin-bottom:4px; font-weight:bold;">Page ' + appState.page + ' of ' + totalPages + ' (' + filtered.length + ' Total)</div>';

                if (appState.page > 1) {
                    pagHtml += '<a href="' + baseLink + '&page=' + (appState.page - 1) + '" class="pag-btn" accesskey="p">&lt;&lt; Prev (P)</a> ';
                }
                if (appState.page < totalPages) {
                    pagHtml += '<a href="' + baseLink + '&page=' + (appState.page + 1) + '" class="pag-btn" accesskey="n">Next (N) &gt;&gt;</a>';
                }
                pagContainer.innerHTML = pagHtml;
                pagContainer.style.display = "block";
            }

            container.innerHTML = out;
        }

        // Grade Exam Mode
        function gradeExam() {
            var correctCount = 0;
            var total = appState.renderedItems.length;

            for (var i = 0; i < total; i++) {
                var q = appState.renderedItems[i];
                var radios = document.getElementsByName("exam_ans_" + q.id);
                var selected = -1;

                for (var r = 0; r < radios.length; r++) {
                    if (radios[r].checked) {
                        selected = parseInt(radios[r].value, 10);
                        break;
                    }
                }

                // Reveal answers
                var ansBox = document.getElementById("ans_box_" + q.id);
                if (ansBox) ansBox.className = "ans-panel open";

                if (selected === q.ans) {
                    correctCount++;
                }
            }

            var resBox = document.getElementById("examResultOutput");
            resBox.className = "exam-score-box";
            resBox.innerHTML = "EXAM RESULT: " + correctCount + " / " + total + " Correct (" + Math.round((correctCount / total) * 100) + "%)";
            resBox.style.display = "block";
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
