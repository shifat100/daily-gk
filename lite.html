<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Daily GK MCQ - Lite Edition</title>
    <style type="text/css">
        /* =========================================================
           Opera Mini 4.x Compatible Pure ASCII CSS2 Layout
           ========================================================= */
        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
            -webkit-box-sizing: border-box;
        }
        body {
            font-family: Tahoma, Arial, Helvetica, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            background-color: #f2f5f8;
            color: #222222;
            margin: 0;
            padding: 0;
        }

        /* Top Header */
        .header-bar {
            background-color: #005a9c;
            color: #ffffff;
            padding: 8px;
            text-align: center;
            border-bottom: 2px solid #00365d;
        }
        .header-bar h1 {
            font-size: 16px;
            margin: 0;
            padding: 0;
            text-transform: uppercase;
        }
        .header-bar .tagline {
            font-size: 10px;
            color: #cce0ff;
            margin-top: 2px;
            display: block;
        }

        /* Main Container */
        .wrapper {
            padding: 6px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Navigation Mode Tabs */
        .nav-tabs {
            background-color: #ffffff;
            border: 1px solid #b0c4de;
            margin-bottom: 6px;
            text-align: center;
            padding: 4px;
        }
        .tab-link {
            display: inline-block;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            color: #005a9c;
        }
        .tab-link.active {
            background-color: #005a9c;
            color: #ffffff;
        }

        /* Filter Box */
        .filter-box {
            background-color: #ffffff;
            border: 1px solid #b0c4de;
            padding: 6px;
            margin-bottom: 6px;
        }
        .filter-table {
            width: 100%;
            border-collapse: collapse;
        }
        .filter-table td {
            padding: 2px;
        }
        .select-input {
            width: 100%;
            padding: 3px;
            font-size: 11px;
            border: 1px solid #8099b3;
            background-color: #fafbfc;
        }
        .submit-btn {
            background-color: #005a9c;
            color: #ffffff;
            border: 1px solid #00365d;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Question Cards */
        .card {
            background-color: #ffffff;
            border: 1px solid #c2d1e0;
            border-top: 3px solid #005a9c;
            padding: 8px;
            margin-bottom: 6px;
        }
        .card-meta {
            width: 100%;
            margin-bottom: 6px;
            border-bottom: 1px dashed #d1dbe6;
            padding-bottom: 3px;
            font-size: 11px;
        }
        .badge-cat {
            background-color: #e3edf7;
            color: #00365d;
            padding: 1px 5px;
            font-weight: bold;
        }
        .badge-id {
            color: #667788;
            font-weight: bold;
            text-align: right;
        }
        .q-text {
            font-size: 13px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 6px;
        }

        /* Options */
        .opt-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 6px;
        }
        .opt-table td {
            padding: 3px 2px;
            vertical-align: top;
            font-size: 12px;
        }
        .opt-prefix {
            width: 25px;
            font-weight: bold;
            color: #005a9c;
        }
        .opt-val {
            color: #333333;
        }

        /* Answers and Explanations */
        .ans-btn {
            display: inline-block;
            background-color: #eef3f8;
            border: 1px solid #8099b3;
            color: #00365d;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
        }
        .ans-panel {
            display: none;
            background-color: #edf7ed;
            border: 1px solid #a3d4a6;
            border-left: 3px solid #2e7d32;
            padding: 6px;
            margin-top: 6px;
            font-size: 11px;
            color: #1e4620;
        }
        .ans-panel.open {
            display: block;
        }
        .ans-correct {
            font-weight: bold;
            color: #1b5e20;
            margin-bottom: 3px;
        }
        .ans-desc {
            color: #334433;
            border-top: 1px dotted #a3d4a6;
            padding-top: 3px;
            margin-top: 3px;
        }

        /* Status & Pagination */
        .status-card {
            background-color: #ffffff;
            border: 1px solid #c2d1e0;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #555555;
        }
        .pag-panel {
            background-color: #ffffff;
            border: 1px solid #b0c4de;
            padding: 6px;
            text-align: center;
            margin-top: 8px;
            font-size: 11px;
        }
        .pag-btn {
            display: inline-block;
            background-color: #005a9c;
            color: #ffffff;
            padding: 3px 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 1px;
            border: 1px solid #00365d;
        }

        /* Footer */
        .footer-panel {
            text-align: center;
            font-size: 11px;
            color: #667788;
            margin-top: 12px;
            padding: 8px 4px;
            border-top: 1px solid #c2d1e0;
        }
        .footer-panel a {
            color: #005a9c;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- 1. Header -->
    <div class="header-bar">
        <h1>Daily GK MCQ</h1>
        <span class="tagline">Lite Edition - Fast &amp; 2G Compatible</span>
    </div>

    <div class="wrapper">
        <!-- 2. Mode Tabs -->
        <div class="nav-tabs">
            <a href="lite.html?mode=quiz" class="tab-link" id="linkQuiz">[ Quiz Mode ]</a>
            <a href="lite.html?mode=study" class="tab-link" id="linkStudy">[ Study Mode ]</a>
        </div>

        <!-- 3. Category Filter Box -->
        <div class="filter-box">
            <form method="get" action="lite.html">
                <input type="hidden" name="mode" id="formModeField" value="quiz" />
                <table class="filter-table">
                    <tr>
                        <td style="width:75%;">
                            <select name="cat" id="catSelector" class="select-input">
                                <option value="">-- All Categories --</option>
                            </select>
                        </td>
                        <td style="width:25%;">
                            <input type="submit" value="Filter" class="submit-btn" />
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <!-- 4. Questions Stream Output -->
        <div id="qOutput">
            <div class="status-card">Loading questions from server...</div>
        </div>

        <!-- 5. Pagination Box -->
        <div class="pag-panel" id="paginationBar" style="display:none;"></div>

        <!-- 6. Footer & Switcher -->
        <div class="footer-panel">
            <div>(c) 2026 Daily GK MCQ - Lite Edition</div>
            <div style="margin-top: 5px;">
                <a href="index.html?force_full=1">&gt;&gt; Switch to Full App (Android/PC)</a>
            </div>
        </div>
    </div>

    <!-- Pure ES3 JavaScript Engine -->
    <script type="text/javascript">
        var appState = {
            data: [],
            mode: "quiz",
            cat: "",
            page: 1,
            perPage: 5
        };

        // Fallback Backup Data (Used ONLY if server JSON fails)
        var fallbackBackup = [
            {
                id: 1,
                cat: "General Science",
                topic: "Physics",
                q: "Which planet is known as the 'Red Planet'?",
                opts: ["Venus", "Mars", "Jupiter", "Saturn"],
                ans: 1,
                desc: "Mars appears red due to iron oxide minerals on its surface."
            },
            {
                id: 2,
                cat: "World Geography",
                topic: "Rivers",
                q: "What is the longest river in the world?",
                opts: ["Amazon River", "Nile River", "Yangtze River", "Mississippi River"],
                ans: 1,
                desc: "The Nile River is traditionally considered the longest river."
            }
        ];

        // Safe Query Parser (Correctly handles '+' as spaces and encoded characters)
        function getParam(key) {
            var query = window.location.search.substring(1);
            if (!query) return "";
            var pairs = query.split("&");
            for (var i = 0; i < pairs.length; i++) {
                var p = pairs[i].split("=");
                var decodedKey = decodeURIComponent(p[0].replace(/\+/g, " "));
                if (decodedKey === key) {
                    return decodeURIComponent((p[1] || "").replace(/\+/g, " "));
                }
            }
            return "";
        }

        // ES3 Cross-Browser AJAX Handler
        function ajaxGet(url, onSuccess, onError, isText) {
            var xhr = null;
            if (window.XMLHttpRequest) {
                xhr = new XMLHttpRequest();
            } else if (window.ActiveXObject) {
                try { xhr = new ActiveXObject("Msxml2.XMLHTTP"); } catch(e) {
                    try { xhr = new ActiveXObject("Microsoft.XMLHTTP"); } catch(e2) {}
                }
            }
            if (!xhr) {
                if (onError) onError();
                return;
            }

            var timestamp = new Date().getTime();
            var fullUrl = url + (url.indexOf("?") === -1 ? "?t=" : "&t=") + timestamp;

            xhr.open("GET", fullUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 0) {
                        try {
                            var res = isText ? xhr.responseText : (window.JSON && JSON.parse ? JSON.parse(xhr.responseText) : eval("(" + xhr.responseText + ")"));
                            onSuccess(res);
                        } catch (e) {
                            if (onError) onError(e);
                        }
                    } else {
                        if (onError) onError();
                    }
                }
            };
            try {
                xhr.send(null);
            } catch (err) {
                if (onError) onError(err);
            }
        }

        // Answer Toggle Handler
        function toggleAnswer(targetId) {
            var el = document.getElementById(targetId);
            if (el) {
                if (el.className.indexOf("open") === -1) {
                    el.className = "ans-panel open";
                } else {
                    el.className = "ans-panel";
                }
            }
        }

        // 1. Initialize State
        appState.mode = getParam("mode") || "quiz";
        appState.cat = getParam("cat") || "";
        appState.page = parseInt(getParam("page") || "1", 10);
        if (isNaN(appState.page) || appState.page < 1) appState.page = 1;

        document.getElementById("formModeField").value = appState.mode;

        // Preserve current Category when clicking Quiz/Study tabs
        var catQuery = appState.cat ? "&cat=" + encodeURIComponent(appState.cat) : "";
        document.getElementById("linkQuiz").href = "lite.html?mode=quiz" + catQuery;
        document.getElementById("linkStudy").href = "lite.html?mode=study" + catQuery;

        if (appState.mode === "study") {
            document.getElementById("linkStudy").className = "tab-link active";
        } else {
            document.getElementById("linkQuiz").className = "tab-link active";
        }

        // 2. Load Data from Server
        loadDataFromServer();

        function loadDataFromServer() {
            ajaxGet("data/main.json", function(categories) {
                populateCategoryDropdown(categories);

                // Selectively load categories (If category is chosen, load only that category to save memory and speed up filter)
                var activeCats = [];
                for (var k = 0; k < categories.length; k++) {
                    if (!appState.cat || categories[k].title.toLowerCase() === appState.cat.toLowerCase()) {
                        activeCats.push(categories[k]);
                    }
                }

                if (activeCats.length === 0) {
                    activeCats = categories; // Fallback to all if name doesn't match
                }

                var topicTasks = [];
                var pendingCats = activeCats.length;

                for (var i = 0; i < activeCats.length; i++) {
                    (function(cat) {
                        ajaxGet(cat.path, function(topics) {
                            for (var j = 0; j < topics.length; j++) {
                                topicTasks.push({
                                    url: topics[j].path,
                                    cat: cat.title,
                                    topic: topics[j].title
                                });
                            }
                            pendingCats--;
                            if (pendingCats === 0) {
                                processTopicFiles(topicTasks, 0);
                            }
                        }, function() {
                            pendingCats--;
                            if (pendingCats === 0) {
                                processTopicFiles(topicTasks, 0);
                            }
                        });
                    })(activeCats[i]);
                }
            }, function() {
                // If main.json unreachable (e.g. offline testing)
                appState.data = fallbackBackup;
                renderQuestions();
            });
        }

        function populateCategoryDropdown(cats) {
            var sel = document.getElementById("catSelector");
            for (var i = 0; i < cats.length; i++) {
                var opt = document.createElement("option");
                opt.value = cats[i].title;
                opt.text = cats[i].title;
                if (appState.cat && cats[i].title.toLowerCase() === appState.cat.toLowerCase()) {
                    opt.selected = true;
                }
                sel.appendChild(opt);
            }
        }

        // Load Topic Text Files Sequentially
        function processTopicFiles(tasks, index) {
            if (index >= tasks.length) {
                if (appState.data.length === 0) {
                    appState.data = fallbackBackup;
                }
                renderQuestions();
                return;
            }

            var task = tasks[index];
            ajaxGet(task.url, function(text) {
                parseTextQuestions(text, task.cat, task.topic);
                processTopicFiles(tasks, index + 1);
            }, function() {
                processTopicFiles(tasks, index + 1);
            }, true);
        }

        // Parse Question Lines
        function parseTextQuestions(text, cat, topic) {
            var lines = text.replace(/\r\n/g, "\n").split("\n");
            for (var i = 0; i < lines.length; i += 2) {
                var line1 = (lines[i] || "").replace(/^\s+|\s+$/g, "");
                var line2 = (lines[i + 1] || "").replace(/^\s+|\s+$/g, "");
                if (!line1 || !line2) continue;

                var parts = line2.split("|");
                if (parts[parts.length - 1] === "") parts.pop();

                var ans = 0;
                var desc = null;
                var opts = [];
                var last = parts[parts.length - 1];

                if (!isNaN(last) && last !== "") {
                    ans = parseInt(last, 10);
                    opts = parts.slice(0, -1);
                } else {
                    ans = parseInt(parts[parts.length - 2], 10);
                    desc = last;
                    opts = parts.slice(0, -2);
                }

                appState.data.push({
                    id: appState.data.length + 1,
                    cat: cat,
                    topic: topic,
                    q: line1.replace(/\*\*/g, ""),
                    opts: opts,
                    ans: ans,
                    desc: desc
                });
            }
        }

        // 3. Filter and Render onto Screen
        function renderQuestions() {
            var filtered = [];
            for (var i = 0; i < appState.data.length; i++) {
                var item = appState.data[i];
                if (!appState.cat || item.cat.toLowerCase() === appState.cat.toLowerCase()) {
                    filtered.push(item);
                }
            }

            var totalPages = Math.ceil(filtered.length / appState.perPage) || 1;
            if (appState.page > totalPages) appState.page = totalPages;

            var startIdx = (appState.page - 1) * appState.perPage;
            var currentItems = filtered.slice(startIdx, startIdx + appState.perPage);

            var container = document.getElementById("qOutput");
            var letters = ["A", "B", "C", "D", "E"];
            var out = "";

            if (currentItems.length === 0) {
                out = '<div class="status-card">No questions found matching this category.</div>';
                document.getElementById("paginationBar").style.display = "none";
            } else {
                for (var i = 0; i < currentItems.length; i++) {
                    var q = currentItems[i];
                    var qNo = startIdx + i + 1;
                    var ansId = "ans_box_" + q.id;

                    out += '<div class="card">';
                    
                    // Category & Index Meta
                    out += '<table class="card-meta"><tr>';
                    out += '<td><span class="badge-cat">' + q.cat + '</span></td>';
                    out += '<td class="badge-id">Question #' + qNo + '</td>';
                    out += '</tr></table>';

                    // Title
                    out += '<div class="q-text">' + qNo + '. ' + q.q + '</div>';

                    // Options
                    out += '<table class="opt-table">';
                    for (var j = 0; j < q.opts.length; j++) {
                        out += '<tr>';
                        out += '<td class="opt-prefix">(' + letters[j] + ')</td>';
                        out += '<td class="opt-val">' + q.opts[j] + '</td>';
                        out += '</tr>';
                    }
                    out += '</table>';

                    // Answer & Explanation
                    if (appState.mode === "study") {
                        out += '<div class="ans-panel open">';
                        out += '<div class="ans-correct">[OK] Correct Answer: (' + letters[q.ans] + ') ' + q.opts[q.ans] + '</div>';
                        if (q.desc) out += '<div class="ans-desc">Note: ' + q.desc + '</div>';
                        out += '</div>';
                    } else {
                        out += '<a href="javascript:void(0);" onclick="toggleAnswer(\'' + ansId + '\');" class="ans-btn">[+] View Answer</a>';
                        out += '<div id="' + ansId + '" class="ans-panel">';
                        out += '<div class="ans-correct">[OK] Correct Answer: (' + letters[q.ans] + ') ' + q.opts[q.ans] + '</div>';
                        if (q.desc) out += '<div class="ans-desc">Note: ' + q.desc + '</div>';
                        out += '</div>';
                    }

                    out += '</div>';
                }

                // Render Pagination (Keeps category query intact)
                var pagContainer = document.getElementById("paginationBar");
                var baseLink = "lite.html?mode=" + encodeURIComponent(appState.mode) + (appState.cat ? "&cat=" + encodeURIComponent(appState.cat) : "");
                var pagHtml = '<div style="margin-bottom:4px; font-weight:bold;">Page ' + appState.page + ' of ' + totalPages + ' (' + filtered.length + ' Total Questions)</div>';

                if (appState.page > 1) {
                    pagHtml += '<a href="' + baseLink + '&page=' + (appState.page - 1) + '" class="pag-btn">&lt;&lt; Prev</a> ';
                }
                if (appState.page < totalPages) {
                    pagHtml += '<a href="' + baseLink + '&page=' + (appState.page + 1) + '" class="pag-btn">Next &gt;&gt;</a>';
                }
                pagContainer.innerHTML = pagHtml;
                pagContainer.style.display = "block";
            }

            container.innerHTML = out;
        }
    </script>
</body>
</html>
