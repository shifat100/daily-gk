<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily GK - Package Explorer</title>
  <style type="text/css">
    /* ============================================================
       CLEAN NOSTALGIA UI (WINDOWS CLASSIC - CLEAN & STRUCTURED)
       NO EMOJIS - STRICT ALIGNMENT - NO TEXT OVERFLOW
       ============================================================ */
    * {
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #008080; /* Classic Teal */
      font-family: "Tahoma", "MS Sans Serif", "Verdana", "Arial", sans-serif;
      font-size: 11px;
      color: #000000;
      padding: 6px;
    }

    /* MAIN CONTAINER WINDOW */
    .win-window {
      background-color: #d4d0c8;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: 2px 2px 0px #000000;
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
    }

    /* TITLEBAR */
    .win-titlebar {
      height: 22px;
      background: #000080;
      background: -webkit-linear-gradient(left, #000080, #1084d0);
      background: -moz-linear-gradient(left, #000080, #1084d0);
      background: linear-gradient(to right, #000080, #1084d0);
      padding: 2px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      font-weight: bold;
    }

    .win-titlebar-text {
      padding-left: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
    }

    .win-titlebar-controls {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .win-btn-sys {
      width: 16px;
      height: 14px;
      line-height: 10px;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: bold;
      background-color: #d4d0c8;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      color: #000000;
      cursor: pointer;
      text-align: center;
    }

    .win-btn-sys:active {
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    /* TABS */
    .win-tab-strip {
      display: flex;
      background: #d4d0c8;
      padding: 5px 6px 0 6px;
      border-bottom: 1px solid #808080;
      gap: 3px;
    }

    .win-tab-btn {
      background-color: #d4d0c8;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: none;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 11px;
      color: #000000;
      cursor: pointer;
      margin-bottom: -1px;
      white-space: nowrap;
    }

    .win-tab-btn.active {
      background-color: #ffffff;
      border-bottom: 1px solid #ffffff;
      font-weight: bold;
    }

    /* COMPACT CONTROLS TOOLBAR */
    .win-toolbar {
      background: #d4d0c8;
      padding: 5px 6px;
      border-bottom: 1px solid #808080;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .win-search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .win-input {
      width: 100%;
      background-color: #ffffff;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 11px;
      color: #000000;
      outline: none;
    }

    .win-btn {
      background-color: #d4d0c8;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      color: #000000;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      display: inline-block;
      text-align: center;
    }

    .win-btn:active {
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    /* WORKSPACE */
    .win-workspace {
      background: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      margin: 4px;
      min-height: 280px;
      max-height: 580px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* FOLDER GROUP BLOCK */
    .folder-group {
      border-bottom: 1px solid #e8e8e8;
    }

    .folder-header {
      background: #f0f0ea;
      border-bottom: 1px solid #d4d0c8;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #222222;
      cursor: pointer;
      user-select: none;
    }

    .folder-header:hover {
      background: #e6e6dc;
    }

    .folder-toggle {
      width: 14px;
      height: 14px;
      line-height: 11px;
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid #808080;
      background: #ffffff;
      color: #000000;
      display: inline-block;
    }

    .folder-items-container {
      padding: 0;
    }

    .folder-items-container.collapsed {
      display: none;
    }

    /* CLEAN FILE ITEM ROW */
    .file-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px 7px 24px;
      border-bottom: 1px solid #f4f4f4;
      gap: 8px;
    }

    .file-row:hover {
      background-color: #f7f9fa;
    }

    .file-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .file-title-line {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .type-badge {
      font-size: 9px;
      font-weight: bold;
      padding: 0 4px;
      border-radius: 2px;
      border: 1px solid #a0a0a0;
      background: #e6e6e6;
      color: #000080;
      flex-shrink: 0;
    }

    .file-name-link {
      color: #000080;
      font-weight: bold;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name-link:hover {
      text-decoration: underline;
    }

    .file-meta-line {
      color: #555555;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-right {
      flex-shrink: 0;
    }

    .btn-download {
      font-weight: bold;
      color: #000000;
      padding: 3px 10px;
      background-color: #d4d0c8;
    }

    /* STATUS BAR */
    .win-statusbar {
      background-color: #d4d0c8;
      border-top: 1px solid #808080;
      padding: 2px 4px;
      display: flex;
      gap: 4px;
    }

    .win-status-pane {
      background: #d4d0c8;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 2px 6px;
      font-size: 10px;
      white-space: nowrap;
    }

    .pane-flex {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 480px) {
      body { padding: 0; }
      .win-window { border: none; box-shadow: none; }
      .file-row { padding-left: 14px; }
      .win-statusbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <!-- RETRO WINDOW -->
  <div class="win-window">
    
    <!-- 1. TITLEBAR -->
    <div class="win-titlebar">
      <div class="win-titlebar-text" id="winTitleText">Daily GK - Package Explorer</div>
      <div class="win-titlebar-controls">
        <button class="win-btn-sys" onclick="alert('Daily GK Universal Package Store')">?</button>
        <button class="win-btn-sys" onclick="window.location.reload()">_</button>
        <button class="win-btn-sys" onclick="window.location.href='index.html'">X</button>
      </div>
    </div>

    <!-- 2. TABS -->
    <div class="win-tab-strip">
      <button class="win-tab-btn active" id="tabBtnPacks" onclick="switchTab('packs')">
        Question Packs (.pak)
      </button>
      <button class="win-tab-btn" id="tabBtnClients" onclick="switchTab('clients')">
        Client Apps (.apk, .exe, .jar)
      </button>
    </div>

    <!-- 3. COMPACT SEARCH TOOLBAR -->
    <div class="win-toolbar">
      <div class="win-search-box">
        <span style="color:#333; font-weight:bold;">Search:</span>
        <input type="text" id="filterInput" class="win-input" onkeyup="applyFilter(this.value)" placeholder="Filter by name or year..." />
        <button class="win-btn" onclick="clearFilter()">Clear</button>
      </div>
      <a class="win-btn" href="index.html">[Open App]</a>
    </div>

    <!-- 4. WORKSPACE / FOLDER & FILE LIST -->
    <div class="win-workspace" id="workspaceContainer">
      <div id="loadingStatus" style="padding: 16px; color: #666666; text-align: center;">
        Reading package directory...
      </div>
      <div id="fileDirectoryView"></div>
    </div>

    <!-- 5. STATUS BAR -->
    <div class="win-statusbar">
      <div class="win-status-pane pane-flex" id="sb-status">Ready.</div>
      <div class="win-status-pane" id="sb-objects">0 Files</div>
      <div class="win-status-pane" id="sb-extra">0 Questions</div>
      <div class="win-status-pane" id="sb-size">0.00 MB</div>
    </div>

  </div>

  <script type="text/javascript">
    var FALLBACK_PACKS = [
      { "id": "master", "name": "Master Question Bank (All Questions)", "category": "All", "file": "data/master.pak", "questions": 7052, "size_kb": 24240.48 },
      { "id": "2026", "name": "সাধারণ জ্ঞান (2026)", "category": "সাধারণ জ্ঞান", "file": "data/2026/2026.pak", "questions": 2472, "size_kb": 8452.92 },
      { "id": "2025", "name": "সাধারণ জ্ঞান (2025)", "category": "সাধারণ জ্ঞান", "file": "data/2025/2025.pak", "questions": 3421, "size_kb": 11331.31 },
      { "id": "ai", "name": "AI (Artificial Intelligence)", "category": "AI", "file": "data/ai/ai.pak", "questions": 1057, "size_kb": 4136.0 },
      { "id": "books", "name": "বই থেকে (Books Collection)", "category": "বই থেকে", "file": "data/books/books.pak", "questions": 102, "size_kb": 320.3 }
    ];

    var FALLBACK_CLIENTS = [
      { "id": "android", "name": "Android Package", "category": "Mobile", "file": "app-release.apk", "size_kb": 15420.5 },
      { "id": "windows", "name": "Windows Desktop Launcher", "category": "Desktop", "file": "Daily-GK.bat", "size_kb": 14.2 },
      { "id": "linux", "name": "Linux Shell Launcher", "category": "Desktop", "file": "Daily-GK.sh", "size_kb": 11.5 },
      { "id": "j2me", "name": "Java Feature Phone MIDlet", "category": "Feature Phone", "file": "Daily-GK.jar", "size_kb": 512.0 },
      { "id": "mre", "name": "MediaTek MRE VXP Application", "category": "Feature Phone", "file": "Daily-GK.vbm", "size_kb": 780.0 }
    ];

    var activeTab = "packs";
    var packsData = null;
    var clientsData = null;

    function createXHR() {
      if (window.XMLHttpRequest) return new XMLHttpRequest();
      try { return new ActiveXObject("Msxml2.XMLHTTP.6.0"); } catch (e) {}
      try { return new ActiveXObject("Microsoft.XMLHTTP"); } catch (e) {}
      return null;
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.getElementById("tabBtnPacks").className = "win-tab-btn" + (tabName === "packs" ? " active" : "");
      document.getElementById("tabBtnClients").className = "win-tab-btn" + (tabName === "clients" ? " active" : "");
      document.getElementById("filterInput").value = "";

      if (tabName === "packs") {
        document.getElementById("winTitleText").innerHTML = "Daily GK - Package Explorer [packs.json]";
        if (!packsData) fetchData("packs", "./packs.json", FALLBACK_PACKS);
        else renderDataset(packsData);
      } else {
        document.getElementById("winTitleText").innerHTML = "Daily GK - Client Apps [clients.json]";
        if (!clientsData) fetchData("clients", "./clients.json", FALLBACK_CLIENTS);
        else renderDataset(clientsData);
      }
    }

    function fetchData(type, url, fallback) {
      document.getElementById("loadingStatus").style.display = "block";
      var xhr = createXHR();
      if (!xhr) {
        onDataReady(type, fallback);
        return;
      }
      xhr.open("GET", url + "?t=" + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 0) {
            try {
              var parsed = window.JSON && window.JSON.parse ? JSON.parse(xhr.responseText) : eval("(" + xhr.responseText + ")");
              onDataReady(type, parsed);
            } catch (err) {
              onDataReady(type, fallback);
            }
          } else {
            onDataReady(type, fallback);
          }
        }
      };
      try { xhr.send(null); } catch (e) { onDataReady(type, fallback); }
    }

    function onDataReady(type, data) {
      if (type === "packs") packsData = data;
      else clientsData = data;
      renderDataset(data);
    }

    function formatKB(kb) {
      if (!kb) return "0 KB";
      if (kb >= 1024) return (kb / 1024).toFixed(2) + " MB";
      return Math.round(kb) + " KB";
    }

    // Organizes files into clean folders
    function groupFiles(list, filterText) {
      var groups = {};
      var filter = (filterText || "").toLowerCase().trim();

      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var filePath = (item.file || "").replace(/\\/g, "/");

        if (filter) {
          var matchText = (item.name + " " + filePath + " " + (item.category || "")).toLowerCase();
          if (matchText.indexOf(filter) === -1) continue;
        }

        var parts = filePath.split("/");
        var folderName = "General";
        var fileName = parts[parts.length - 1];

        if (parts.length > 1) {
          // Removes redundant 'data/' from the display folder title
          var folderParts = parts.slice(0, parts.length - 1);
          if (folderParts[0].toLowerCase() === "data" && folderParts.length > 1) {
            folderName = folderParts.slice(1).join("/");
          } else {
            folderName = folderParts.join("/");
          }
        }

        if (!groups[folderName]) groups[folderName] = [];
        groups[folderName].push({ data: item, fileName: fileName, fullPath: filePath });
      }
      return groups;
    }

    function renderDataset(list, filterText) {
      document.getElementById("loadingStatus").style.display = "none";
      var container = document.getElementById("fileDirectoryView");
      container.innerHTML = "";

      var groups = groupFiles(list, filterText);
      var folderKeys = [];
      for (var k in groups) {
        if (groups.hasOwnProperty(k)) folderKeys.push(k);
      }

      if (folderKeys.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No files matching your search.</div>';
        updateStatusBar([], activeTab);
        return;
      }

      folderKeys.sort();
      var folderIdx = 0;

      for (var i = 0; i < folderKeys.length; i++) {
        var fName = folderKeys[i];
        var items = groups[fName];
        folderIdx++;

        var groupDiv = document.createElement("div");
        groupDiv.className = "folder-group";

        var containerId = "fld-items-" + folderIdx;
        var toggleId = "fld-tog-" + folderIdx;

        // Folder Header
        var header = document.createElement("div");
        header.className = "folder-header";
        header.onclick = (function(cId, tId) {
          return function() { toggleFolder(cId, tId); };
        })(containerId, toggleId);

        header.innerHTML =
          '<span id="' + toggleId + '" class="folder-toggle">[-]</span> ' +
          '<span>[DIR] ' + fName + '/ (' + items.length + ' item' + (items.length > 1 ? 's' : '') + ')</span>';

        groupDiv.appendChild(header);

        // Files container
        var itemsDiv = document.createElement("div");
        itemsDiv.className = "folder-items-container";
        itemsDiv.id = containerId;

        for (var j = 0; j < items.length; j++) {
          var fileObj = items[j];
          var d = fileObj.data;
          var badgeText = (activeTab === "packs") ? "PAK" : "APP";

          var row = document.createElement("div");
          row.className = "file-row";

          var metaText = (d.category ? d.category : "General") + " &bull; " +
                         (d.questions ? d.questions.toLocaleString() + " Qs &bull; " : "") +
                         formatKB(d.size_kb);

          row.innerHTML =
            '<div class="file-left">' +
              '<div class="file-title-line">' +
                '<span class="type-badge">' + badgeText + '</span> ' +
                '<a class="file-name-link" href="' + d.file + '" download>' + fileObj.fileName + '</a>' +
              '</div>' +
              '<div class="file-meta-line">' + metaText + '</div>' +
            '</div>' +
            '<div class="file-right">' +
              '<a class="win-btn btn-download" href="' + d.file + '" download>Download</a>' +
            '</div>';

          itemsDiv.appendChild(row);
        }

        groupDiv.appendChild(itemsDiv);
        container.appendChild(groupDiv);
      }

      updateStatusBar(list, activeTab);
    }

    function toggleFolder(containerId, toggleId) {
      var el = document.getElementById(containerId);
      var tog = document.getElementById(toggleId);
      if (!el) return;

      if (el.className.indexOf("collapsed") === -1) {
        el.className += " collapsed";
        if (tog) tog.innerHTML = "[+]";
      } else {
        el.className = el.className.replace(/\bcollapsed\b/g, "").replace(/^\s+|\s+$/g, "");
        if (tog) tog.innerHTML = "[-]";
      }
    }

    function applyFilter(text) {
      var current = (activeTab === "packs") ? packsData : clientsData;
      if (current) renderDataset(current, text);
    }

    function clearFilter() {
      document.getElementById("filterInput").value = "";
      applyFilter("");
    }

    function updateStatusBar(list, tabType) {
      var totalKb = 0;
      var totalQs = 0;

      for (var i = 0; i < list.length; i++) {
        totalKb += (list[i].size_kb || 0);
        if (list[i].questions) totalQs += list[i].questions;
      }

      document.getElementById("sb-status").innerHTML = "Ready.";
      document.getElementById("sb-objects").innerHTML = list.length + " File(s)";
      document.getElementById("sb-extra").innerHTML = (tabType === "packs") ? (totalQs.toLocaleString() + " Questions") : (list.length + " Platforms");
      document.getElementById("sb-size").innerHTML = (totalKb / 1024).toFixed(2) + " MB";
    }

    window.onload = function() {
      switchTab("packs");
    };
  </script>
</body>
</html>
