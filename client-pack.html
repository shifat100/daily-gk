  <title>Daily GK - Package Explorer</title>
  <style type="text/css">
    /* ============================================================
       NOSTALGIA UI (WIN 98/2000 SYSTEM THEME)
       COMPATIBLE WITH OLD BROWSERS (OPERA MINI 4, IE6+, J2ME)
       AND MODERN BROWSERS ALIKE (STRICTLY NO CSS FLEXBOX/ES6)
       ============================================================ */

      -moz-box-sizing: border-box;

    /* MAIN CONTAINER WINDOW */

    /* TOOLBAR */

    /* WORKSPACE */
    .win-workspace {

    /* SOLID VIEW STYLES */
    .solid-folder-group {

    /* TREE VIEW STYLES */

    /* STATUS BAR */
    .win-statusbar {

    /* README MODAL STYLES */
    .win-modal-overlay {

      border-right: 2px solid #404040;

    .win-doc-viewer {
      background-color: #ffffff;

    .win-doc-viewer .md-code-block {

    .win-doc-viewer .md-table {

    .win-doc-viewer .md-table th,

    }

    .win-doc-viewer .md-table th {

    .win-dialog-actions {

    }

    /* MOBILE & FEATURE PHONES ADJUSTMENTS */
    @media (max-width: 480px) {
      body { padding: 0; }
      .win-window { border: none; }
      .toolbar-left, .toolbar-right { float: none; width: 100%; text-align: left; margin-bottom: 4px; }
      .win-statusbar { display: block; }
      .win-status-pane { display: inline-block; margin-bottom: 2px; }
    }
  </style>
</head>
<body>

  <!-- RETRO WINDOW ROOT -->
  <div class="win-window">
    
    <!-- 1. TITLEBAR -->
    <div class="win-titlebar">
      <div class="win-titlebar-text" id="winTitleText">Daily GK - Package Explorer</div>
      <div class="win-titlebar-controls">
        <button type="button" class="win-btn-sys" onclick="alert('Daily GK Universal Package Explorer')" title="Help">?</button>
        <button type="button" class="win-btn-sys" onclick="window.location.reload()" title="Refresh">_</button>
        <!-- CLOSE BUTTON (TRIGGERS HISTORY BACK) -->
        <button type="button" class="win-btn-sys" onclick="handleWinClose()" title="Back / Close">X</button>
      </div>
    </div>

    <!-- 2. TABS -->
    <div class="win-tab-strip">
      <a href="javascript:void(0);" class="win-tab-btn active" id="tabBtnPacks" onclick="switchTab('packs')">
        Question Packs (.pak)
      </a>
      <a href="javascript:void(0);" class="win-tab-btn" id="tabBtnClients" onclick="switchTab('clients')">
        Client Apps (.apk, .bat, .jar)
      </a>
    </div>

    <!-- 3. TOOLBAR WITH VIEW TOGGLES -->
    <div class="win-toolbar clearfix">
      <div class="toolbar-left">
        <strong>Find:</strong>
        <input type="text" id="filterInput" class="win-input" onkeyup="applyFilter(this.value)" placeholder="Search..." />
        <button type="button" class="win-btn" onclick="clearFilter()">Clear</button>
      </div>
      <div class="toolbar-right">
        <button type="button" class="win-btn" id="btnViewTree" onclick="switchView('tree')">[Tree View]</button>
        <button type="button" class="win-btn pressed" id="btnViewSolid" onclick="switchView('solid')">[Solid View]</button>
        <a class="win-btn" href="index.html">[App]</a>
      </div>
    </div>

    <!-- 4. WORKSPACE CONTAINER -->
    <div class="win-workspace" id="workspaceContainer">
      <div id="loadingStatus" style="padding: 16px; color: #666666; text-align: center;">
        Loading data...
      </div>
      <div id="workspaceContent"></div>
    </div>

    <!-- 5. STATUS BAR -->
    <div class="win-statusbar">
      <div class="win-status-pane pane-flex" id="sb-status">Ready.</div>
      <div class="win-status-pane" id="sb-objects">0 Files</div>
      <div class="win-status-pane" id="sb-extra">0 Questions</div>
      <div class="win-status-pane" id="sb-size">0.00 MB</div>
    </div>

  </div>

  <!-- RETRO README CONFIRMATION MODAL -->
  <div class="win-modal-overlay" id="readmeModal">
    <div class="win-dialog-box">
      <div class="win-titlebar">
        <div class="win-titlebar-text" id="readmeModalTitle">Folder Notice - README.md</div>
        <div class="win-titlebar-controls">
          <button type="button" class="win-btn-sys" onclick="closeReadmeModal()">X</button>
        </div>
      </div>
      <div class="win-dialog-content">
        <div style="font-size: 11px; font-weight: bold; color: #222;" id="readmeNoticeText">
          Please review the instructions below before downloading:
        </div>
        <div class="win-doc-viewer" id="readmeContent">Loading instructions...</div>
      </div>
      <div class="win-dialog-actions">
        <button type="button" class="win-btn" style="font-weight:bold; color: #000080;" id="btnConfirmDownload">
          [ I Confirm and Download ]
        </button>
        <button type="button" class="win-btn" onclick="closeReadmeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    /* ============================================================
       STRICT ES3/ES5 ENGINE - SUPPORTS OPERA MINI 4 & ALL OLD ENGINES
       ============================================================ */
    var FALLBACK_PACKS = [
      { "id": "master", "name": "Master Question Bank (All Questions)", "category": "All", "file": "data/master.pak", "questions": 7052, "size_kb": 24240.48 },
      { "id": "2026", "name": "সাধারণ জ্ঞান (2026)", "category": "সাধারণ জ্ঞান", "file": "data/2026/2026.pak", "questions": 2472, "size_kb": 8452.92 },
      { "id": "2025", "name": "সাধারণ জ্ঞান (2025)", "category": "সাধারণ জ্ঞান", "file": "data/2025/2025.pak", "questions": 3421, "size_kb": 11331.31 },
      { "id": "ai", "name": "AI (Artificial Intelligence)", "category": "AI", "file": "data/ai/ai.pak", "questions": 1057, "size_kb": 4136.0 },
      { "id": "books", "name": "বই থেকে (Books Collection)", "category": "বই থেকে", "file": "data/books/books.pak", "questions": 102, "size_kb": 320.3 }
    ];

    var FALLBACK_CLIENTS = [
      { "id": "android", "name": "Android Package", "category": "Mobile", "file": "app-release.apk", "size_kb": 15420.5 },
      { "id": "windows", "name": "Windows Desktop Launcher", "category": "Desktop", "file": "Daily-GK.bat", "size_kb": 14.2 },
      { "id": "linux", "name": "Linux Shell Launcher", "category": "Desktop", "file": "Daily-GK.sh", "size_kb": 11.5 },
      { "id": "j2me", "name": "Java Feature Phone MIDlet", "category": "Feature Phone", "file": "Daily-GK.jar", "size_kb": 512.0 },
      { "id": "mre", "name": "MediaTek MRE VXP Application", "category": "Feature Phone", "file": "Daily-GK.vbm", "size_kb": 780.0 }
    ];

    var activeTab = "packs";
    var currentView = "solid";
    var packsData = null;
    var clientsData = null;
    var folderReadmeCache = {};

    // String trim helper for older browsers without String.prototype.trim
    function safeTrim(str) {
      if (!str) return "";
      return ("" + str).replace(/^\s+|\s+$/g, "");
    }

    // CLOSE BUTTON HANDLER: HISTORY BACK
    function handleWinClose() {
      if (window.history && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    }

    function createXHR() {
      if (window.XMLHttpRequest) return new XMLHttpRequest();
      try { return new ActiveXObject("Msxml2.XMLHTTP.6.0"); } catch (e) {}
      try { return new ActiveXObject("Microsoft.XMLHTTP"); } catch (e) {}
      return null;
    }

    // Identifies README to hide it from standard lists
    function isReadmeFile(filePath) {
      if (!filePath) return false;
      var clean = filePath.replace(/\\/g, "/").toLowerCase();
      var parts = clean.split("/");
      var fileName = parts[parts.length - 1];
      return (fileName === "readme.md" || fileName === "readme.txt");
    }

    // FILTERS OUT ANY FILE FROM "clients/sources", "sources/", "clients/scripts", OR "scripts/"
    function isExcludedFile(item) {
      if (!item) return false;
      var f = (item.file || "").replace(/\\/g, "/").toLowerCase();
      var cat = (item.category || "").toLowerCase();

      // Exclude sources
      if (f.indexOf("clients/sources") !== -1 || f.indexOf("/sources/") !== -1 || f.indexOf("sources/") === 0) {
        return true;
      }
      if (cat === "sources" || cat === "source" || cat.indexOf("source") !== -1) {
        return true;
      }

      // Exclude scripts
      if (f.indexOf("clients/scripts") !== -1 || f.indexOf("/scripts/") !== -1 || f.indexOf("scripts/") === 0) {
        return true;
      }
      if (cat === "scripts" || cat === "script" || cat.indexOf("script") !== -1) {
        return true;
      }

      return false;
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.getElementById("tabBtnPacks").className = "win-tab-btn" + (tabName === "packs" ? " active" : "");
      document.getElementById("tabBtnClients").className = "win-tab-btn" + (tabName === "clients" ? " active" : "");
      document.getElementById("filterInput").value = "";

      if (tabName === "packs") {
        document.getElementById("winTitleText").innerHTML = "Daily GK - Package Explorer [packs.json]";
        if (!packsData) fetchData("packs", "./packs.json", FALLBACK_PACKS);
        else renderCurrentView();
      } else {
        document.getElementById("winTitleText").innerHTML = "Daily GK - Client Apps [clients.json]";
        if (!clientsData) fetchData("clients", "./clients.json", FALLBACK_CLIENTS);
        else renderCurrentView();
      }
    }

    function switchView(viewName) {
      currentView = viewName;
      document.getElementById("btnViewTree").className = "win-btn" + (viewName === "tree" ? " pressed" : "");
      document.getElementById("btnViewSolid").className = "win-btn" + (viewName === "solid" ? " pressed" : "");
      renderCurrentView();
    }

    function fetchData(type, url, fallback) {
      document.getElementById("loadingStatus").style.display = "block";
      var xhr = createXHR();
      if (!xhr) {
        onDataLoaded(type, fallback);
        return;
      }
      xhr.open("GET", url + "?t=" + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 0) {
            try {
              var parsed = window.JSON && window.JSON.parse ? JSON.parse(xhr.responseText) : eval("(" + xhr.responseText + ")");
              onDataLoaded(type, parsed);
            } catch (err) {
              onDataLoaded(type, fallback);
            }
          } else {
            onDataLoaded(type, fallback);
          }
        }
      };
      try { xhr.send(null); } catch (e) { onDataLoaded(type, fallback); }
    }

    function onDataLoaded(type, data) {
      if (type === "packs") packsData = data;
      else clientsData = data;
      renderCurrentView();
    }

    function formatKB(kb) {
      if (!kb) return "0 KB";
      if (kb >= 1024) return (kb / 1024).toFixed(2) + " MB";
      return Math.round(kb) + " KB";
    }

    function getActiveDataset() {
      return (activeTab === "packs") ? (packsData || FALLBACK_PACKS) : (clientsData || FALLBACK_CLIENTS);
    }

    function renderCurrentView() {
      document.getElementById("loadingStatus").style.display = "none";
      var rawData = getActiveDataset();
      var filterText = safeTrim((document.getElementById("filterInput").value || "")).toLowerCase();

      var visibleData = [];
      for (var i = 0; i < rawData.length; i++) {
        var item = rawData[i];
        
        // Exclude clients/sources and clients/scripts
        if (isExcludedFile(item)) continue;

        // Cache and hide READMEs
        if (isReadmeFile(item.file)) {
          var dir = getFileDirectory(item.file);
          if (!folderReadmeCache[dir]) {
            folderReadmeCache[dir] = { url: item.file, content: null };
          }
          continue;
        }

        visibleData.push(item);
      }

      if (currentView === "solid") {
        renderSolidView(visibleData, filterText);
      } else {
        renderTreeView(visibleData, filterText);
      }
    }

    /* ============================================================
       MARKDOWN PARSER
       ============================================================ */
    function escapeHtml(text) {
      return (text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatInlineMarkdown(str) {
      str = escapeHtml(str);
      str = str.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="md-link">$1</a>');
      str = str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      str = str.replace(/\b__([^_]+)__\b/g, '<strong>$1</strong>');
      str = str.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      str = str.replace(/\b_([^_]+)_\b/g, '<em>$1</em>');
      return str;
    }

    function parseTableRowCells(lineStr) {
      var clean = lineStr.replace(/^\|/, "").replace(/\|$/, "");
      var raw = clean.split("|");
      var cells = [];
      for (var i = 0; i < raw.length; i++) {
        cells.push(safeTrim(raw[i]));
      }
      return cells;
    }

    function renderMarkdownToHtml(md) {
      if (!md) return "<em>(Empty documentation)</em>";

      var src = md.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

      var codeBlocks = [];
      src = src.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, function(match, lang, code) {
        var token = "\uE000CB" + codeBlocks.length + "\uE001";
        codeBlocks.push('<pre class="md-code-block"><code>' + escapeHtml(code.replace(/^\n+|\n+$/g, "")) + '</code></pre>');
        return "\n" + token + "\n";
      });

      var inlineCodes = [];
      src = src.replace(/`([^`\n]+)`/g, function(match, code) {
        var token = "\uE000IC" + inlineCodes.length + "\uE001";
        inlineCodes.push('<code class="md-inline-code">' + escapeHtml(code) + '</code>');
        return token;
      });

      var lines = src.split("\n");
      var out = [];
      var inList = false;
      var inOrderedList = false;
      var i = 0;

      function closeLists() {
        if (inList) { out.push("</ul>"); inList = false; }
        if (inOrderedList) { out.push("</ol>"); inOrderedList = false; }
      }

      while (i < lines.length) {
        var line = lines[i];
        var trimmed = safeTrim(line);

        if (trimmed.indexOf("\uE000CB") === 0) {
          closeLists();
          out.push(trimmed);
          i++;
          continue;
        }

        if (!trimmed) {
          closeLists();
          i++;
          continue;
        }

        if (trimmed.charAt(0) === "|" && (i + 1 < lines.length) && /^\s*\|?\s*:?-+:?\s*\|/.test(lines[i + 1])) {
          closeLists();
          var tableHtml = '<table class="md-table"><thead><tr>';
          var headerCols = parseTableRowCells(trimmed);
          for (var h = 0; h < headerCols.length; h++) {
            tableHtml += "<th>" + formatInlineMarkdown(headerCols[h]) + "</th>";
          }
          tableHtml += "</tr></thead><tbody>";
          i += 2;

          while (i < lines.length && safeTrim(lines[i]).charAt(0) === "|") {
            var rowCols = parseTableRowCells(safeTrim(lines[i]));
            tableHtml += "<tr>";
            for (var c = 0; c < headerCols.length; c++) {
              var val = (c < rowCols.length) ? rowCols[c] : "";
              tableHtml += "<td>" + formatInlineMarkdown(val) + "</td>";
            }
            tableHtml += "</tr>";
            i++;
          }
          tableHtml += "</tbody></table>";
          out.push(tableHtml);
          continue;
        }

        var ulMatch = line.match(/^(\s*)[-*+]\s+(.*)$/);
        if (ulMatch) {
          if (inOrderedList) { out.push("</ol>"); inOrderedList = false; }
          if (!inList) { out.push('<ul class="md-ul">'); inList = true; }
          out.push("<li>" + formatInlineMarkdown(ulMatch[2]) + "</li>");
          i++;
          continue;
        }

        var olMatch = line.match(/^(\s*)\d+\.\s+(.*)$/);
        if (olMatch) {
          if (inList) { out.push("</ul>"); inList = false; }
          if (!inOrderedList) { out.push('<ol class="md-ol">'); inOrderedList = true; }
          out.push("<li>" + formatInlineMarkdown(olMatch[2]) + "</li>");
          i++;
          continue;
        }

        closeLists();

        var hMatch = line.match(/^(#{1,6})\s+(.*)$/);
        if (hMatch) {
          var lvl = hMatch[1].length;
          out.push('<h' + lvl + ' class="md-h' + lvl + '">' + formatInlineMarkdown(hMatch[2]) + '</h' + lvl + '>');
          i++;
          continue;
        }

        if (/^(\*{3,}|-{3,}|_{3,})$/.test(trimmed)) {
          out.push('<hr class="md-hr" />');
          i++;
          continue;
        }

        if (/^>\s?(.*)$/.test(line)) {
          out.push('<blockquote class="md-quote">' + formatInlineMarkdown(line.replace(/^>\s?/, "")) + '</blockquote>');
          i++;
          continue;
        }

        out.push('<p class="md-p">' + formatInlineMarkdown(line) + '</p>');
        i++;
      }

      closeLists();

      var resultHtml = out.join("\n");
      for (var ic = 0; ic < inlineCodes.length; ic++) {
        resultHtml = resultHtml.split("\uE000IC" + ic + "\uE001").join(inlineCodes[ic]);
      }
      for (var cb = 0; cb < codeBlocks.length; cb++) {
        resultHtml = resultHtml.split("\uE000CB" + cb + "\uE001").join(codeBlocks[cb]);
      }

      return resultHtml;
    }

    /* ============================================================
       README CHECK & FILE DOWNLOAD HANDLER
       ============================================================ */
    function getFileDirectory(filePath) {
      filePath = (filePath || "").replace(/\\/g, "/");
      var idx = filePath.lastIndexOf("/");
      return (idx !== -1) ? filePath.substring(0, idx) : "";
    }

    function triggerDirectDownload(fileUrl, fileName) {
      var a = document.createElement("a");
      a.href = fileUrl;
      a.download = fileName || "";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function checkReadme(dirPath, callback) {
      if (folderReadmeCache.hasOwnProperty(dirPath) && folderReadmeCache[dirPath] && folderReadmeCache[dirPath].content) {
        callback(folderReadmeCache[dirPath]);
        return;
      }

      var readmeUrl = (folderReadmeCache[dirPath] && folderReadmeCache[dirPath].url) 
        ? folderReadmeCache[dirPath].url 
        : ((dirPath ? dirPath + "/" : "") + "README.md");

      var xhr = createXHR();
      if (!xhr) {
        callback(null);
        return;
      }

      xhr.open("GET", readmeUrl + "?t=" + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            folderReadmeCache[dirPath] = { url: readmeUrl, content: xhr.responseText };
            callback(folderReadmeCache[dirPath]);
          } else {
            var xhrLower = createXHR();
            var readmeLowerUrl = (dirPath ? dirPath + "/" : "") + "readme.md";
            xhrLower.open("GET", readmeLowerUrl + "?t=" + new Date().getTime(), true);
            xhrLower.onreadystatechange = function() {
              if (xhrLower.readyState === 4) {
                if (xhrLower.status === 200) {
                  folderReadmeCache[dirPath] = { url: readmeLowerUrl, content: xhrLower.responseText };
                  callback(folderReadmeCache[dirPath]);
                } else {
                  folderReadmeCache[dirPath] = null;
                  callback(null);
                }
              }
            };
            try { xhrLower.send(null); } catch(e) { 
              folderReadmeCache[dirPath] = null;
              callback(null); 
            }
          }
        }
      };
      try { xhr.send(null); } catch (e) { 
        folderReadmeCache[dirPath] = null;
        callback(null); 
      }
    }

    function handleFileDownloadRequest(fileUrl, fileName) {
      var dir = getFileDirectory(fileUrl);
      checkReadme(dir, function(readmeInfo) {
        if (readmeInfo && readmeInfo.content) {
          openReadmeModal(fileUrl, fileName, readmeInfo.content, dir);
        } else {
          triggerDirectDownload(fileUrl, fileName);
        }
      });
    }

    function openReadmeModal(fileUrl, fileName, readmeRawContent, dir) {
      var modal = document.getElementById("readmeModal");
      var title = document.getElementById("readmeModalTitle");
      var content = document.getElementById("readmeContent");
      var noticeText = document.getElementById("readmeNoticeText");
      var btn = document.getElementById("btnConfirmDownload");

      title.innerHTML = "Folder Notice - " + (dir ? dir + "/" : "") + "README.md";
      noticeText.innerHTML = "Please review the instructions below before downloading: <strong>" + escapeHtml(fileName) + "</strong>";
      content.innerHTML = renderMarkdownToHtml(readmeRawContent);

      btn.onclick = function() {
        closeReadmeModal();
        triggerDirectDownload(fileUrl, fileName);
      };

      modal.style.display = "block";
    }

    function closeReadmeModal() {
      document.getElementById("readmeModal").style.display = "none";
    }

    /* ============================================================
       SOLID VIEW RENDERER
       ============================================================ */
    function renderSolidView(list, filter) {
      var container = document.getElementById("workspaceContent");
      container.innerHTML = "";

      var groups = {};
      var count = 0;

      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var filePath = (item.file || "").replace(/\\/g, "/");

        if (isReadmeFile(filePath) || isExcludedFile(item)) continue;

        if (filter) {
          var matchStr = (item.name + " " + filePath + " " + (item.category || "")).toLowerCase();
          if (matchStr.indexOf(filter) === -1) continue;
        }

        count++;
        var parts = filePath.split("/");
        var fld = (parts.length > 1) ? parts[parts.length - 2] : "root";
        var fileName = parts[parts.length - 1];

        if (!groups[fld]) groups[fld] = [];
        groups[fld].push({ data: item, fileName: fileName, fullPath: filePath });
      }

      var keys = [];
      for (var k in groups) { if (groups.hasOwnProperty(k)) keys.push(k); }
      keys.sort();

      if (keys.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No files matching your search.</div>';
        updateStatusBar([], activeTab);
        return;
      }

      var folderSeq = 0;
      for (var idx = 0; idx < keys.length; idx++) {
        var fldName = keys[idx];
        var items = groups[fldName];
        folderSeq++;

        var groupDiv = document.createElement("div");
        groupDiv.className = "solid-folder-group";

        var cId = "solid-grp-" + folderSeq;
        var tId = "solid-tog-" + folderSeq;

        var header = document.createElement("a");
        header.className = "solid-folder-header";
        header.href = "javascript:void(0);";
        header.onclick = (function(boxId, togId) {
          return function() { toggleBlock(boxId, togId); };
        })(cId, tId);

        header.innerHTML =
          '<span id="' + tId + '" class="toggle-box">[-]</span> ' +
          '<span>[DIR] ' + fldName + '/ (' + items.length + ' item' + (items.length > 1 ? 's' : '') + ')</span>';

        groupDiv.appendChild(header);

        var listDiv = document.createElement("div");
        listDiv.id = cId;

        for (var j = 0; j < items.length; j++) {
          var fileObj = items[j];
          var d = fileObj.data;
          var badgeText = (activeTab === "packs") ? "PAK" : "APP";

          var row = document.createElement("div");
          row.className = "solid-file-row";

          var metaText = (d.category ? d.category : "General") + " &bull; " +
                         (d.questions ? d.questions + " Qs &bull; " : "") +
                         formatKB(d.size_kb);

          row.innerHTML =
            '<div class="file-left">' +
              '<div class="file-title-line">' +
                '<span class="type-badge">' + badgeText + '</span> ' +
                '<a class="file-name-link" href="javascript:void(0);" onclick="handleFileDownloadRequest(\'' + d.file + '\', \'' + fileObj.fileName + '\')">' + fileObj.fileName + '</a>' +
              '</div>' +
              '<div class="file-meta-line">' + metaText + '</div>' +
            '</div>' +
            '<div class="file-right">' +
              '<a class="win-btn btn-download" href="javascript:void(0);" onclick="handleFileDownloadRequest(\'' + d.file + '\', \'' + fileObj.fileName + '\')">Download</a>' +
            '</div>';

          listDiv.appendChild(row);
        }

        groupDiv.appendChild(listDiv);
        container.appendChild(groupDiv);
      }

      updateStatusBar(list, activeTab);
    }

    /* ============================================================
       TREE VIEW RENDERER
       ============================================================ */
    function buildTreeStructure(list, filter) {
      var root = { name: (activeTab === "packs" ? "data/" : "root/"), type: "dir", children: {} };

      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var filePath = (item.file || "").replace(/\\/g, "/");

        if (isReadmeFile(filePath) || isExcludedFile(item)) continue;

        if (filter) {
          var matchStr = (item.name + " " + filePath + " " + (item.category || "")).toLowerCase();
          if (matchStr.indexOf(filter) === -1) continue;
        }

        var cleanPath = filePath;
        if (activeTab === "packs" && cleanPath.indexOf("data/") === 0) {
          cleanPath = cleanPath.substring(5);
        }

        var parts = cleanPath.split("/");
        var current = root;

        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;

          if (p === parts.length - 1) {
            current.children[part] = { name: part, type: "file", data: item, fullPath: filePath };
          } else {
            if (!current.children[part]) {
              current.children[part] = { name: part, type: "dir", children: {} };
            }
            current = current.children[part];
          }
        }
      }
      return root;
    }

    var treeNodeCounter = 0;

    function renderTreeNodes(node, container) {
      var keys = [];
      for (var k in node.children) {
        if (node.children.hasOwnProperty(k)) keys.push(k);
      }
      keys.sort();

      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var item = node.children[key];

        if (item.type === "dir") {
          treeNodeCounter++;
          var subUlId = "tree-ul-" + treeNodeCounter;
          var togId = "tree-tog-" + treeNodeCounter;

          var liDir = document.createElement("li");

          var rowDir = document.createElement("div");
          rowDir.className = "tree-node-row";
          rowDir.innerHTML =
            '<span class="tree-guide">|--</span> ' +
            '<a href="javascript:void(0);" id="' + togId + '" class="toggle-box" onclick="toggleBlock(\'' + subUlId + '\', \'' + togId + '\')">[-]</a> ' +
            '<span style="font-weight:bold; color:#806000; margin-right:4px;">[DIR]</span> ' +
            '<a href="javascript:void(0);" class="tree-dir-name" onclick="toggleBlock(\'' + subUlId + '\', \'' + togId + '\')">' + item.name + '/</a>';

          liDir.appendChild(rowDir);

          var childUl = document.createElement("ul");
          childUl.className = "tree-branch";
          childUl.id = subUlId;

          renderTreeNodes(item, childUl);

          liDir.appendChild(childUl);
          container.appendChild(liDir);

        } else if (item.type === "file") {
          var d = item.data;
          var badgeText = (activeTab === "packs") ? "PAK" : "APP";

          var liFile = document.createElement("li");

          var rowFile = document.createElement("div");
          rowFile.className = "solid-file-row";
          rowFile.style.border = "none";
          rowFile.style.paddingLeft = "4px";

          var metaText = (d.category ? d.category : "General") + " &bull; " +
                         (d.questions ? d.questions + " Qs &bull; " : "") +
                         formatKB(d.size_kb);

          rowFile.innerHTML =
            '<div class="file-left">' +
              '<div class="file-title-line">' +
                '<span class="tree-guide">|--</span> ' +
                '<span class="type-badge">' + badgeText + '</span> ' +
                '<a class="file-name-link" href="javascript:void(0);" onclick="handleFileDownloadRequest(\'' + d.file + '\', \'' + item.name + '\')">' + item.name + '</a>' +
              '</div>' +
              '<div class="file-meta-line" style="padding-left: 18px;">' + metaText + '</div>' +
            '</div>' +
            '<div class="file-right">' +
              '<a class="win-btn btn-download" href="javascript:void(0);" onclick="handleFileDownloadRequest(\'' + d.file + '\', \'' + item.name + '\')">Download</a>' +
            '</div>';

          liFile.appendChild(rowFile);
          container.appendChild(liFile);
        }
      }
    }

    function renderTreeView(list, filter) {
      var container = document.getElementById("workspaceContent");
      container.innerHTML = "";

      var rootTree = buildTreeStructure(list, filter);

      var rootUl = document.createElement("ul");
      rootUl.className = "tree-branch root-level";

      treeNodeCounter = 0;
      var rootTogId = "tree-root-tog";
      var rootSubId = "tree-root-sub";

      var rootHeader = document.createElement("div");
      rootHeader.className = "tree-node-row";
      rootHeader.innerHTML =
        '<a href="javascript:void(0);" id="' + rootTogId + '" class="toggle-box" onclick="toggleBlock(\'' + rootSubId + '\', \'' + rootTogId + '\')">[-]</a> ' +
        '<span style="font-weight:bold; color:#806000; margin-right:4px;">[DIR]</span> ' +
        '<a href="javascript:void(0);" class="tree-dir-name" onclick="toggleBlock(\'' + rootSubId + '\', \'' + rootTogId + '\')">' + rootTree.name + '</a>';

      rootUl.appendChild(rootHeader);

      var subUl = document.createElement("ul");
      subUl.className = "tree-branch";
      subUl.id = rootSubId;

      renderTreeNodes(rootTree, subUl);

      if (subUl.children.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No files matching your search.</div>';
        updateStatusBar([], activeTab);
        return;
      }

      rootUl.appendChild(subUl);
      container.appendChild(rootUl);

      updateStatusBar(list, activeTab);
    }

    function toggleBlock(contentId, toggleId) {
      var el = document.getElementById(contentId);
      var tog = document.getElementById(toggleId);
      if (!el) return;

      var isHidden = (el.className.indexOf("tree-collapsed") !== -1);
      if (isHidden) {
        el.className = el.className.replace(/\btree-collapsed\b/g, "").replace(/^\s+|\s+$/g, "");
        if (tog) tog.innerHTML = "[-]";
      } else {
        el.className += " tree-collapsed";
        if (tog) tog.innerHTML = "[+]";
      }
    }

    function applyFilter(text) {
      renderCurrentView();
    }

    function clearFilter() {
      document.getElementById("filterInput").value = "";
      renderCurrentView();
    }

    function updateStatusBar(list, tabType) {
      var totalKb = 0;
      var totalQs = 0;
      var validCount = 0;

      for (var i = 0; i < list.length; i++) {
        if (isReadmeFile(list[i].file) || isExcludedFile(list[i])) continue;
        validCount++;
        totalKb += (list[i].size_kb || 0);
        if (list[i].questions) totalQs += list[i].questions;
      }

      document.getElementById("sb-status").innerHTML = "Ready.";
      document.getElementById("sb-objects").innerHTML = validCount + " File(s)";
      document.getElementById("sb-extra").innerHTML = (tabType === "packs") ? (totalQs + " Questions") : (validCount + " Platforms");
      document.getElementById("sb-size").innerHTML = (totalKb / 1024).toFixed(2) + " MB";
    }

    window.onload = function() {
      switchTab("packs");
    };
  </script>
</body>
