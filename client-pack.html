<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily GK - Package Explorer</title>
  <style type="text/css">
    /* ============================================================
       NOSTALGIA UI (WIN 98/2000 SYSTEM THEME)
       SUPPORTS: TREE VIEW & SOLID VIEW | STRICTLY NO EMOJIS
       COMPATIBLE WITH OLD (IE6+, OPERA MINI) AND MODERN BROWSERS
       ============================================================ */
    * {
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #008080; /* Classic Teal */
      font-family: "Tahoma", "MS Sans Serif", "Verdana", "Arial", sans-serif;
      font-size: 11px;
      color: #000000;
      padding: 6px;
    }

    /* MAIN CONTAINER WINDOW */
    .win-window {
      background-color: #d4d0c8;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: 2px 2px 0px #000000;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    /* TITLEBAR */
    .win-titlebar {
      height: 22px;
      background: #000080;
      background: -webkit-linear-gradient(left, #000080, #1084d0);
      background: -moz-linear-gradient(left, #000080, #1084d0);
      background: linear-gradient(to right, #000080, #1084d0);
      padding: 2px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;

      font-weight: bold;
    }

    .win-titlebar-text {
      padding-left: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
    }

    .win-titlebar-controls {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .win-btn-sys {
      width: 16px;
      height: 14px;
      line-height: 10px;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: bold;
      background-color: #d4d0c8;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      color: #000000;
      cursor: pointer;
      text-align: center;
    }

    .win-btn-sys:active {
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    /* TABS */
    .win-tab-strip {
      display: flex;
      background: #d4d0c8;
      padding: 5px 6px 0 6px;
      border-bottom: 1px solid #808080;
      gap: 3px;
    }

    .win-tab-btn {
      background-color: #d4d0c8;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: none;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 11px;
      color: #000000;
      cursor: pointer;
      margin-bottom: -1px;
      white-space: nowrap;
    }

    .win-tab-btn.active {
      background-color: #ffffff;
      border-bottom: 1px solid #ffffff;
      font-weight: bold;
    }

    /* TOOLBAR WITH VIEW TOGGLES */
    .win-toolbar {
      background: #d4d0c8;
      padding: 4px 6px;
      border-bottom: 1px solid #808080;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 180px;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .win-input {
      width: 100%;
      background-color: #ffffff;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 3px 5px;
      font-family: inherit;
      font-size: 11px;
      color: #000000;
      outline: none;
    }

    .win-btn {
      background-color: #d4d0c8;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      color: #000000;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      display: inline-block;
      text-align: center;
    }

    .win-btn:active {
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    .win-btn.pressed {
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      background-color: #e2dfd8;
      font-weight: bold;
    }

    /* WORKSPACE */
    .win-workspace {
      background: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      margin: 4px;
      min-height: 280px;
      max-height: 580px;
      overflow-y: auto;
      overflow-x: auto;
    }

    /* ============================================================
       1. SOLID VIEW STYLES (CLEAN GROUPED CARDS)
       ============================================================ */
    .solid-folder-group {
      border-bottom: 1px solid #e0e0e0;
    }

    .solid-folder-header {
      background: #f0f0ea;
      border-bottom: 1px solid #d4d0c8;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #222222;
      cursor: pointer;
    }

    .solid-folder-header:hover {
      background: #e6e6dc;
    }

    
.toggle-box {
  width: 16px;
  height: 14px;
  line-height: 1;
  text-align: center;
  font-family: "Courier New", monospace;
  font-size: 8px;
  font-weight: bold;
  border: 1px solid #808080;
  background: #ffffff;
  color: #000000;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-sizing: border-box;
}
    
    .solid-file-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px 6px 24px;
      border-bottom: 1px solid #f2f2f2;
      gap: 8px;
    }

    .solid-file-row:hover {
      background-color: #f7f9fa;
    }

    .file-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .file-title-line {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .type-badge {
      font-size: 9px;
      font-weight: bold;
      padding: 0 4px;
      border: 1px solid #a0a0a0;
      background: #e6e6e6;
      color: #000080;
      flex-shrink: 0;
    }

    .file-name-link {
      color: #000080;
      font-weight: bold;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name-link:hover {
      text-decoration: underline;
    }

    .file-meta-line {
      color: #555555;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-right {
      flex-shrink: 0;
    }

    .btn-download {
      font-weight: bold;
      color: #000000;
      padding: 3px 10px;
    }

    /* ============================================================
       2. TREE VIEW STYLES (CLASSIC EXPLORER HIERARCHY - CLEANED)
       ============================================================ */
    .tree-branch {
      list-style-type: none;
      margin: 0;
      padding-left: 16px;
    }

    .tree-branch.root-level {
      padding-left: 4px;
    }

    .tree-node-row {
      display: flex;
      align-items: center;
      padding: 3px 0;
      line-height: 18px;
      white-space: nowrap;
    }

    .tree-node-row:hover {
      background-color: #f0f4f8;
    }

    .tree-guide {
      font-family: "Courier New", monospace;
      color: #888888;
      margin-right: 4px;
    }

    .tree-dir-name {
      font-weight: bold;
      color: #000000;
      cursor: pointer;
    }

    .tree-dir-name:hover {
      text-decoration: underline;
    }

    .tree-file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 8px;
      padding-right: 6px;
    }

    .tree-collapsed {
      display: none;
    }

    /* STATUS BAR */
    .win-statusbar {
      background-color: #d4d0c8;
      border-top: 1px solid #808080;
      padding: 2px 4px;
      display: flex;
      gap: 4px;
    }

    .win-status-pane {
      background: #d4d0c8;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 2px 6px;
      font-size: 10px;
      white-space: nowrap;
    }

    .pane-flex {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 480px) {
      body { padding: 0; }
      .win-window { border: none; box-shadow: none; }
      .solid-file-row { padding-left: 14px; }
      .win-statusbar { flex-wrap: wrap; }
      .win-toolbar { flex-direction: column; align-items: stretch; }
      .toolbar-left, .toolbar-right { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <!-- RETRO WINDOW ROOT -->
  <div class="win-window">
    
    <!-- 1. TITLEBAR -->
    <div class="win-titlebar">
      <div class="win-titlebar-text" id="winTitleText">Daily GK - Package Explorer</div>
      <div class="win-titlebar-controls">
        <button class="win-btn-sys" onclick="alert('Daily GK Universal Package Explorer')">?</button>
        <button class="win-btn-sys" onclick="window.location.reload()">_</button>
        <button class="win-btn-sys" onclick="window.location.href='index.html'">X</button>
      </div>
    </div>

    <!-- 2. TABS -->
    <div class="win-tab-strip">
      <button class="win-tab-btn active" id="tabBtnPacks" onclick="switchTab('packs')">
        Question Packs (.pak)
      </button>
      <button class="win-tab-btn" id="tabBtnClients" onclick="switchTab('clients')">
        Client Apps (.apk, .bat, .jar)
      </button>
    </div>

    <!-- 3. TOOLBAR WITH VIEW TOGGLES -->
    <div class="win-toolbar">
      <div class="toolbar-left">
        <span style="font-weight:bold; color:#333;">Find:</span>
        <input type="text" id="filterInput" class="win-input" onkeyup="applyFilter(this.value)" placeholder="Search packages..." />
        <button class="win-btn" onclick="clearFilter()">Clear</button>
      </div>
      <div class="toolbar-right">
        <span style="color:#555;">View:</span>
        <button class="win-btn" id="btnViewTree" onclick="switchView('tree')">[Tree View]</button>
        <button class="win-btn pressed" id="btnViewSolid" onclick="switchView('solid')">[Solid View]</button>
        <a class="win-btn" href="index.html">[App]</a>
      </div>
    </div>

    <!-- 4. WORKSPACE CONTAINER -->
    <div class="win-workspace" id="workspaceContainer">
      <div id="loadingStatus" style="padding: 16px; color: #666666; text-align: center;">
        Loading data...
      </div>
      <div id="workspaceContent"></div>
    </div>

    <!-- 5. STATUS BAR -->
    <div class="win-statusbar">
      <div class="win-status-pane pane-flex" id="sb-status">Ready.</div>
      <div class="win-status-pane" id="sb-objects">0 Files</div>
      <div class="win-status-pane" id="sb-extra">0 Questions</div>
      <div class="win-status-pane" id="sb-size">0.00 MB</div>
    </div>

  </div>

  <script type="text/javascript">
    var FALLBACK_PACKS = [
      { "id": "master", "name": "Master Question Bank (All Questions)", "category": "All", "file": "data/master.pak", "questions": 7052, "size_kb": 24240.48 },
      { "id": "2026", "name": "সাধারণ জ্ঞান (2026)", "category": "সাধারণ জ্ঞান", "file": "data/2026/2026.pak", "questions": 2472, "size_kb": 8452.92 },
      { "id": "2025", "name": "সাধারণ জ্ঞান (2025)", "category": "সাধারণ জ্ঞান", "file": "data/2025/2025.pak", "questions": 3421, "size_kb": 11331.31 },
      { "id": "ai", "name": "AI (Artificial Intelligence)", "category": "AI", "file": "data/ai/ai.pak", "questions": 1057, "size_kb": 4136.0 },
      { "id": "books", "name": "বই থেকে (Books Collection)", "category": "বই থেকে", "file": "data/books/books.pak", "questions": 102, "size_kb": 320.3 }
    ];

    var FALLBACK_CLIENTS = [
      { "id": "android", "name": "Android Package", "category": "Mobile", "file": "app-release.apk", "size_kb": 15420.5 },
      { "id": "windows", "name": "Windows Desktop Launcher", "category": "Desktop", "file": "Daily-GK.bat", "size_kb": 14.2 },
      { "id": "linux", "name": "Linux Shell Launcher", "category": "Desktop", "file": "Daily-GK.sh", "size_kb": 11.5 },
      { "id": "j2me", "name": "Java Feature Phone MIDlet", "category": "Feature Phone", "file": "Daily-GK.jar", "size_kb": 512.0 },
      { "id": "mre", "name": "MediaTek MRE VXP Application", "category": "Feature Phone", "file": "Daily-GK.vbm", "size_kb": 780.0 }
    ];

    var activeTab = "packs";   // 'packs' or 'clients'
    var currentView = "solid"; // 'solid' or 'tree'
    var packsData = null;
    var clientsData = null;

    function createXHR() {
      if (window.XMLHttpRequest) return new XMLHttpRequest();
      try { return new ActiveXObject("Msxml2.XMLHTTP.6.0"); } catch (e) {}
      try { return new ActiveXObject("Microsoft.XMLHTTP"); } catch (e) {}
      return null;
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.getElementById("tabBtnPacks").className = "win-tab-btn" + (tabName === "packs" ? " active" : "");
      document.getElementById("tabBtnClients").className = "win-tab-btn" + (tabName === "clients" ? " active" : "");
      document.getElementById("filterInput").value = "";

      if (tabName === "packs") {
        document.getElementById("winTitleText").innerHTML = "Daily GK - Package Explorer [packs.json]";
        if (!packsData) fetchData("packs", "./packs.json", FALLBACK_PACKS);
        else renderCurrentView();
      } else {
        document.getElementById("winTitleText").innerHTML = "Daily GK - Client Apps [clients.json]";
        if (!clientsData) fetchData("clients", "./clients.json", FALLBACK_CLIENTS);
        else renderCurrentView();
      }
    }

    function switchView(viewName) {
      currentView = viewName;
      document.getElementById("btnViewTree").className = "win-btn" + (viewName === "tree" ? " pressed" : "");
      document.getElementById("btnViewSolid").className = "win-btn" + (viewName === "solid" ? " pressed" : "");
      renderCurrentView();
    }

    function fetchData(type, url, fallback) {
      document.getElementById("loadingStatus").style.display = "block";
      var xhr = createXHR();
      if (!xhr) {
        onDataLoaded(type, fallback);
        return;
      }
      xhr.open("GET", url + "?t=" + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 0) {
            try {
              var parsed = window.JSON && window.JSON.parse ? JSON.parse(xhr.responseText) : eval("(" + xhr.responseText + ")");
              onDataLoaded(type, parsed);
            } catch (err) {
              onDataLoaded(type, fallback);
            }
          } else {
            onDataLoaded(type, fallback);
          }
        }
      };
      try { xhr.send(null); } catch (e) { onDataLoaded(type, fallback); }
    }

    function onDataLoaded(type, data) {
      if (type === "packs") packsData = data;
      else clientsData = data;
      renderCurrentView();
    }

    function formatKB(kb) {
      if (!kb) return "0 KB";
      if (kb >= 1024) return (kb / 1024).toFixed(2) + " MB";
      return Math.round(kb) + " KB";
    }

    function getActiveDataset() {
      return (activeTab === "packs") ? (packsData || FALLBACK_PACKS) : (clientsData || FALLBACK_CLIENTS);
    }

    function renderCurrentView() {
      document.getElementById("loadingStatus").style.display = "none";
      var data = getActiveDataset();
      var filterText = (document.getElementById("filterInput").value || "").toLowerCase().trim();

      if (currentView === "solid") {
        renderSolidView(data, filterText);
      } else {
        renderTreeView(data, filterText);
      }
    }

    /* ============================================================
       1. SOLID VIEW RENDERER (Clean Grouped Cards)
       ============================================================ */
    function renderSolidView(list, filter) {
      var container = document.getElementById("workspaceContent");
      container.innerHTML = "";

      // Group files
      var groups = {};
      var count = 0;

      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var filePath = (item.file || "").replace(/\\/g, "/");

        if (filter) {
          var matchStr = (item.name + " " + filePath + " " + (item.category || "")).toLowerCase();
          if (matchStr.indexOf(filter) === -1) continue;
        }

        count++;
        var parts = filePath.split("/");
        var fld = (parts.length > 1) ? parts[parts.length - 2] : "root";
        var fileName = parts[parts.length - 1];

        if (!groups[fld]) groups[fld] = [];
        groups[fld].push({ data: item, fileName: fileName, fullPath: filePath });
      }

      var keys = [];
      for (var k in groups) { if (groups.hasOwnProperty(k)) keys.push(k); }
      keys.sort();

      if (keys.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No files matching your search.</div>';
        updateStatusBar([], activeTab);
        return;
      }

      var folderSeq = 0;
      for (var idx = 0; idx < keys.length; idx++) {
        var fldName = keys[idx];
        var items = groups[fldName];
        folderSeq++;

        var groupDiv = document.createElement("div");
        groupDiv.className = "solid-folder-group";

        var cId = "solid-grp-" + folderSeq;
        var tId = "solid-tog-" + folderSeq;

        var header = document.createElement("div");
        header.className = "solid-folder-header";
        header.onclick = (function(boxId, togId) {
          return function() { toggleBlock(boxId, togId); };
        })(cId, tId);

        header.innerHTML =
          '<span id="' + tId + '" class="toggle-box">[-]</span> ' +
          '<span>[DIR] ' + fldName + '/ (' + items.length + ' item' + (items.length > 1 ? 's' : '') + ')</span>';

        groupDiv.appendChild(header);

        var listDiv = document.createElement("div");
        listDiv.id = cId;

        for (var j = 0; j < items.length; j++) {
          var fileObj = items[j];
          var d = fileObj.data;
          var badgeText = (activeTab === "packs") ? "PAK" : "APP";

          var row = document.createElement("div");
          row.className = "solid-file-row";

          var metaText = (d.category ? d.category : "General") + " &bull; " +
                         (d.questions ? d.questions.toLocaleString() + " Qs &bull; " : "") +
                         formatKB(d.size_kb);

          row.innerHTML =
            '<div class="file-left">' +
              '<div class="file-title-line">' +
                '<span class="type-badge">' + badgeText + '</span> ' +
                '<a class="file-name-link" href="' + d.file + '" download>' + fileObj.fileName + '</a>' +
              '</div>' +
              '<div class="file-meta-line">' + metaText + '</div>' +
            '</div>' +
            '<div class="file-right">' +
              '<a class="win-btn btn-download" href="' + d.file + '" download>Download</a>' +
            '</div>';

          listDiv.appendChild(row);
        }

        groupDiv.appendChild(listDiv);
        container.appendChild(groupDiv);
      }

      updateStatusBar(list, activeTab);
    }

    /* ============================================================
       2. TREE VIEW RENDERER (Classic Explorer Hierarchy - Aligned)
       ============================================================ */
    function buildTreeStructure(list, filter) {
      var root = { name: (activeTab === "packs" ? "data/" : "root/"), type: "dir", children: {} };

      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var filePath = (item.file || "").replace(/\\/g, "/");

        if (filter) {
          var matchStr = (item.name + " " + filePath + " " + (item.category || "")).toLowerCase();
          if (matchStr.indexOf(filter) === -1) continue;
        }

        // Normalize path: ignore root 'data/' in hierarchical sub-nesting
        var cleanPath = filePath;
        if (activeTab === "packs" && cleanPath.indexOf("data/") === 0) {
          cleanPath = cleanPath.substring(5);
        }

        var parts = cleanPath.split("/");
        var current = root;

        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;

          if (p === parts.length - 1) {
            current.children[part] = { name: part, type: "file", data: item, fullPath: filePath };
          } else {
            if (!current.children[part]) {
              current.children[part] = { name: part, type: "dir", children: {} };
            }
            current = current.children[part];
          }
        }
      }
      return root;
    }

    var treeNodeCounter = 0;

    function renderTreeNodes(node, container) {
      var keys = [];
      for (var k in node.children) {
        if (node.children.hasOwnProperty(k)) keys.push(k);
      }
      keys.sort();

      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var item = node.children[key];

        if (item.type === "dir") {
          treeNodeCounter++;
          var subUlId = "tree-ul-" + treeNodeCounter;
          var togId = "tree-tog-" + treeNodeCounter;

          var liDir = document.createElement("li");

          var rowDir = document.createElement("div");
          rowDir.className = "tree-node-row";
          rowDir.innerHTML =
            '<span class="tree-guide">|--</span> ' +
            '<span id="' + togId + '" class="toggle-box" onclick="toggleBlock(\'' + subUlId + '\', \'' + togId + '\')">[-]</span> ' +
            '<span style="font-weight:bold; color:#806000; margin-right:4px;">[DIR]</span> ' +
            '<span class="tree-dir-name" onclick="toggleBlock(\'' + subUlId + '\', \'' + togId + '\')">' + item.name + '/</span>';

          liDir.appendChild(rowDir);

          var childUl = document.createElement("ul");
          childUl.className = "tree-branch";
          childUl.id = subUlId;

          renderTreeNodes(item, childUl);

          liDir.appendChild(childUl);
          container.appendChild(liDir);

        } else if (item.type === "file") {
          var d = item.data;
          var badgeText = (activeTab === "packs") ? "PAK" : "APP";

          var liFile = document.createElement("li");

          var rowFile = document.createElement("div");
          rowFile.className = "solid-file-row";
          rowFile.style.border = "none";
          rowFile.style.paddingLeft = "8px";

          var metaText = (d.category ? d.category : "General") + " &bull; " +
                         (d.questions ? d.questions.toLocaleString() + " Qs &bull; " : "") +
                         formatKB(d.size_kb);

          rowFile.innerHTML =
            '<div class="file-left">' +
              '<div class="file-title-line">' +
                '<span class="tree-guide">|--</span> ' +
                '<span class="type-badge">' + badgeText + '</span> ' +
                '<a class="file-name-link" href="' + d.file + '" download>' + item.name + '</a>' +
              '</div>' +
              '<div class="file-meta-line" style="padding-left: 20px;">' + metaText + '</div>' +
            '</div>' +
            '<div class="file-right">' +
              '<a class="win-btn btn-download" href="' + d.file + '" download>Download</a>' +
            '</div>';

          liFile.appendChild(rowFile);
          container.appendChild(liFile);
        }
      }
    }

    function renderTreeView(list, filter) {
      var container = document.getElementById("workspaceContent");
      container.innerHTML = "";

      var rootTree = buildTreeStructure(list, filter);

      var rootUl = document.createElement("ul");
      rootUl.className = "tree-branch root-level";

      treeNodeCounter = 0;
      var rootTogId = "tree-root-tog";
      var rootSubId = "tree-root-sub";

      var rootHeader = document.createElement("div");
      rootHeader.className = "tree-node-row";
      rootHeader.innerHTML =
        '<span id="' + rootTogId + '" class="toggle-box" onclick="toggleBlock(\'' + rootSubId + '\', \'' + rootTogId + '\')">[-]</span> ' +
        '<span style="font-weight:bold; color:#806000; margin-right:4px;">[DIR]</span> ' +
        '<span class="tree-dir-name" onclick="toggleBlock(\'' + rootSubId + '\', \'' + rootTogId + '\')">' + rootTree.name + '</span>';

      rootUl.appendChild(rootHeader);

      var subUl = document.createElement("ul");
      subUl.className = "tree-branch";
      subUl.id = rootSubId;

      renderTreeNodes(rootTree, subUl);

      if (subUl.children.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No files matching your search.</div>';
        updateStatusBar([], activeTab);
        return;
      }

      rootUl.appendChild(subUl);
      container.appendChild(rootUl);

      updateStatusBar(list, activeTab);
    }

    function toggleBlock(contentId, toggleId) {
      var el = document.getElementById(contentId);
      var tog = document.getElementById(toggleId);
      if (!el) return;

      var isHidden = (el.className.indexOf("tree-collapsed") !== -1);
      if (isHidden) {
        el.className = el.className.replace(/\btree-collapsed\b/g, "").replace(/^\s+|\s+$/g, "");
        if (tog) tog.innerHTML = "[-]";
      } else {
        el.className += " tree-collapsed";
        if (tog) tog.innerHTML = "[+]";
      }
    }

    function applyFilter(text) {
      renderCurrentView();
    }

    function clearFilter() {
      document.getElementById("filterInput").value = "";
      renderCurrentView();
    }

    function updateStatusBar(list, tabType) {
      var totalKb = 0;
      var totalQs = 0;

      for (var i = 0; i < list.length; i++) {
        totalKb += (list[i].size_kb || 0);
        if (list[i].questions) totalQs += list[i].questions;
      }

      document.getElementById("sb-status").innerHTML = "Ready.";
      document.getElementById("sb-objects").innerHTML = list.length + " File(s)";
      document.getElementById("sb-extra").innerHTML = (tabType === "packs") ? (totalQs.toLocaleString() + " Questions") : (list.length + " Platforms");
      document.getElementById("sb-size").innerHTML = (totalKb / 1024).toFixed(2) + " MB";
    }

    window.onload = function() {
      switchTab("packs");
    };
  </script>
</body>
</html>
