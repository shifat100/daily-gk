<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0" />
  <title>Daily GK - File & Package Explorer</title>
  <style type="text/css">
    /* ============================================================
       NOSTALGIA UI (CLASSIC WIN 98/2000 THEME)
       ADAPTED FOR BOTH 4K DESKTOP AND 240px TINY FEATURE PHONES
       ============================================================ */
    * {
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 4px;
      background-color: #008080; /* Classic Teal Desktop */
      font-family: "Tahoma", "MS Sans Serif", "Verdana", "Arial", sans-serif;
      font-size: 11px;
      color: #000000;
    }

    /* MAIN WINDOW FRAME */
    .win-window {
      background-color: #d4d0c8;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: 2px 2px 0px #000000;
      max-width: 920px;
      margin: 0 auto;
      width: 100%;
    }

    /* TITLEBAR */
    .win-titlebar {
      height: 22px;
      background: #000080;
      background: -webkit-linear-gradient(left, #000080, #1084d0);
      background: -moz-linear-gradient(left, #000080, #1084d0);
      background: linear-gradient(to right, #000080, #1084d0);
      padding: 2px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      font-weight: bold;
    }

    .win-titlebar-text {
      padding-left: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
    }

    .win-titlebar-controls {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .win-btn-sys {
      width: 16px;
      height: 14px;
      line-height: 10px;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: bold;
      padding: 0;
      text-align: center;
      background-color: #d4d0c8;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      color: #000000;
      cursor: pointer;
    }

    .win-btn-sys:active {
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    /* MENUBAR */
    .win-menubar {
      display: flex;
      flex-wrap: wrap;
      background: #d4d0c8;
      border-bottom: 1px solid #808080;
      padding: 2px 4px;
      gap: 8px;
    }

    .win-menu-item {
      cursor: pointer;
      padding: 1px 4px;
      white-space: nowrap;
    }

    .win-menu-item:hover {
      background-color: #000080;
      color: #ffffff;
    }

    /* ADDRESS & TOOLBAR */
    .win-toolbar {
      background: #d4d0c8;
      padding: 4px 6px;
      border-bottom: 1px solid #808080;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .win-input {
      background-color: #ffffff;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 3px 5px;
      font-family: inherit;
      font-size: 11px;
      color: #000000;
      outline: none;
      min-width: 80px;
    }

    .win-btn {
      background-color: #d4d0c8;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      color: #000000;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      vertical-align: middle;
      white-space: nowrap;
    }

    .win-btn:active {
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    /* WINDOWS 98 TAB CONTROL */
    .win-tab-strip {
      display: flex;
      background: #d4d0c8;
      padding: 4px 6px 0 6px;
      border-bottom: 1px solid #808080;
      gap: 3px;
      overflow-x: auto;
    }

    .win-tab-btn {
      background-color: #d4d0c8;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: none;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 11px;
      color: #000000;
      cursor: pointer;
      white-space: nowrap;
      margin-bottom: -1px;
    }

    .win-tab-btn.active {
      background-color: #ffffff;
      border-bottom: 1px solid #ffffff;
      font-weight: bold;
    }

    /* WORKSPACE */
    .win-workspace {
      background: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      margin: 4px;
      padding: 6px;
      min-height: 260px;
      max-height: 520px;
      overflow-y: auto;
      overflow-x: auto;
    }

    /* TREE VIEW */
    .tree-node {
      list-style-type: none;
      margin: 0;
      padding: 0 0 0 14px;
    }

    .tree-root {
      padding-left: 2px;
    }

    .tree-row {
      display: flex;
      align-items: flex-start;
      padding: 2px 0;
      line-height: 18px;
      flex-wrap: wrap; /* Wraps gracefully on 240px screens */
    }

    .tree-toggle {
      display: inline-block;
      width: 14px;
      height: 14px;
      line-height: 10px;
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid #808080;
      background: #ffffff;
      color: #000000;
      margin-right: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tree-icon-dir {
      font-weight: bold;
      color: #806000;
      margin-right: 5px;
      flex-shrink: 0;
    }

    .tree-icon-file {
      font-weight: bold;
      color: #000080;
      margin-right: 5px;
      flex-shrink: 0;
    }

    .tree-dir-name {
      font-weight: bold;
      color: #000000;
      cursor: pointer;
    }

    .tree-file-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .tree-file-link {
      color: #000080;
      text-decoration: underline;
      font-weight: bold;
      word-break: break-all;
    }

    .tree-file-info {
      color: #555555;
      font-size: 10px;
      word-break: break-word;
    }

    .badge-tag {
      background: #e0e0e0;
      border: 1px solid #999999;
      padding: 0 4px;
      font-size: 10px;
      color: #333333;
      white-space: nowrap;
    }

    .tree-hidden {
      display: none;
    }

    /* STATUS BAR */
    .win-statusbar {
      background-color: #d4d0c8;
      border-top: 1px solid #808080;
      padding: 2px 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .win-status-pane {
      background: #d4d0c8;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 2px 4px;
      font-size: 10px;
      white-space: nowrap;
    }

    .pane-flex {
      flex: 1;
      min-width: 110px;
    }

    /* TINY SCREEN ADAPTATIONS (< 360px & QVGA 240px) */
    @media (max-width: 360px) {
      body { padding: 0; }
      .win-window { border: none; box-shadow: none; }
      .win-toolbar { flex-direction: column; align-items: stretch; }
      .win-toolbar input { width: 100% !important; margin-bottom: 2px; }
      .tree-node { padding-left: 8px; }
      .win-statusbar { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- RETRO WINDOW -->
  <div class="win-window">
    
    <!-- 1. TITLEBAR -->
    <div class="win-titlebar">
      <div class="win-titlebar-text" id="winTitleText">Daily GK - Package Explorer [./packs.json]</div>
      <div class="win-titlebar-controls">
        <button class="win-btn-sys" onclick="alert('Daily GK Universal Package & Client Manager')">?</button>
        <button class="win-btn-sys" onclick="window.location.reload()">_</button>
        <button class="win-btn-sys" onclick="window.location.href='index.html'">X</button>
      </div>
    </div>

    <!-- 2. MENUBAR -->
    <div class="win-menubar">
      <span class="win-menu-item" onclick="expandCurrentTab(true)">[Expand All]</span>
      <span class="win-menu-item" onclick="expandCurrentTab(false)">[Collapse All]</span>
      <span class="win-menu-item" onclick="refreshCurrentTab()">[Refresh]</span>
      <span class="win-menu-item" onclick="window.location.href='index.html'">[Open App]</span>
    </div>

    <!-- 3. TABS (PACKAGES & CLIENT APPS) -->
    <div class="win-tab-strip">
      <button class="win-tab-btn active" id="tabBtnPacks" onclick="switchActiveTab('packs')">
        Question Packs (packs.json)
      </button>
      <button class="win-tab-btn" id="tabBtnClients" onclick="switchActiveTab('clients')">
        Client Apps (clients.json)
      </button>
    </div>

    <!-- 4. TOOLBAR / SEARCH FILTER -->
    <div class="win-toolbar">
      <span style="color:#404040;">Address:</span>
      <input type="text" id="addressInput" class="win-input" style="width: 140px;" value="./packs.json" readonly="readonly" />

      <span style="color:#404040; margin-left: 4px;">Search:</span>
      <input type="text" id="filterInput" class="win-input" style="width: 120px;" onkeyup="applyFilter(this.value)" placeholder="Filter..." />

      <button class="win-btn" onclick="applyFilter(document.getElementById('filterInput').value)">Find</button>
      <button class="win-btn" onclick="document.getElementById('filterInput').value=''; applyFilter('');">Clear</button>
    </div>

    <!-- 5. WORKSPACE TREE VIEWER -->
    <div class="win-workspace" id="treeViewport">
      <div id="treeLoadingStatus" style="padding: 10px; color: #666666;">
        Querying directory data...
      </div>
      <ul id="packageTreeRoot" class="tree-node tree-root"></ul>
    </div>

    <!-- 6. STATUS BAR -->
    <div class="win-statusbar">
      <div class="win-status-pane pane-flex" id="sb-status">Ready.</div>
      <div class="win-status-pane" id="sb-objects">0 Object(s)</div>
      <div class="win-status-pane" id="sb-extra">0 Questions</div>
      <div class="win-status-pane" id="sb-size">0.00 MB</div>
    </div>

  </div>

  <!-- COMPATIBLE ES3/ES5 JAVASCRIPT ENGINE -->
  <script type="text/javascript">
    // Fallback data for Question Packs (packs.json)
    var FALLBACK_PACKS = [
      {
        "id": "master",
        "name": "Master Question Bank (All Questions)",
        "category": "All",
        "file": "data/master.pak",
        "questions": 7052,
        "size_kb": 24240.48,
        "updated_at": "2026-10-21"
      },
      {
        "id": "2026",
        "name": "সাধারণ জ্ঞান",
        "category": "সাধারণ জ্ঞান",
        "file": "data/2026/2026.pak",
        "questions": 2472,
        "size_kb": 8452.92,
        "updated_at": "2026-10-21"
      },
      {
        "id": "2025",
        "name": "সাধারণ জ্ঞান",
        "category": "সাধারণ জ্ঞান",
        "file": "data/2025/2025.pak",
        "questions": 3421,
        "size_kb": 11331.31,
        "updated_at": "2026-10-21"
      },
      {
        "id": "ai",
        "name": "AI",
        "category": "AI",
        "file": "data/ai/ai.pak",
        "questions": 1057,
        "size_kb": 4136.0,
        "updated_at": "2026-10-21"
      },
      {
        "id": "books",
        "name": "বই থেকে",
        "category": "বই থেকে",
        "file": "data/books/books.pak",
        "questions": 102,
        "size_kb": 320.3,
        "updated_at": "2026-10-21"
      }
    ];

    // Fallback data for Client Applications (clients.json)
    var FALLBACK_CLIENTS = [
      {
        "id": "android",
        "name": "Android Application APK",
        "category": "Mobile",
        "file": "app-release.apk",
        "size_kb": 15420.5,
        "updated_at": "2026-10-21"
      },
      {
        "id": "windows",
        "name": "Windows Desktop Launcher (.bat)",
        "category": "Desktop",
        "file": "Daily-GK.bat",
        "size_kb": 14.2,
        "updated_at": "2026-10-21"
      },
      {
        "id": "linux",
        "name": "Linux Shell Launcher (.sh)",
        "category": "Desktop",
        "file": "Daily-GK.sh",
        "size_kb": 11.5,
        "updated_at": "2026-10-21"
      },
      {
        "id": "j2me",
        "name": "Java Phone J2ME MIDlet (.jar)",
        "category": "Feature Phone",
        "file": "Daily-GK.jar",
        "size_kb": 512.0,
        "updated_at": "2026-10-21"
      },
      {
        "id": "mre",
        "name": "MediaTek MRE VXP Application (.vbm)",
        "category": "Feature Phone",
        "file": "Daily-GK.vbm",
        "size_kb": 780.0,
        "updated_at": "2026-10-21"
      }
    ];

    var currentTab = "packs"; // 'packs' or 'clients'
    var packsList = null;
    var clientsList = null;
    var activeTree = null;
    var nodeSeq = 0;

    // Cross-browser AJAX for IE6+ and modern browsers
    function createXHR() {
      if (window.XMLHttpRequest) return new XMLHttpRequest();
      try { return new ActiveXObject("Msxml2.XMLHTTP.6.0"); } catch (e1) {}
      try { return new ActiveXObject("Msxml2.XMLHTTP.3.0"); } catch (e2) {}
      try { return new ActiveXObject("Microsoft.XMLHTTP"); } catch (e3) {}
      return null;
    }

    function switchActiveTab(tabName) {
      currentTab = tabName;
      document.getElementById("tabBtnPacks").className = "win-tab-btn" + (tabName === "packs" ? " active" : "");
      document.getElementById("tabBtnClients").className = "win-tab-btn" + (tabName === "clients" ? " active" : "");

      var addrInput = document.getElementById("addressInput");
      var titleText = document.getElementById("winTitleText");

      if (tabName === "packs") {
        addrInput.value = "./packs.json";
        titleText.innerHTML = "Daily GK - Package Explorer [./packs.json]";
        if (!packsList) fetchDataset("packs", "./packs.json", FALLBACK_PACKS);
        else renderCurrentDataset(packsList, "packs");
      } else {
        addrInput.value = "./clients.json";
        titleText.innerHTML = "Daily GK - Client App Explorer [./clients.json]";
        if (!clientsList) fetchDataset("clients", "./clients.json", FALLBACK_CLIENTS);
        else renderCurrentDataset(clientsList, "clients");
      }
    }

    function fetchDataset(type, url, fallback) {
      var statusEl = document.getElementById("treeLoadingStatus");
      statusEl.style.display = "block";
      statusEl.innerHTML = "Reading " + url + " ...";

      var xhr = createXHR();
      if (!xhr) {
        assignFallback(type, fallback);
        return;
      }

      xhr.open("GET", url + "?t=" + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 0) {
            try {
              var parsed = window.JSON && window.JSON.parse ? JSON.parse(xhr.responseText) : eval("(" + xhr.responseText + ")");
              if (type === "packs") packsList = parsed;
              else clientsList = parsed;
              renderCurrentDataset(parsed, type);
            } catch (err) {
              assignFallback(type, fallback);
            }
          } else {
            assignFallback(type, fallback);
          }
        }
      };

      try { xhr.send(null); } catch (e) { assignFallback(type, fallback); }
    }

    function assignFallback(type, fallback) {
      if (type === "packs") packsList = fallback;
      else clientsList = fallback;
      renderCurrentDataset(fallback, type);
      document.getElementById("sb-status").innerHTML = "Loaded from embedded repository cache.";
    }

    // Convert file paths into expandable directory tree
    function buildHierarchy(list, type) {
      var root = { name: "root", type: "dir", children: {}, path: "" };

      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var cleanPath = (item.file || "").replace(/\\/g, "/");
        var parts = cleanPath.split("/");
        var current = root;

        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;

          if (p === parts.length - 1) {
            current.children[part] = {
              name: part,
              type: "file",
              fileType: type,
              data: item,
              fullPath: cleanPath
            };
          } else {
            if (!current.children[part]) {
              current.children[part] = {
                name: part,
                type: "dir",
                children: {},
                path: parts.slice(0, p + 1).join("/")
              };
            }
            current = current.children[part];
          }
        }
      }
      return root;
    }

    function formatKB(kb) {
      if (!kb) return "0 KB";
      if (kb >= 1024) return (kb / 1024).toFixed(2) + " MB";
      return kb.toFixed(1) + " KB";
    }

    function renderCurrentDataset(list, type) {
      document.getElementById("treeLoadingStatus").style.display = "none";
      activeTree = buildHierarchy(list, type);
      renderTreeRoot(activeTree, "");
      updateStatusBar(list, type);
    }

    function renderTreeBranch(node, container, filterText) {
      var keys = [];
      for (var k in node.children) {
        if (node.children.hasOwnProperty(k)) keys.push(k);
      }
      keys.sort();

      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var item = node.children[key];

        if (item.type === "dir") {
          nodeSeq++;
          var subUlId = "sub-ul-" + nodeSeq;
          var btnId = "btn-tog-" + nodeSeq;

          var liDir = document.createElement("li");
          var rowDir = document.createElement("div");
          rowDir.className = "tree-row";

          rowDir.innerHTML =
            '<span id="' + btnId + '" class="tree-toggle" onclick="toggleDir(\'' + subUlId + '\', \'' + btnId + '\')">[-]</span>' +
            '<span class="tree-icon-dir">[DIR]</span>' +
            '<span class="tree-dir-name" onclick="toggleDir(\'' + subUlId + '\', \'' + btnId + '\')">' + item.name + '/</span>';

          liDir.appendChild(rowDir);

          var childUl = document.createElement("ul");
          childUl.className = "tree-node";
          childUl.id = subUlId;

          renderTreeBranch(item, childUl, filterText);

          liDir.appendChild(childUl);
          container.appendChild(liDir);

        } else if (item.type === "file") {
          var d = item.data;
          var displayName = d.name || item.name;

          if (filterText) {
            var searchStr = (item.name + " " + displayName + " " + (d.category || "")).toLowerCase();
            if (searchStr.indexOf(filterText.toLowerCase()) === -1) continue;
          }

          var liFile = document.createElement("li");
          var rowFile = document.createElement("div");
          rowFile.className = "tree-row";

          var iconType = (item.fileType === "packs") ? "[PAK]" : "[APP]";
          var extraInfo = d.questions ? (d.questions + " Qs | ") : "";

          rowFile.innerHTML =
            '<span style="display:inline-block; width:19px; flex-shrink:0;"></span>' +
            '<span class="tree-icon-file">' + iconType + '</span>' +
            '<div class="tree-file-wrap">' +
              '<a class="tree-file-link" href="' + d.file + '" download>' + item.name + '</a> ' +
              '<span class="tree-file-info">(' + displayName + ' | ' + extraInfo + formatKB(d.size_kb) + ')</span> ' +
              '<span class="badge-tag">' + (d.category || "General") + '</span> ' +
              '<a class="win-btn" href="' + d.file + '" download style="padding:1px 6px;">[Download]</a>' +
            '</div>';

          liFile.appendChild(rowFile);
          container.appendChild(liFile);
        }
      }
    }

    function renderTreeRoot(rootNode, filterText) {
      var rootUl = document.getElementById("packageTreeRoot");
      rootUl.innerHTML = "";

      nodeSeq = 0;
      var topRow = document.createElement("div");
      topRow.className = "tree-row";
      var rootLabel = (currentTab === "packs") ? "repository_root/data/" : "repository_root/";

      topRow.innerHTML =
        '<span id="btn-root-tog" class="tree-toggle" onclick="toggleDir(\'root-children\', \'btn-root-tog\')">[-]</span>' +
        '<span class="tree-icon-dir">[DIR]</span>' +
        '<span class="tree-dir-name" onclick="toggleDir(\'root-children\', \'btn-root-tog\')">' + rootLabel + '</span>';

      rootUl.appendChild(topRow);

      var rootChildren = document.createElement("ul");
      rootChildren.className = "tree-node";
      rootChildren.id = "root-children";

      renderTreeBranch(rootNode, rootChildren, filterText);
      rootUl.appendChild(rootChildren);
    }

    function toggleDir(targetId, btnId) {
      var el = document.getElementById(targetId);
      var btn = document.getElementById(btnId);
      if (!el) return;

      if (el.className.indexOf("tree-hidden") === -1) {
        el.className += " tree-hidden";
        if (btn) btn.innerHTML = "[+]";
      } else {
        el.className = el.className.replace(/\btree-hidden\b/g, "").replace(/^\s+|\s+$/g, "");
        if (btn) btn.innerHTML = "[-]";
      }
    }

    function expandCurrentTab(expand) {
      var uls = document.getElementById("packageTreeRoot").getElementsByTagName("ul");
      for (var i = 0; i < uls.length; i++) {
        if (expand) {
          uls[i].className = uls[i].className.replace(/\btree-hidden\b/g, "").replace(/^\s+|\s+$/g, "");
        } else {
          if (uls[i].className.indexOf("tree-hidden") === -1) uls[i].className += " tree-hidden";
        }
      }

      var btns = document.getElementById("packageTreeRoot").getElementsByTagName("span");
      for (var b = 0; b < btns.length; b++) {
        if (btns[b].className === "tree-toggle") {
          btns[b].innerHTML = expand ? "[-]" : "[+]";
        }
      }
    }

    function refreshCurrentTab() {
      if (currentTab === "packs") fetchDataset("packs", "./packs.json", FALLBACK_PACKS);
      else fetchDataset("clients", "./clients.json", FALLBACK_CLIENTS);
    }

    function applyFilter(text) {
      if (activeTree) renderTreeRoot(activeTree, text);
    }

    function updateStatusBar(list, type) {
      var totalKb = 0;
      var totalQs = 0;

      for (var i = 0; i < list.length; i++) {
        totalKb += (list[i].size_kb || 0);
        if (list[i].questions) totalQs += list[i].questions;
      }

      document.getElementById("sb-status").innerHTML = "Ready.";
      document.getElementById("sb-objects").innerHTML = list.length + " Object(s)";
      document.getElementById("sb-extra").innerHTML = (type === "packs") ? (totalQs + " Questions") : (list.length + " Platforms");
      document.getElementById("sb-size").innerHTML = (totalKb / 1024).toFixed(2) + " MB";
    }

    window.onload = function() {
      // Start with Question Packs tab
      switchActiveTab("packs");
    };
  </script>
</body>
</html>
