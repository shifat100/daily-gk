    var FALLBACK_CLIENTS = [
      { "id": "clients-readme", "name": "Clients Manual", "category": "Desktop", "file": "README.md", "size_kb": 1.5 },
      { "id": "android", "name": "Android Package", "category": "Mobile", "file": "app-release.apk", "size_kb": 15420.5 },
      { "id": "windows", "name": "Windows Desktop Launcher", "category": "Desktop", "file": "Daily-GK.bat", "size_kb": 14.2 },
      { "id": "linux", "name": "Linux Shell Launcher", "category": "Desktop", "file": "Daily-GK.sh", "size_kb": 11.5 },

      { "id": "mre", "name": "MediaTek MRE VXP Application", "category": "Feature Phone", "file": "Daily-GK.vbm", "size_kb": 780.0 }
    ];

    /* In-memory mock text if running under file:// or offline */
    var FALLBACK_MARKDOWN_CACHE = {
      "data/2026/readme.md": "# সাধারণ জ্ঞান (2026) - Readme\n\nঅনুগ্রহ করে ডাউনলোডের পূর্বে গুরুত্বপূর্ণ নির্দেশনাবলী পড়ুন:\n\n* **প্যাকেজ সংস্করণ**: 2026.1v\n* **প্রশ্ন সংখ্যা**: ২,৪৭২ টি\n* **ব্যবহারবিধি**: প্যাকেজটি ডাউনলোড শেষে Daily-GK অ্যাপের `Data Import` মেন্যুতে গিয়ে ফাইলটি লোড করুন।\n\n> **সতর্কতা:** এই ডাটাবেজ ফাইলটি শুধুমাত্র Daily GK ক্লায়েন্টের সাথে সংগতিপূর্ণ।\n\nডাউনলোড নিশ্চিত করতে নিচের **Understand** বাটনে চাপ দিন।",
      "data/ai/readme.md": "# AI Question Bank Readme\n\nWelcome to the Artificial Intelligence specialized pack.\n\n### Specifications:\n1. Covers Machine Learning, LLMs, Deep Learning, and Ethics.\n2. Contains **1,057** verified multiple-choice questions.\n\n```text\nFile Type: PAK format\nChecksum: Validated\nCompatibility: Android, Windows, J2ME\n```\n\nClick **Understand** below to proceed with the download.",
      "readme.md": "# Daily GK Client Applications\n\nInstallation instructions for multi-platform client apps:\n\n* **Android**: Install the `app-release.apk` directly (allow unknown sources if prompted).\n* **Windows**: Run `Daily-GK.bat` directly from Command Prompt or double click.\n* **Feature Phones**: Install `Daily-GK.jar` on Nokia S40/Symbian or `Daily-GK.vbm` on MediaTek devices.\n\nClick **Understand** to confirm and download your client."

    var pendingDownloadFile = null;

    function createXHR() {
      if (window.XMLHttpRequest) return new XMLHttpRequest();
      try { return new ActiveXObject("Msxml2.XMLHTTP.6.0"); } catch (e) {}
      try { return new ActiveXObject("Microsoft.XMLHTTP"); } catch (e) {}
      return null;
    }

    /* Helper: Is this file a README.md file? */
    function isReadmeFile(filePath) {
      if (!filePath) return false;
      var clean = filePath.replace(/\\/g, "/").toLowerCase();
      var parts = clean.split("/");
      var fileName = parts[parts.length - 1];
      return (fileName === "readme.md");
    }

    /* Helper: Get Directory of a file */
    function getFileDirectory(filePath) {
      if (!filePath) return "root";
      var clean = filePath.replace(/\\/g, "/");
      var parts = clean.split("/");
      if (parts.length <= 1) return "root";
      // Directory is everything before the file name
      return parts.slice(0, parts.length - 1).join("/");
    }

    /* Helper: Index readmes by directory */
    function buildReadmeIndex(dataset) {
      var map = {};
      if (!dataset) return map;
      for (var i = 0; i < dataset.length; i++) {
        var it = dataset[i];
        if (isReadmeFile(it.file)) {
          var dir = getFileDirectory(it.file);
          map[dir] = it;
        }
      }
      return map;
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.getElementById("tabBtnPacks").className = "win-tab-btn" + (tabName === "packs" ? " active" : "");
      document.getElementById("tabBtnClients").className = "win-tab-btn" + (tabName === "clients" ? " active" : "");
      document.getElementById("filterInput").value = "";

      if (tabName === "packs") {
        document.getElementById("winTitleText").innerHTML = "Daily GK - Package Explorer [packs.json]";
        if (!packsData) fetchData("packs", "./packs.json", FALLBACK_PACKS);
        else renderCurrentView();
      } else {
        document.getElementById("winTitleText").innerHTML = "Daily GK - Client Apps [clients.json]";
        if (!clientsData) fetchData("clients", "./clients.json", FALLBACK_CLIENTS);
        else renderCurrentView();
      }
    }

    function switchView(viewName) {
      currentView = viewName;
      document.getElementById("btnViewTree").className = "win-btn" + (viewName === "tree" ? " pressed" : "");
      document.getElementById("btnViewSolid").className = "win-btn" + (viewName === "solid" ? " pressed" : "");
      renderCurrentView();
    }

    function fetchData(type, url, fallback) {
      document.getElementById("loadingStatus").style.display = "block";
      var xhr = createXHR();
      if (!xhr) {
        onDataLoaded(type, fallback);
        return;
      }
      xhr.open("GET", url + "?t=" + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 0) {
            try {
              var parsed = window.JSON && window.JSON.parse ? JSON.parse(xhr.responseText) : eval("(" + xhr.responseText + ")");
              onDataLoaded(type, parsed);
            } catch (err) {
              onDataLoaded(type, fallback);
            }
          } else {
            onDataLoaded(type, fallback);
          }
        }
      };
      try { xhr.send(null); } catch (e) { onDataLoaded(type, fallback); }
    }

    function onDataLoaded(type, data) {
      if (type === "packs") packsData = data;
      else clientsData = data;
      renderCurrentView();
    }

    function formatKB(kb) {
      if (!kb) return "0 KB";
      if (kb >= 1024) return (kb / 1024).toFixed(2) + " MB";
      return Math.round(kb) + " KB";
    }

    function getActiveDataset() {
      return (activeTab === "packs") ? (packsData || FALLBACK_PACKS) : (clientsData || FALLBACK_CLIENTS);
    }

    function renderCurrentView() {
      document.getElementById("loadingStatus").style.display = "none";
      var data = getActiveDataset();
      var filterText = (document.getElementById("filterInput").value || "").toLowerCase().trim();

      if (currentView === "solid") {
        renderSolidView(data, filterText);
      } else {
        renderTreeView(data, filterText);
      }
    }

    /* ============================================================
       1. SOLID VIEW RENDERER (Filters out README.md)
       ============================================================ */
    function renderSolidView(list, filter) {
      var container = document.getElementById("workspaceContent");
      container.innerHTML = "";

      var readmeIndex = buildReadmeIndex(list);
      var groups = {};
      var visibleList = [];

      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var filePath = (item.file || "").replace(/\\/g, "/");

        // FEATURE: If it's a README.md, DO NOT show it in file list
        if (isReadmeFile(filePath)) {
          continue;
        }

        if (filter) {
          var matchStr = (item.name + " " + filePath + " " + (item.category || "")).toLowerCase();
          if (matchStr.indexOf(filter) === -1) continue;
        }

        visibleList.push(item);

        var parts = filePath.split("/");
        var fld = (parts.length > 1) ? parts[parts.length - 2] : "root";
        var fileName = parts[parts.length - 1];

        if (!groups[fld]) groups[fld] = { dirKey: getFileDirectory(filePath), items: [] };
        groups[fld].items.push({ data: item, fileName: fileName, fullPath: filePath });
      }

      var keys = [];
      for (var k in groups) { if (groups.hasOwnProperty(k)) keys.push(k); }
      keys.sort();

      if (keys.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No files matching your search.</div>';
        updateStatusBar(visibleList, activeTab);
        return;
      }

      var folderSeq = 0;
      for (var idx = 0; idx < keys.length; idx++) {
        var fldName = keys[idx];
        var groupObj = groups[fldName];
        var items = groupObj.items;
        var dirKey = groupObj.dirKey;
        var hasReadme = !!readmeIndex[dirKey];
        var readmeItem = readmeIndex[dirKey];

        folderSeq++;

        var groupDiv = document.createElement("div");
        groupDiv.className = "solid-folder-group";

        var cId = "solid-grp-" + folderSeq;
        var tId = "solid-tog-" + folderSeq;

        var header = document.createElement("div");
        header.className = "solid-folder-header";
        
        var readmeBadgeHtml = "";
        if (hasReadme) {
          readmeBadgeHtml = '<span class="readme-badge" title="Read folder documentation" onclick="event.stopPropagation(); openReadmeModal(\'' + escapeJsString(readmeItem.file) + '\', null, null);">[README.md]</span>';
        }

        header.innerHTML =
          '<div class="folder-title-left" onclick="toggleBlock(\'' + cId + '\', \'' + tId + '\')">' +
            '<span id="' + tId + '" class="toggle-box">[-]</span> ' +
            '<span>[DIR] ' + fldName + '/ (' + items.length + ' item' + (items.length > 1 ? 's' : '') + ')</span>' +
          '</div>' +
          '<div>' + readmeBadgeHtml + '</div>';

        groupDiv.appendChild(header);

        var listDiv = document.createElement("div");
        listDiv.id = cId;

        for (var j = 0; j < items.length; j++) {
          var fileObj = items[j];
          var d = fileObj.data;
          var badgeText = (activeTab === "packs") ? "PAK" : "APP";

          var row = document.createElement("div");
          row.className = "solid-file-row";

          var metaText = (d.category ? d.category : "General") + " &bull; " +
                         (d.questions ? d.questions.toLocaleString() + " Qs &bull; " : "") +
                         formatKB(d.size_kb);

          // Escaped click triggers to intercept download
          var clickJs = 'handleFileDownloadClick(\'' + escapeJsString(d.file) + '\', \'' + escapeJsString(fileObj.fileName) + '\')';

          row.innerHTML =
            '<div class="file-left">' +
              '<div class="file-title-line">' +
                '<span class="type-badge">' + badgeText + '</span> ' +
                '<a class="file-name-link" href="javascript:void(0)" onclick="' + clickJs + '">' + fileObj.fileName + '</a>' +
              '</div>' +
              '<div class="file-meta-line">' + metaText + '</div>' +
            '</div>' +
            '<div class="file-right">' +
              '<button type="button" class="win-btn btn-download" onclick="' + clickJs + '">Download</button>' +
            '</div>';

          listDiv.appendChild(row);
        }

        groupDiv.appendChild(listDiv);
        container.appendChild(groupDiv);
      }

      updateStatusBar(visibleList, activeTab);
    }

    /* ============================================================
       2. TREE VIEW RENDERER (Filters out README.md)
       ============================================================ */
    function buildTreeStructure(list, filter) {
      var root = { name: (activeTab === "packs" ? "data/" : "root/"), type: "dir", children: {}, dirPath: (activeTab === "packs" ? "data" : "root") };

      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var filePath = (item.file || "").replace(/\\/g, "/");

        // FEATURE: Exclude README.md from tree file items
        if (isReadmeFile(filePath)) continue;

        if (filter) {
          var matchStr = (item.name + " " + filePath + " " + (item.category || "")).toLowerCase();
          if (matchStr.indexOf(filter) === -1) continue;
        }

        var cleanPath = filePath;
        if (activeTab === "packs" && cleanPath.indexOf("data/") === 0) {
          cleanPath = cleanPath.substring(5);
        }

        var parts = cleanPath.split("/");
        var current = root;

        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;

          if (p === parts.length - 1) {
            current.children[part] = { name: part, type: "file", data: item, fullPath: filePath };
          } else {
            if (!current.children[part]) {
              var currPath = (current.dirPath ? current.dirPath + "/" : "") + part;
              current.children[part] = { name: part, type: "dir", children: {}, dirPath: currPath };
            }
            current = current.children[part];
          }
        }
      }
      return root;
    }

    var treeNodeCounter = 0;

    function renderTreeNodes(node, container, readmeIndex) {
      var keys = [];
      for (var k in node.children) {
        if (node.children.hasOwnProperty(k)) keys.push(k);
      }
      keys.sort();

      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var item = node.children[key];

        if (item.type === "dir") {
          treeNodeCounter++;
          var subUlId = "tree-ul-" + treeNodeCounter;
          var togId = "tree-tog-" + treeNodeCounter;

          // Check if this directory has an associated README
          var dirKey = item.dirPath;
          var readmeItem = readmeIndex[dirKey];
          var badgeHtml = "";
          if (readmeItem) {
            badgeHtml = ' <span class="readme-badge" onclick="openReadmeModal(\'' + escapeJsString(readmeItem.file) + '\', null, null)">[README.md]</span>';
          }

          var liDir = document.createElement("li");

          var rowDir = document.createElement("div");
          rowDir.className = "tree-node-row";
          rowDir.innerHTML =
            '<span class="tree-guide">|--</span> ' +
            '<span id="' + togId + '" class="toggle-box" onclick="toggleBlock(\'' + subUlId + '\', \'' + togId + '\')">[-]</span> ' +
            '<span style="font-weight:bold; color:#806000; margin-right:4px;">[DIR]</span> ' +
            '<span class="tree-dir-name" onclick="toggleBlock(\'' + subUlId + '\', \'' + togId + '\')">' + item.name + '/</span>' +
            badgeHtml;

          liDir.appendChild(rowDir);

          var childUl = document.createElement("ul");
          childUl.className = "tree-branch";
          childUl.id = subUlId;

          renderTreeNodes(item, childUl, readmeIndex);

          liDir.appendChild(childUl);
          container.appendChild(liDir);

        } else if (item.type === "file") {
          var d = item.data;
          var badgeText = (activeTab === "packs") ? "PAK" : "APP";

          var liFile = document.createElement("li");

          var rowFile = document.createElement("div");
          rowFile.className = "solid-file-row";
          rowFile.style.border = "none";
          rowFile.style.paddingLeft = "8px";

          var metaText = (d.category ? d.category : "General") + " &bull; " +
                         (d.questions ? d.questions.toLocaleString() + " Qs &bull; " : "") +
                         formatKB(d.size_kb);

          var clickJs = 'handleFileDownloadClick(\'' + escapeJsString(d.file) + '\', \'' + escapeJsString(item.name) + '\')';

          rowFile.innerHTML =
            '<div class="file-left">' +
              '<div class="file-title-line">' +
                '<span class="tree-guide">|--</span> ' +
                '<span class="type-badge">' + badgeText + '</span> ' +
                '<a class="file-name-link" href="javascript:void(0)" onclick="' + clickJs + '">' + item.name + '</a>' +
              '</div>' +
              '<div class="file-meta-line" style="padding-left: 20px;">' + metaText + '</div>' +
            '</div>' +
            '<div class="file-right">' +
              '<button type="button" class="win-btn btn-download" onclick="' + clickJs + '">Download</button>' +
            '</div>';

          liFile.appendChild(rowFile);
          container.appendChild(liFile);
        }
      }
    }

    function renderTreeView(list, filter) {
      var container = document.getElementById("workspaceContent");
      container.innerHTML = "";

      var readmeIndex = buildReadmeIndex(list);
      var rootTree = buildTreeStructure(list, filter);

      var rootUl = document.createElement("ul");
      rootUl.className = "tree-branch root-level";

      treeNodeCounter = 0;
      var rootTogId = "tree-root-tog";
      var rootSubId = "tree-root-sub";

      var rootHeader = document.createElement("div");
      rootHeader.className = "tree-node-row";
      rootHeader.innerHTML =
        '<span id="' + rootTogId + '" class="toggle-box" onclick="toggleBlock(\'' + rootSubId + '\', \'' + rootTogId + '\')">[-]</span> ' +
        '<span style="font-weight:bold; color:#806000; margin-right:4px;">[DIR]</span> ' +
        '<span class="tree-dir-name" onclick="toggleBlock(\'' + rootSubId + '\', \'' + rootTogId + '\')">' + rootTree.name + '</span>';

      rootUl.appendChild(rootHeader);

      var subUl = document.createElement("ul");
      subUl.className = "tree-branch";
      subUl.id = rootSubId;

      renderTreeNodes(rootTree, subUl, readmeIndex);

      if (subUl.children.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No files matching your search.</div>';
        updateStatusBar([], activeTab);
        return;
      }

      rootUl.appendChild(subUl);
      container.appendChild(rootUl);

      // Collect visible items for status bar
      var visibleItems = [];
      for (var i = 0; i < list.length; i++) {
        if (!isReadmeFile(list[i].file)) visibleItems.push(list[i]);
      }
      updateStatusBar(visibleItems, activeTab);
    }

    /* ============================================================
       3. DOWNLOAD INTERCEPTOR & README WORKFLOW
       ============================================================ */
    function handleFileDownloadClick(fileUrl, fileName) {
      var data = getActiveDataset();
      var readmeIndex = buildReadmeIndex(data);
      var dirKey = getFileDirectory(fileUrl);
      var readmeItem = readmeIndex[dirKey];

      if (readmeItem) {
        // Intercept: Open markdown reader modal first
        openReadmeModal(readmeItem.file, fileUrl, fileName);
      } else {
        // Direct download
        executeBrowserDownload(fileUrl, fileName);
      }
    }

    function openReadmeModal(readmeFilePath, targetDownloadUrl, targetDownloadName) {
      pendingDownloadFile = targetDownloadUrl ? { url: targetDownloadUrl, name: targetDownloadName } : null;

      var modal = document.getElementById("readmeModal");
      var title = document.getElementById("readmeModalTitle");
      var content = document.getElementById("readmeModalContent");
      var notice = document.getElementById("readmeModalNotice");
      var btnUnderstand = document.getElementById("btnReadmeUnderstand");

      title.innerHTML = "README.md - " + (targetDownloadName ? "Read Before Downloading (" + targetDownloadName + ")" : "Documentation Viewer");
      
      if (targetDownloadName) {
        notice.innerHTML = "<strong>Notice:</strong> Please read this documentation before downloading <strong>" + escapeHtml(targetDownloadName) + "</strong>. Click <strong>Understand</strong> below to proceed.";
        btnUnderstand.innerHTML = "Understand &amp; Download";
      } else {
        notice.innerHTML = "<strong>Documentation:</strong> Viewing folder instructions.";
        btnUnderstand.innerHTML = "Understand";
      }

      content.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">Loading README content...</div>';
      modal.style.display = "flex";

      // Fetch or use cached
      loadReadmeText(readmeFilePath, function(rawMarkdown) {
        content.innerHTML = parseMarkdownToHtml(rawMarkdown);
      });
    }

    function loadReadmeText(filePath, callback) {
      var normalized = (filePath || "").replace(/\\/g, "/").toLowerCase();

      // Check cache first
      if (markdownContentCache[normalized]) {
        callback(markdownContentCache[normalized]);
        return;
      }

      var xhr = createXHR();
      if (!xhr) {
        var fallbackText = FALLBACK_MARKDOWN_CACHE[normalized] || ("# README\n\nNo active connection available for `" + filePath + "`.");
        markdownContentCache[normalized] = fallbackText;
        callback(fallbackText);
        return;
      }

      xhr.open("GET", filePath + "?t=" + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 0) {
            var text = xhr.responseText;
            // Check if returned valid content or fallback
            if (!text || text.indexOf("<!DOCTYPE") !== -1 || text.indexOf("<html") !== -1) {
              text = FALLBACK_MARKDOWN_CACHE[normalized] || ("# README\n\nFile: `" + filePath + "`\n\nPlease ensure you review all safety notes before downloading.");
            }
            markdownContentCache[normalized] = text;
            callback(text);
          } else {
            var fallback = FALLBACK_MARKDOWN_CACHE[normalized] || ("# README.md\n\nDocumentation for folder `" + filePath + "`\n\nPlease proceed responsibly.");
            markdownContentCache[normalized] = fallback;
            callback(fallback);
          }
        }
      };
      try {
        xhr.send(null);
      } catch (e) {
        var fb = FALLBACK_MARKDOWN_CACHE[normalized] || "# README\n\nDirect network fetch not permitted in local sandbox.";
        callback(fb);
      }
    }

    function onReadmeUnderstand() {
      var fileToGet = pendingDownloadFile;
      closeReadmeModal();

      if (fileToGet && fileToGet.url) {
        executeBrowserDownload(fileToGet.url, fileToGet.name);
      }
    }

    function closeReadmeModal() {
      document.getElementById("readmeModal").style.display = "none";
      pendingDownloadFile = null;
    }

    function executeBrowserDownload(url, filename) {
      var a = document.createElement("a");
      a.href = url;
      if (filename) a.download = filename;
      else a.download = "";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    /* ============================================================
       4. LIGHTWEIGHT MARKDOWN-TO-HTML PARSER (WORKS IN ANY BROWSER)
       ============================================================ */
    function escapeHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeJsString(str) {
      return (str || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "\\\"");
    }

    function parseMarkdownToHtml(md) {
      if (!md) return "<p><em>Readme file is empty.</em></p>";

      var lines = md.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      var html = [];
      var inList = false;
      var listType = "";
      var inCode = false;
      var codeBuffer = [];

      for (var i = 0; i < lines.length; i++) {
        var rawLine = lines[i];

        // Code block toggle (```)
        if (rawLine.match(/^```/)) {
          if (inCode) {
            html.push('<pre><code>' + codeBuffer.join("\n") + '</code></pre>');
            codeBuffer = [];
            inCode = false;
          } else {
            if (inList) { html.push('</' + listType + '>'); inList = false; }
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          codeBuffer.push(escapeHtml(rawLine));
          continue;
        }

        // Horizontal line (--- or ***)
        if (rawLine.match(/^(?:---|\*\*\*|___)\s*$/)) {
          if (inList) { html.push('</' + listType + '>'); inList = false; }
          html.push('<hr />');
          continue;
        }

        // Headings (#, ##, ###)
        var hMatch = rawLine.match(/^(#{1,6})\s+(.*)$/);
        if (hMatch) {
          if (inList) { html.push('</' + listType + '>'); inList = false; }
          var level = hMatch[1].length;
          var hTag = "h" + (level > 4 ? 4 : level);
          html.push('<' + hTag + '>' + parseInlineMarkdown(escapeHtml(hMatch[2])) + '</' + hTag + '>');
          continue;
        }

        // Blockquotes (> )
        var bqMatch = rawLine.match(/^>\s?(.*)$/);
        if (bqMatch) {
          if (inList) { html.push('</' + listType + '>'); inList = false; }
          html.push('<blockquote>' + parseInlineMarkdown(escapeHtml(bqMatch[1])) + '</blockquote>');
          continue;
        }

        // Unordered lists (* or -)
        var ulMatch = rawLine.match(/^[\*\-]\s+(.*)$/);
        if (ulMatch) {
          if (!inList || listType !== "ul") {
            if (inList) html.push('</' + listType + '>');
            html.push('<ul>');
            inList = true;
            listType = "ul";
          }
          html.push('<li>' + parseInlineMarkdown(escapeHtml(ulMatch[1])) + '</li>');
          continue;
        }

        // Ordered lists (1. )
        var olMatch = rawLine.match(/^\d+\.\s+(.*)$/);
        if (olMatch) {
          if (!inList || listType !== "ol") {
            if (inList) html.push('</' + listType + '>');
            html.push('<ol>');
            inList = true;
            listType = "ol";
          }
          html.push('<li>' + parseInlineMarkdown(escapeHtml(olMatch[1])) + '</li>');
          continue;
        }

        // If regular line, close open lists
        if (inList) {
          html.push('</' + listType + '>');
          inList = false;
        }

        // Empty lines
        if (rawLine.trim() === "") {
          continue;
        }

        // Paragraph
        html.push('<p>' + parseInlineMarkdown(escapeHtml(rawLine)) + '</p>');
      }

      if (inCode) {
        html.push('<pre><code>' + codeBuffer.join("\n") + '</code></pre>');
      }
      if (inList) {
        html.push('</' + listType + '>');
      }

      return html.join("\n");
    }

    function parseInlineMarkdown(str) {
      if (!str) return "";
      // Inline code
      str = str.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Bold
      str = str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      str = str.replace(/__([^_]+)__/g, '<strong>$1</strong>');
      // Italic
      str = str.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      str = str.replace(/_([^_]+)_/g, '<em>$1</em>');
      // Strikethrough
      str = str.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      // Links
      str = str.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      return str;
    }

    /* ============================================================
       5. GENERAL CONTROLS
       ============================================================ */
    function toggleBlock(contentId, toggleId) {
      var el = document.getElementById(contentId);
      var tog = document.getElementById(toggleId);
      if (!el) return;

      var isHidden = (el.className.indexOf("tree-collapsed") !== -1);
      if (isHidden) {
        el.className = el.className.replace(/\btree-collapsed\b/g, "").replace(/^\s+|\s+$/g, "");
        if (tog) tog.innerHTML = "[-]";
      } else {
        el.className += " tree-collapsed";
        if (tog) tog.innerHTML = "[+]";
      }
    }

    function applyFilter(text) {
      renderCurrentView();
    }

    function clearFilter() {
      document.getElementById("filterInput").value = "";
      renderCurrentView();
    }

    function updateStatusBar(list, tabType) {
      var totalKb = 0;
      var totalQs = 0;

      for (var i = 0; i < list.length; i++) {
        totalKb += (list[i].size_kb || 0);
        if (list[i].questions) totalQs += list[i].questions;
      }

      document.getElementById("sb-status").innerHTML = "Ready.";
      document.getElementById("sb-objects").innerHTML = list.length + " File(s)";
      document.getElementById("sb-extra").innerHTML = (tabType === "packs") ? (totalQs.toLocaleString() + " Questions") : (list.length + " Platforms");
      document.getElementById("sb-size").innerHTML = (totalKb / 1024).toFixed(2) + " MB";
    }

    window.onload = function() {
      switchTab("packs");
    };
  </script>
