name: Build Desktop Apps (Win, Mac, Linux)

on:
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'macos-latest'
            os_name: 'macos'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Compiler
        uses: dtolnay/rust-toolchain@stable

      # Required dependencies for Linux WebKit
      - name: Install Linux Build Dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Install Project Dependencies
        run: npm install

      # Verify that index.html is in the right place
      - name: Verify HTML5 Directory
        shell: bash
        run: |
          if [ ! -f "clients/compiled/html5/index.html" ]; then
            echo "ERROR: clients/compiled/html5/index.html not found!"
            ls -R clients/
            exit 1
          fi

      # Force icon generation into src-tauri/icons using icons/icon-512.png
      - name: Generate App Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          npx @tauri-apps/cli icon icons/icon-512.png -o src-tauri/icons

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Copy built packages to clients/compiled/<os_name>/
      - name: Copy Build Artifacts to clients/compiled
        shell: bash
        run: |
          mkdir -p clients/compiled/${{ matrix.os_name }}
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe clients/compiled/windows/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/msi/*.msi clients/compiled/windows/ 2>/dev/null || true
          elif [ "${{ matrix.os_name }}" = "macos" ]; then
            cp src-tauri/target/release/bundle/dmg/*.dmg clients/compiled/macos/ 2>/dev/null || true
          elif [ "${{ matrix.os_name }}" = "linux" ]; then
            cp src-tauri/target/release/bundle/deb/*.deb clients/compiled/linux/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage clients/compiled/linux/ 2>/dev/null || true
          fi

      # Upload Installers from clients/compiled
      - name: Upload Windows Installers (.exe & .msi)
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Daily-GK-Windows-Installers
          path: clients/compiled/windows/*

      - name: Upload macOS Installer (.dmg)
        if: matrix.os_name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: Daily-GK-macOS-Installer
          path: clients/compiled/macos/*

      - name: Upload Linux Installers (.deb & .AppImage)
        if: matrix.os_name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Daily-GK-Linux-Installers
          path: clients/compiled/linux/*
