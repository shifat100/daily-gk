name: Build Desktop Apps (Win, Mac, Linux)

on:
  workflow_dispatch: # Allows you to trigger the build manually with a single click
  push:
    paths:
      - 'clients/compiled/html5/**'
      - 'src-tauri/**'

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'macos-latest'
            os_name: 'macos'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Compiler
        uses: dtolnay/rust-toolchain@stable

      # Required dependencies for Linux WebKit
      - name: Install Linux Build Dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Install Project Dependencies
        run: npm install

      # Uses your root icon-512.png to automatically generate Windows .ico and Mac .icns
      - name: Generate App Icons
        run: npx @tauri-apps/cli icon icon-512.png

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the created installers so you can download them directly
      - name: Upload Windows Installers (.exe & .msi)
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Daily-GK-Windows-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS Installer (.dmg)
        if: matrix.os_name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: Daily-GK-macOS-Installer
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux Installers (.deb & .AppImage)
        if: matrix.os_name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Daily-GK-Linux-Installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
