name: Build Desktop Apps (Win, Mac, Linux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # ১. BUILD MATRIX (WINDOWS, MAC, LINUX)
  # ==========================================
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'macos-latest'
            os_name: 'macos'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Compiler
        uses: dtolnay/rust-toolchain@stable

      # Required dependencies for Linux WebKit
      - name: Install Linux Build Dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Install Project Dependencies
        run: npm install

      # Verify that index.html is in the right place
      - name: Verify HTML5 Directory
        shell: bash
        run: |
          if [ ! -f "clients/compiled/html5/index.html" ]; then
            echo "ERROR: clients/compiled/html5/index.html not found!"
            ls -R clients/
            exit 1
          fi

      # Force icon generation into src-tauri/icons using icons/icon-512.png
      - name: Generate App Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          npx @tauri-apps/cli icon icons/icon-512.png -o src-tauri/icons

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Copy built packages to staging folder
      - name: Copy Build Artifacts
        shell: bash
        run: |
          mkdir -p staging/${{ matrix.os_name }}
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe staging/windows/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/msi/*.msi staging/windows/ 2>/dev/null || true
          elif [ "${{ matrix.os_name }}" = "macos" ]; then
            cp src-tauri/target/release/bundle/dmg/*.dmg staging/macos/ 2>/dev/null || true
          elif [ "${{ matrix.os_name }}" = "linux" ]; then
            cp src-tauri/target/release/bundle/deb/*.deb staging/linux/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage staging/linux/ 2>/dev/null || true
          fi

      # Temporary upload for the commit job
      - name: Upload Temporary Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os_name }}
          path: staging/${{ matrix.os_name }}/*

  # ==========================================
  # ২. COMMIT & PUSH TO GITHUB REPO
  # ==========================================
  commit-and-push:
    name: Commit & Push Desktop Binaries
    needs: [build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: clients/compiled/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: clients/compiled/macos

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: clients/compiled/linux

      - name: Commit and Push Changes to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # তৈরি হওয়া ফাইলগুলো গিট ট্র্যাকিংয়ে যুক্ত করা
          git add clients/compiled/windows/ clients/compiled/macos/ clients/compiled/linux/

          # কোনো ফাইল আপডেট হলে তবেই পুশ করবে
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(build): automated desktop binaries update [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
