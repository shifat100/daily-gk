name: Generate PAKs & Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'build_all_packs.py'
      - '.github/workflows/build-paks.yml'

jobs:
  generate-paks:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Run Self-Contained PAK Builder
        run: python build_all_packs.py

      - name: Commit and Push PAKs & packs.json
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ packs.json
          
          if git status --porcelain | grep -E '\.pak|packs\.json'; then
            git commit -m "Generate PAK files and update packs.json"
            git push origin HEAD:${{ github.ref }}
            echo "Successfully generated and pushed PAK files."
          else
            echo "No package changes detected."
          fi
