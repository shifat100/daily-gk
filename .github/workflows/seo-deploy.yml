name: Build SEO Files Only

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/build_seo.py'
  schedule:
    - cron: '0 18 * * *'    # প্রতিদিন বাংলাদেশ সময় রাত ১২টায় (UTC 18:00)
  workflow_dispatch:

concurrency:
  group: seo-build-only
  cancel-in-progress: false

jobs:
  build-seo:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Built-in GitHub Pages auto-host ট্রিগার করতে Repo Secret-এ GH_PAT যোগ করুন
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SEO Files Only
        run: python scripts/build_seo.py

      - name: Commit and Push SEO Files
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml robots.txt
          if [ -d "topics" ]; then git add -A topics/; fi
          if ! git diff --quiet index.html 2>/dev/null; then git add index.html; fi

          if git diff --staged --quiet; then
            echo "No SEO changes to commit."
          else
            git commit -m "chore: update SEO files [skip ci]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
